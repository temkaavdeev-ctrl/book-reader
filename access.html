<style>
:root{
 --bg:#FBFAF7; --ink:#17150F; --ink2:#56504A; --meta:#6E675E; --line:#ECE7DD; --card:#fff;
 --gold:#97591A; --gold-br:#C98A3A; --on:#fff;
 --pill:999px; --r:18px; --rs:14px;
 --sh:0 2px 12px rgba(20,17,12,.05),0 1px 2px rgba(20,17,12,.04);
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;padding:0 22px calc(40px + env(safe-area-inset-bottom));background:var(--bg)}
.hero{padding:64px 0 8px;text-align:center}
.logo{width:54px;height:54px;margin:0 auto 18px;border-radius:15px;background:linear-gradient(150deg,#C98A3A,#8A5520);display:flex;align-items:center;justify-content:center}
.logo svg{width:30px;height:30px;color:#1A1407}
.httl{font-size:32px;line-height:38px;font-weight:800;letter-spacing:-.025em}
.brand{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--gold-br);margin-bottom:12px}
.httl.inv{font-size:30px;line-height:36px}
.hsub{font-size:16px;line-height:24px;color:var(--ink2);margin-top:10px;max-width:440px;margin-left:auto;margin-right:auto}
.cta{margin-top:26px;display:flex;flex-direction:column;gap:11px;max-width:360px;margin-left:auto;margin-right:auto}
.btn{height:52px;border-radius:var(--rs);border:0;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--gold);color:var(--on)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.ways{margin-top:14px;display:flex;flex-direction:column;gap:11px}
.way{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.way .wn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--on);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.way .wt{font-size:15px;font-weight:700;color:var(--ink)}
.way .wd{font-size:13.5px;line-height:19px;color:var(--ink2);margin-top:3px}
.way .wcta{display:inline-block;margin-top:9px;font-size:14px;font-weight:700;color:var(--gold);text-decoration:none;padding:14px 10px;margin-left:-10px;margin-bottom:-14px}
.sections{margin-top:44px;display:grid;gap:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.sec .n{font-size:12px;font-weight:700;color:var(--gold-br);letter-spacing:.04em}
.sec h3{font-size:19px;font-weight:700;margin:7px 0 6px;letter-spacing:-.01em}
.sec p{font-size:15px;line-height:22px;color:var(--ink2);margin:0}
.example{margin-top:34px}
.example .lbl{font-size:13px;font-weight:600;color:var(--meta);text-align:center;margin-bottom:12px}
.card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.card .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:var(--pill);padding:4px 11px;margin-bottom:10px}
.card .chip .d{width:8px;height:8px;border-radius:50%;background:#B8801F}
.card h2{font-size:22px;line-height:27px;font-weight:800;letter-spacing:-.01em;margin:2px 0 10px}
.card .lead{font-size:15px;line-height:23px;color:var(--ink)}
.card .honest{margin-top:16px;background:linear-gradient(160deg,#241E18,#15110C);color:#EFE6D7;border-radius:12px;padding:15px}
.card .honest .l{font-size:12px;font-weight:700;color:var(--gold-br);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.card .honest .b{font-size:14px;line-height:21px}
.note{margin-top:14px;text-align:center;font-size:13px;line-height:19px;color:var(--meta)}
.panel{max-width:380px;margin:36px auto 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}
.panel h2{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.panel .ps{font-size:14px;color:var(--ink2);margin-bottom:18px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input{width:100%;height:48px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;padding:0 14px;outline:none}
.fld input:focus{border-color:var(--gold-br)}
.err{font-size:13px;color:#C2452F;margin:6px 0 0;min-height:18px}
.link{font-size:14px;color:var(--gold);cursor:pointer;background:none;border:0;padding:14px 10px;margin:-10px -10px -10px -10px;min-height:44px}
.back{position:absolute;top:18px;left:18px;width:42px;height:42px;border:0;background:none;color:var(--ink2);cursor:pointer}
/*TAP-FEEDBACK*/button:active,a:active,[onclick]:active,.ni:active,[data-k]:active,[data-route]:active,[data-slug]:active,[data-cont]:active,[data-q]:active,.row:active,.rt-row:active,.lg-row:active,.fc:active,.stoprow:active,.opt:active,.pill:active,.tab:active,.deeper:active{opacity:.6;transition:opacity .06s}
/*MCUX v1 — единый UX: нативные переходы между страницами, ховеры, тап-фидбек, reduced-motion*/
@view-transition{navigation:auto}
.nav{view-transition-name:mcnav}
button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.pill:active{opacity:.6;transition:opacity .06s}
@media(hover:hover){a:hover,button:hover,.ni:hover,.mrow:hover,.row:hover,.res:hover,.tbtn:hover,.fc:hover,.opt:hover,[data-k]:hover,[data-slug]:hover,[data-cont]:hover,[data-route]:hover,[data-q]:hover{opacity:.85;transition:opacity .12s ease;cursor:pointer}}
@media(hover:none){button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.lp:active,.rc:active,.cont:active,.hero:active,.scd:active,.tl:active,.fd:active,.lk:active,.deeper:active,[data-k]:active,[data-slug]:active,[data-cont]:active,[data-route]:active,[data-q]:active{opacity:.72;transform:scale(.97);transition:transform .06s ease,opacity .06s}}
a:focus-visible,button:focus-visible,[onclick]:focus-visible,.ni:focus-visible,.mrow:focus-visible,.row:focus-visible,.res:focus-visible,.tbtn:focus-visible,.fc:focus-visible,.opt:focus-visible,.lp:focus-visible,.rc:focus-visible,[data-k]:focus-visible,[data-slug]:focus-visible,[data-cont]:focus-visible,[data-route]:focus-visible{outline:2px solid var(--gold,#B06A1F);outline-offset:2px;border-radius:6px}
.mcstate{padding:46px 20px;text-align:center;color:var(--meta,#8B847B)}
.mcstate .ic{font-size:30px;line-height:1;margin-bottom:12px;opacity:.75}
.mcstate .msg{font-size:14.5px;line-height:20px;max-width:300px;margin:0 auto}
.mcstate .retry{margin-top:16px;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--gold,#B06A1F);background:none;border:1px solid var(--line,#ECE7DD);border-radius:999px;padding:9px 18px;cursor:pointer}
.mcsk{background:linear-gradient(90deg,#EFEBE2,#F6F3ED,#EFEBE2);background-size:200% 100%;animation:mcsh 1.2s infinite;border-radius:12px}
@keyframes mcsh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/*MCDESK v1 — десктоп (>=960px): нижний таб-бар -> левый сайдбар, контент смещается вправо; мобилка не трогается*/
@media(min-width:960px){
 body:has(nav.nav){padding-left:236px}
 nav.nav{top:0;bottom:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:0}
 nav.nav .navin{flex-direction:column;align-items:stretch;height:100vh;max-width:none;margin:0;padding:22px 14px;gap:3px}
 nav.nav .ni{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;min-height:0;height:auto;padding:12px 14px;border-radius:12px}
 nav.nav .ni svg{width:22px;height:22px}
 nav.nav .ni .lb{font-size:15px;font-weight:600}
 nav.nav .ni.on{background:rgba(176,106,31,.09)}
 @media(hover:hover){nav.nav .ni:hover{background:rgba(176,106,31,.06);opacity:1}}
 body:has(nav.nav) .topbar{left:236px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

<style>/*mc:dark v1 — единая тёмная тема; выбор — «Моё» (localStorage mc:theme), до JS — системный фолбэк*/
html[data-theme="dark"]{--bg:#100D0A;--ink:#F2ECE0;--ink2:#C6BDAF;--meta:#948B7D;--line:#2B2620;--card:#191510;--on:#fff;--gold:#D69A4C;--gold-br:#E0A24E;--sh:0 2px 12px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.34);background:#100D0A!important}

 html:not([data-theme]) .mcsk{background:linear-gradient(90deg,#1b1710,#241f16,#1b1710);background-size:200% 100%}
}

<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var CODE=(window.McAuth&&McAuth.parseInviteCode)?McAuth.parseInviteCode():null;
var WANT_LOGIN=(function(){try{return new URLSearchParams(location.search).get('view')==='login';}catch(e){return false;}})();
var HOME='path.html';
var OIDC_PROVIDER='custom:authelia';
function ruErr(m){ return (window.McAuth&&McAuth.authErr)?McAuth.authErr(m):String(m||''); }

function stashInvite(code, name){
 try{
  if(code) sessionStorage.setItem('mc:invite', code);
  if(name) sessionStorage.setItem('mc:invite-name', name);
 }catch(e){}
}
function takeInvite(){
 try{
  var c=sessionStorage.getItem('mc:invite')||'';
  var n=sessionStorage.getItem('mc:invite-name')||'';
  sessionStorage.removeItem('mc:invite');
  sessionStorage.removeItem('mc:invite-name');
  return {code:c, name:n};
 }catch(e){ return {code:'', name:''}; }
}
function goHome(){ location.replace(HOME); }
function startOidc(){
 var err=document.getElementById('err');
 if(!window.__SB){ if(err) err.textContent='Нет соединения с базой — попробуйте онлайн.'; return; }
 var btn=document.getElementById('doOidc'); if(btn){ btn.disabled=true; btn.textContent='Открываем вход…'; }
 var redirectTo=location.origin+'/access.html'+(CODE?('?invite='+encodeURIComponent(CODE)):(WANT_LOGIN?'?view=login':''));
 window.__SB.auth.signInWithOAuth({
  provider: OIDC_PROVIDER,
  options: { redirectTo: redirectTo }
 }).then(function(r){
  if(r&&r.error){ if(btn){ btn.disabled=false; btn.textContent='Войти через ar1adna'; } if(err) err.textContent=ruErr(r.error.message); }
 }).catch(function(){ if(btn){ btn.disabled=false; btn.textContent='Войти через ar1adna'; } if(err) err.textContent='Не удалось начать вход через ar1adna.'; });
}
function afterSession(SB, sess){
 var pending=takeInvite();
 var name=pending.name || (sess&&sess.user&&sess.user.user_metadata&&(sess.user.user_metadata.name||sess.user.user_metadata.full_name)) || '';
 var code=pending.code || CODE || '';
 var args={};
 if(code) args.p_code=code;
 if(name) args.p_name=name;
 function go(){ goHome(); }
 if(!SB||!sess){ go(); return; }
 SB.rpc('membership_after_auth', args).then(function(){ go(); }, function(){
  if(window.McAuth&&McAuth.finishAuth){
   McAuth.finishAuth(SB,sess,{ inviteCode:code||null, inviteName:name }).then(function(){ go(); }, function(){
    if(pending.code) stashInvite(pending.code, pending.name);
    go();
   });
  } else {
   if(pending.code) stashInvite(pending.code, pending.name);
   go();
  }
 });
}

  (mode==='join'?'<div class="fld"><label for="pass">Пароль</label><input id="pass" type="password" autocomplete="new-password" placeholder="Пароль, от 6 символов"></div>':

  '</details>';
}

function tasteCard(lbl){
 return '<div class="example"><div class="lbl">'+esc(lbl||'Например, NPS — и почему его надёжность под вопросом:')+'</div>'+

}

 var who=(info&&(info.inviter_name||info.inviter||info.name))||'';
 var head=who?(esc(who)+' пригласил вас'):'Вас пригласили';

 document.getElementById('doOidc').onclick=function(){

function login(){
 document.getElementById('back').style.display='';
 document.getElementById('wrap').innerHTML='<div class="panel"><h2>Вход</h2><div class="ps">Тот же вход, что на ar1adna.com. Членство книги — по приглашению, не этим экраном.</div>'+

 document.getElementById('back').onclick=route;
 document.getElementById('doOidc').onclick=function(){ if(CODE) stashInvite(CODE, ''); startOidc(); };

function wireMail(mode, code){
 var mail=document.getElementById('doMail');
 if(mail) mail.onclick=function(){ doAuth(mode, code); };
 var forgot=document.getElementById('forgot');
 if(forgot) forgot.onclick=function(){
  var em=(document.getElementById('email')||{}).value; var e=document.getElementById('errMail')||document.getElementById('err');
  if(!e) return;
  if(!em){ e.textContent='Введите email выше — пришлём ссылку для сброса.'; return; }
  if(!window.__SB){ e.textContent='Нет соединения — попробуйте онлайн.'; return; }
  window.__SB.auth.resetPasswordForEmail(em).then(function(r){ if(r&&r.error){ e.textContent=ruErr(r.error.message); return; } e.style.color='var(--gold-br)'; e.textContent='Ссылка для сброса отправлена на '+em+'.'; }).catch(function(){ e.textContent='Не удалось отправить. Попробуйте позже.'; });
 };
}

function doAuth(mode,code){
 var err=document.getElementById('errMail')||document.getElementById('err'); if(err) err.textContent='';
 var email=((document.getElementById('email')||{}).value||'').trim();
 var pass=(document.getElementById('pass')||{}).value;
 var name=((document.getElementById('name')||{}).value||'').trim();
 if(!email||!pass){ if(err) err.textContent='Введите email и пароль.'; return; }
 if(mode==='join' && !name){ if(err) err.textContent='Укажите имя.'; return; }
 if(!window.__SB){ if(err) err.textContent='Нет соединения с базой — попробуйте онлайн.'; return; }
 if(mode==='login'){
  if(CODE) stashInvite(CODE, name||'');
  window.__SB.auth.signInWithPassword({email:email,password:pass}).then(function(r){ if(r.error){ if(err) err.textContent=ruErr(r.error.message); } else { afterSession(window.__SB, r.data&&r.data.session); } }).catch(function(){ if(err) err.textContent='Не удалось войти.'; });
 } else {
  stashInvite(code, name);
  window.__SB.auth.signUp({email:email,password:pass,options:{data:{name:name}}}).then(function(r){ if(r.error){ if(err) err.textContent=ruErr(r.error.message); return; }
   if(!(r.data&&r.data.session)){ if(err) err.textContent='Аккаунт создан. Подтвердите почту, затем войдите.'; return; }
   afterSession(window.__SB, r.data.session);
  }).catch(function(){ if(err) err.textContent='Не удалось создать аккаунт.'; });
 }
}

function mcLikelySignedIn(){ return (window.McAuth&&McAuth.mcLikelySession)?McAuth.mcLikelySession():false; }
function branchInvite(SB){ SB.rpc('invite_info',{p_code:CODE}).then(function(r){ var info=(r&&!r.error&&r.data)||null;
  if(info&&info.valid){ stateA(info,CODE); }
  else if(info&&(info.reason==='expired'||info.reason==='redeemed'||info.expired||info.redeemed)){ deadEnd(info); }
  else { stateB(true); }
 }).catch(function(){ stateB(!!CODE); }); }
function route(){
 if(CODE){ loadingState(); return; }
 if(WANT_LOGIN){ login(); return; }
 if(mcLikelySignedIn()){ loadingState(); return; }
 stateB();
}
route();

   SB.auth.getSession().then(function(s){ var sess=s&&s.data&&s.data.session;

 }

 function cfgFail(){ try{ var b=document.getElementById('back'); if(b) b.style.display='none'; }catch(e){}
  document.getElementById('wrap').innerHTML='<div class="mcstate"><div class="ic">⚠</div><div class="msg">Не удалось подключиться. Если не загружается — отключите VPN.</div><button class="retry" onclick="location.reload()">↻ Повторить</button></div>'; }
  loadCfg(function(){ if(!window.SUPABASE_URL){ if(CODE||WANT_LOGIN) cfgFail(); return; }
   load('vendor/supabase.min.js', function(){ if(!(window.supabase&&window.supabase.createClient)){ if(CODE||WANT_LOGIN) cfgFail(); return; } go(); }); });
})();
