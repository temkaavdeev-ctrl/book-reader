<html lang="ru" style="background:#0E0C0A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Вход · Матчасть</title>
<style>
:root{
 --sky0:#0E0C0A; --sky1:#15110C; --sky2:#1C1812;
 --ink:#F4EEE2; --ink2:#C2B8A6; --meta:#897F70; --line:#2A241C;
 --gold:#C98A3A; --gold-br:#E7C07A;
 --solid:#7FD49B; --mixed:#E7C07A;
 --pill:999px; --r:18px; --rs:13px;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--sky0);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;padding:0 22px calc(40px + env(safe-area-inset-bottom));background:radial-gradient(120% 60% at 50% 0%,#1C1812,#15110C 50%,#0E0C0A)}
.hero{padding:64px 0 8px;text-align:center}
.logo{width:54px;height:54px;margin:0 auto 18px;border-radius:15px;background:linear-gradient(150deg,#C98A3A,#8A5520);display:flex;align-items:center;justify-content:center}
.logo svg{width:30px;height:30px;color:#1A1407}
.httl{font-size:32px;line-height:38px;font-weight:800;letter-spacing:-.025em}
.brand{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--gold-br);margin-bottom:12px}
.httl.inv{font-size:30px;line-height:36px}
.hsub{font-size:16px;line-height:24px;color:var(--ink2);margin-top:10px;max-width:440px;margin-left:auto;margin-right:auto}
.cta{margin-top:26px;display:flex;flex-direction:column;gap:11px;max-width:360px;margin-left:auto;margin-right:auto}
.btn{height:52px;border-radius:var(--rs);border:0;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--gold);color:#1A1407}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
/* 6b31d280: явный путь получить приглашение (гость) */
.ways{margin-top:14px;display:flex;flex-direction:column;gap:11px}
.way{display:flex;gap:12px;background:rgba(28,24,18,.6);border:1px solid var(--line);border-radius:14px;padding:14px}
.way .wn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#1A1407;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.way .wt{font-size:15px;font-weight:700;color:var(--ink)}
.way .wd{font-size:13.5px;line-height:19px;color:var(--ink2);margin-top:3px}
.way .wcta{display:inline-block;margin-top:9px;font-size:14px;font-weight:700;color:var(--gold-br);text-decoration:none;padding:14px 10px;margin-left:-10px;margin-bottom:-14px}
.sections{margin-top:44px;display:grid;gap:14px}
.sec{background:rgba(28,24,18,.7);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.sec .n{font-size:12px;font-weight:700;color:var(--gold-br);letter-spacing:.04em}
.sec h3{font-size:19px;font-weight:700;margin:7px 0 6px;letter-spacing:-.01em}
.sec p{font-size:15px;line-height:22px;color:var(--ink2);margin:0}
.example{margin-top:34px}
.example .lbl{font-size:13px;font-weight:600;color:var(--meta);text-align:center;margin-bottom:12px}
.card{background:#fff;color:#17150F;border-radius:var(--r);padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.card .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#56504A;background:#FBFAF7;border:1px solid #ECE7DD;border-radius:var(--pill);padding:4px 11px;margin-bottom:10px}
.card .chip .d{width:8px;height:8px;border-radius:50%;background:#B8801F}
.card h2{font-size:22px;line-height:27px;font-weight:800;letter-spacing:-.01em;margin:2px 0 10px}
.card .lead{font-size:15px;line-height:23px;color:#17150F}
.card .honest{margin-top:16px;background:#211C16;color:#EFE6D7;border-radius:12px;padding:15px}
.card .honest .l{font-size:12px;font-weight:700;color:var(--gold-br);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.card .honest .b{font-size:14px;line-height:21px}
.note{margin-top:14px;text-align:center;font-size:13px;line-height:19px;color:var(--meta)}
/* формы */
.panel{max-width:380px;margin:36px auto 0;background:rgba(28,24,18,.8);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.panel h2{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.panel .ps{font-size:14px;color:var(--ink2);margin-bottom:18px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input{width:100%;height:48px;border-radius:11px;border:1px solid var(--line);background:#0E0C0A;color:var(--ink);font-size:16px;padding:0 14px;outline:none}
.fld input:focus{border-color:var(--gold-br)}
.err{font-size:13px;color:#E78A78;margin:6px 0 0;min-height:18px}
.link{font-size:14px;color:var(--gold-br);cursor:pointer;background:none;border:0;padding:14px 10px;margin:-10px -10px -10px -10px;min-height:44px}
.back{position:absolute;top:18px;left:18px;width:42px;height:42px;border:0;background:none;color:var(--ink2);cursor:pointer}
/*TAP-FEEDBACK*/button:active,a:active,[onclick]:active,.ni:active,[data-k]:active,[data-route]:active,[data-slug]:active,[data-cont]:active,[data-q]:active,.row:active,.rt-row:active,.lg-row:active,.fc:active,.stoprow:active,.opt:active,.pill:active,.tab:active,.deeper:active{opacity:.6;transition:opacity .06s}
/*MCUX v1 — единый UX: нативные переходы между страницами, ховеры, тап-фидбек, reduced-motion*/
@view-transition{navigation:auto}
.nav{view-transition-name:mcnav}
button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.pill:active{opacity:.6;transition:opacity .06s}
@media(hover:hover){a:hover,button:hover,.ni:hover,.mrow:hover,.row:hover,.res:hover,.tbtn:hover,.fc:hover,.opt:hover,[data-k]:hover,[data-slug]:hover,[data-cont]:hover,[data-route]:hover,[data-q]:hover{opacity:.85;transition:opacity .12s ease;cursor:pointer}}
@media(hover:none){button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.lp:active,.rc:active,.cont:active,.hero:active,.scd:active,.tl:active,.fd:active,.lk:active,.deeper:active,[data-k]:active,[data-slug]:active,[data-cont]:active,[data-route]:active,[data-q]:active{opacity:.72;transform:scale(.97);transition:transform .06s ease,opacity .06s}}
a:focus-visible,button:focus-visible,[onclick]:focus-visible,.ni:focus-visible,.mrow:focus-visible,.row:focus-visible,.res:focus-visible,.tbtn:focus-visible,.fc:focus-visible,.opt:focus-visible,.lp:focus-visible,.rc:focus-visible,[data-k]:focus-visible,[data-slug]:focus-visible,[data-cont]:focus-visible,[data-route]:focus-visible{outline:2px solid var(--gold,#B06A1F);outline-offset:2px;border-radius:6px}
.mcstate{padding:46px 20px;text-align:center;color:var(--meta,#8B847B)}
.mcstate .ic{font-size:30px;line-height:1;margin-bottom:12px;opacity:.75}
.mcstate .msg{font-size:14.5px;line-height:20px;max-width:300px;margin:0 auto}
.mcstate .retry{margin-top:16px;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--gold,#B06A1F);background:none;border:1px solid var(--line,#ECE7DD);border-radius:999px;padding:9px 18px;cursor:pointer}
.mcsk{background:linear-gradient(90deg,#EFEBE2,#F6F3ED,#EFEBE2);background-size:200% 100%;animation:mcsh 1.2s infinite;border-radius:12px}
@keyframes mcsh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/*MCDESK v1 — десктоп (>=960px): нижний таб-бар -> левый сайдбар, контент смещается вправо; мобилка не трогается*/
@media(min-width:960px){
 body:has(nav.nav){padding-left:236px}
 nav.nav{top:0;bottom:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:0}
 nav.nav .navin{flex-direction:column;align-items:stretch;height:100vh;max-width:none;margin:0;padding:22px 14px;gap:3px}
 nav.nav .ni{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;min-height:0;height:auto;padding:12px 14px;border-radius:12px}
 nav.nav .ni svg{width:22px;height:22px}
 nav.nav .ni .lb{font-size:15px;font-weight:600}
 nav.nav .ni.on{background:rgba(176,106,31,.09)}
 @media(hover:hover){nav.nav .ni:hover{background:rgba(176,106,31,.06);opacity:1}}
 body:has(nav.nav) .topbar{left:236px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>

<body>
<script>/*mc:hashroute*/(function(){try{var m=(location.hash||"").match(/^#\/c\/([^?&#]+)/);if(m&&m[1]){location.replace("card.html?slug="+encodeURIComponent(decodeURIComponent(m[1])));}}catch(e){}})();</script>
<button class="back" id="back" style="display:none" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
<div class="wrap" id="wrap"></div>

<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var qs=new URLSearchParams(location.search);
var CODE=qs.get('invite')||qs.get('join'); // инвайт-код: ?invite= (v3) или ?join= (совместимость)

// Access v3 (screen-access v3, bb487471): ветвление ПО СОСТОЯНИЮ ИНВАЙТА. Копия — Каллиопа.
// «вкус» — один честный разбор (NPS «Спорно»), не витрина.
function tasteCard(lbl){
 return '<div class="example"><div class="lbl">'+esc(lbl||'Например, NPS — и почему его надёжность под вопросом:')+'</div>'+
  '<div class="card"><div class="chip"><span class="d"></span>Спорно</div><h2>NPS (Net Promoter Score)</h2>'+
  '<div class="lead">Метрика лояльности через один вопрос: «насколько вероятно порекомендуете» (0–10), промоутеры минус критики.</div>'+
  '<div class="honest"><div class="l">А как на самом деле</div><div class="b">Связь NPS с реальным ростом слабая и плохо воспроизводится в независимых исследованиях — исходный claim оспорен. Полезно как грубый сигнал, опасно как жёсткий KPI.</div></div></div></div>';
}
function loadingState(){ document.getElementById('back').style.display='none'; document.getElementById('wrap').innerHTML='<div class="hero"><div class="hsub" style="text-align:center;padding:48px 0">Секунду…</div></div>'; }

// СОСТОЯНИЕ A — валидный инвайт (дефолт инвайт-онли): кто пригласил + принять → регистрация.
function stateA(info, code){
 document.getElementById('back').style.display='none';
 var who=(info&&(info.inviter_name||info.inviter||info.name))||'';
 var head=who?(esc(who)+' пригласил вас'):'Вас пригласили';
 document.getElementById('wrap').innerHTML='<div class="hero"><div class="brand">Честно о поведении</div>'+
  '<h1 class="httl inv">'+head+'</h1>'+
  '<div class="hsub">База о том, как люди принимают решения — и как проектировать для них. У каждой идеи помечено, насколько она подтверждена. Для тех, кто делает продукты.</div></div>'+
  tasteCard('Загляните — например, NPS, и почему его надёжность под вопросом:')+
  '<div class="panel"><div class="fld"><label for="name">Имя</label><input id="name" placeholder="Как вас зовут"></div>'+
  '<div class="fld"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="Ваш email"></div>'+
  '<div class="fld"><label for="pass">Пароль</label><input id="pass" type="password" autocomplete="new-password" placeholder="Пароль, от 6 символов"></div>'+
  '<div class="err" id="err" role="alert"></div>'+
  '<button class="btn pri" id="doJoin" style="width:100%;margin-top:6px">Принять приглашение</button>'+
  '<button class="link" id="toLogin">Уже есть аккаунт? Войти</button></div>';
 document.getElementById('doJoin').onclick=function(){ doAuth('join',code); };
 document.getElementById('toLogin').onclick=login;
}
// Тупик — инвайт истёк/погашен.
function deadEnd(info){
 document.getElementById('back').style.display='none';
 // Имя не склоняем («у Артём» ломало падеж) — форма без имени (bus 180fe5e8 п.3)
 var ask='Попросите новое у того, кто вас пригласил, или напишите автору';
 document.getElementById('wrap').innerHTML='<div class="hero"><div class="brand">Честно о поведении</div><h1 class="httl">Приглашение больше не действует</h1>'+
  '<div class="hsub">'+ask+': <a class="wcta" style="display:inline-block;padding:12px 8px;margin:-12px -8px" href="https://t.me/artavdeev" target="_blank" rel="noopener">tg @artavdeev</a>.</div>'+
  '<button class="link" id="toLogin" style="margin-top:16px">Уже есть аккаунт? Войти</button></div>';
 document.getElementById('toLogin').onclick=login;
}
// СОСТОЯНИЕ B — холодный гость (нет/невалидный инвайт): тон снижен, без 4 продающих секций.
function stateB(badCode){ // badCode=true: пришли с битым/неопознанным инвайтом — объясняем, а не молчим (п.10 4fde418b)
 document.getElementById('back').style.display='none';
 document.getElementById('wrap').innerHTML=(badCode?'<div class="panel" style="border-color:#E4C9A6;background:#FBF3E4"><div class="ps" style="margin:0">Ссылка-приглашение не распознана или истекла. Попросите новую у того, кто вас пригласил.</div></div>':'')+'<div class="hero"><div class="brand">Честно о поведении</div>'+
  '<div class="hsub" style="margin-top:14px">База о том, как люди принимают решения — и как проектировать для них. У каждой идеи помечено, насколько она подтверждена.</div></div>'+
  tasteCard()+
  '<div class="panel"><h2>Доступ по приглашению.</h2><div class="ps">Нужно приглашение от того, кто уже внутри. Нет — напишите автору: <a class="wcta" href="https://t.me/artavdeev" target="_blank" rel="noopener">tg @artavdeev</a>.</div>'+
  '<button class="link" id="toLogin" style="margin-top:4px">Уже есть аккаунт? Войти</button></div>';
 document.getElementById('toLogin').onclick=login;
}

function login(){
 document.getElementById('back').style.display='';
 document.getElementById('wrap').innerHTML='<div class="panel"><h2>Вход</h2><div class="ps">Войдите в свой аккаунт.</div>'+
  '<div class="fld"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>'+
  '<div class="fld"><label for="pass">Пароль</label><input id="pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>'+
  '<div class="err" id="err" role="alert"></div>'+
  '<button class="btn pri" id="doLogin" style="width:100%;margin-top:6px">Войти</button>'+
  '<button class="link" id="forgot">Забыли пароль?</button></div>';
 document.getElementById('back').onclick=route;
 document.getElementById('doLogin').onclick=function(){ doAuth('login'); };
 document.getElementById('forgot').onclick=function(){ var em=(document.getElementById('email')||{}).value; var e=document.getElementById('err'); if(!em){ e.textContent='Введите email выше — пришлём ссылку для сброса.'; return; } if(!window.__SB){ e.textContent='Нет соединения — попробуйте онлайн.'; return; } window.__SB.auth.resetPasswordForEmail(em).then(function(r){ if(r&&r.error){ e.textContent=ruErr(r.error.message); return; } e.style.color='var(--gold-br)'; e.textContent='Ссылка для сброса отправлена на '+em+'.'; }).catch(function(){ e.textContent='Не удалось отправить. Попробуйте позже.'; }); };
}

function doAuth(mode,code){
 var err=document.getElementById('err'); err.textContent='';
 var email=(document.getElementById('email')||{}).value, pass=(document.getElementById('pass')||{}).value, name=(document.getElementById('name')||{}).value;
 if(!email||!pass){ err.textContent='Введите email и пароль.'; return; }
 if(mode==='join' && !name){ err.textContent='Укажите имя.'; return; }
 if(!window.__SB){ err.textContent='Нет соединения с базой — попробуйте онлайн.'; return; }
 if(mode==='login'){
  window.__SB.auth.signInWithPassword({email:email,password:pass}).then(function(r){ if(r.error){ err.textContent=ruErr(r.error.message); } else { location.href='solve-home.html'; } }).catch(function(){ err.textContent='Не удалось войти.'; });
 } else {
  window.__SB.auth.signUp({email:email,password:pass}).then(function(r){ if(r.error){ err.textContent=ruErr(r.error.message); return; }
   // Пост-регистрация: новый член попадает в S1 Пути (нулевой момент, ≤3 мин) — не в Справочник (bus 180fe5e8 п.1)
   window.__SB.rpc('invite_redeem',{p_code:code,p_name:name}).then(function(rr){ if(rr&&rr.error){ err.textContent=ruErr(rr.error.message); } else { location.href='path.html'; } }).catch(function(){ location.href='path.html'; });
  }).catch(function(){ err.textContent='Не удалось создать аккаунт.'; });
 }
}
function ruErr(m){ m=String(m||''); if(/Invalid login/i.test(m)) return 'Неверный email или пароль.'; if(/already registered/i.test(m)) return 'Этот email уже зарегистрирован — войдите.'; if(/expired|invalid.*code|not found/i.test(m)) return 'Приглашение недействительно или истекло.'; return m; }

// маршрут
// синхронно: токен сессии в localStorage → уже залогинен, сразу в приложение (не показываем форму входа)
function mcLikelyMember(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf('sb-')===0&&k.indexOf('-auth-token')>0){ var v=localStorage.getItem(k); if(v&&v.length>20) return true; } } }catch(e){} return false; }
// Ветвление по инвайту (invite_info — async, финализируется в boot после SB).
function branchInvite(SB){ SB.rpc('invite_info',{p_code:CODE}).then(function(r){ var info=(r&&!r.error&&r.data)||null;
  if(info&&info.valid){ stateA(info,CODE); }
  else if(info&&(info.reason==='expired'||info.reason==='redeemed'||info.expired||info.redeemed)){ deadEnd(info); }
  else { stateB(true); } // notfound/невалид → холодный гость + объяснение (не молча)
 }).catch(function(){ stateB(!!CODE); }); }
function route(){
 if(!CODE && mcLikelyMember()){ location.replace('solve-home.html'); return; }
 if(CODE){ loadingState(); return; } // финал по invite_info в boot
 stateB();
}
route();

// живой режим: уже залогинен → в приложение; иначе готовим клиент для форм
(function boot(){
 function go(){
  try{
   if(!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient)) return;
   var SB=window.supabase.createClient(String(window.SUPABASE_URL).trim(),String(window.SUPABASE_ANON_KEY).trim()); window.__SB=SB;
   SB.auth.getSession().then(function(s){ var sess=s&&s.data&&s.data.session;
     if(sess && !CODE){ location.href='solve-home.html'; return; }
     if(CODE){ branchInvite(SB); }
   }).catch(function(){ if(CODE) branchInvite(SB); });
  }catch(_){}
 }
 function load(src,cb){ var sc=document.createElement('script'); sc.src=src; sc.onload=cb; sc.onerror=cb; document.head.appendChild(sc); }
 function loadCfg(done){ var ps=['./config.js','../config.js','/book-reader/config.js']; var i=0; (function nx(){ if(window.SUPABASE_URL||i>=ps.length) return done(); var sc=document.createElement('script'); sc.src=ps[i++]; sc.onload=function(){ setTimeout(function(){ window.SUPABASE_URL?done():nx(); },0); }; sc.onerror=nx; document.head.appendChild(sc); })(); }
 // входная дверь нового юзера: config/vendor не догрузились → не вечное «Секунду…», а честная ошибка с ретраем (cold-audit)
 function cfgFail(){ try{ var b=document.getElementById('back'); if(b) b.style.display='none'; }catch(e){}
  document.getElementById('wrap').innerHTML='<div class="mcstate"><div class="ic">⚠</div><div class="msg">Не удалось подключиться. Если не загружается — отключите VPN.</div><button class="retry" onclick="location.reload()">↻ Повторить</button></div>'; }
  loadCfg(function(){ if(!window.SUPABASE_URL){ if(CODE) cfgFail(); return; }
   load('vendor/supabase.min.js', function(){ if(!(window.supabase&&window.supabase.createClient)){ if(CODE) cfgFail(); return; } go(); }); });
