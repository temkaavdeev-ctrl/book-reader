<html lang="ru" style="background:#FBFAF7">
<head>
<meta charset="utf-8">

<title>Ситуации · Матчасть</title>
<style>
:root{
 --bg:#FBFAF7; --ink:#17150F; --ink2:#56504A; --meta:#6E675E; --line:#ECE7DD; --card:#fff;
 --gold:#97591A; --gold-br:#C98A3A;
 --solid:#2F7D4F; --mixed:#B8801F; --contested:#C2452F; --inbox:#8B847B; --force:#6B5CA5; --tool:#297C7C;
 --pill:999px; --r:18px; --rs:14px;
 --sh:0 2px 12px rgba(20,17,12,.05),0 1px 2px rgba(20,17,12,.04);
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;padding:0 20px calc(80px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink2);border-radius:var(--pill);cursor:pointer}.ib:active{background:var(--line)}
.bt{font-size:15px;font-weight:700}
.head{padding:16px 0 4px}
.kick{font-size:13px;font-weight:600;color:var(--gold)}
.h1{font-size:30px;line-height:35px;font-weight:800;letter-spacing:-.02em;margin:3px 0 6px}
.sub{font-size:15px;line-height:21px;color:var(--ink2)}
.stages{display:flex;gap:7px;overflow-x:auto;margin:16px -20px 4px;padding:2px 20px 8px;scrollbar-width:none}.stages::-webkit-scrollbar{display:none}
.stg{flex:none;font-size:13px;font-weight:600;color:var(--meta);background:#fff;border:1px solid var(--line);border-radius:var(--pill);padding:6px 13px;white-space:nowrap}
.stg.has{color:var(--ink);border-color:var(--gold-br)}
.seclbl{font-size:14px;color:var(--meta);font-weight:600;margin:22px 0 4px}
.msec{margin-top:28px}
.msh{display:flex;align-items:baseline;gap:9px}
.mst{font-size:21px;font-weight:800;letter-spacing:-.015em}
.msc{font-size:13px;font-weight:700;color:var(--gold)}
.mss{font-size:13px;line-height:18px;color:var(--meta);margin:2px 0 10px}
.sit{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);cursor:pointer;margin-top:12px}
.sit:active{transform:scale(.995)}
.sit .st{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--gold)}
.sit .ti{font-size:19px;line-height:24px;font-weight:700;margin:5px 0 6px}
.sit .cl{font-size:15px;line-height:21px;color:var(--ink2)}
.sit .mt{margin-top:13px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--meta)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.chip .d{width:8px;height:8px;border-radius:50%}.chip.solid .d{background:var(--solid)}.chip.mixed .d{background:var(--mixed)}.chip.contested .d{background:var(--contested)}.chip.inbox .d{background:var(--inbox)}
.grow{margin-top:20px;font-size:14px;line-height:20px;color:var(--meta);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:14px}
/* деталь */
.dtype{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
.badge{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--gold);background:rgba(176,106,31,.09);padding:4px 10px;border-radius:var(--pill)}
.rob{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:var(--pill);padding:3px 10px}
.rob .d{width:8px;height:8px;border-radius:50%}.rob.solid .d{background:var(--solid)}.rob.mixed .d{background:var(--mixed)}.rob.contested .d{background:var(--contested)}
.dt{font-size:28px;line-height:33px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px}
.lead{font-size:16px;line-height:25px}
.wedge{margin-top:16px;display:grid;gap:10px}
.we{border-radius:var(--rs);padding:14px 16px;font-size:15px;line-height:22px}
.we.seem{background:#fff;border:1px solid var(--line)}
.we.real{background:#211C16;color:#EFE6D7}
.we .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.we.seem .l{color:var(--meta)}.we.real .l{color:var(--gold-br)}
.moves{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:16px 18px;box-shadow:var(--sh)}
.moves .l{font-size:13px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.moves .b{font-size:16px;line-height:25px;white-space:pre-line}
.grp{margin-top:26px}
.grp h2{font-size:18px;font-weight:700;margin:0 0 4px}
.grp .gh{font-size:13px;color:var(--meta);margin-bottom:8px}
.dhonest{background:#211C16;color:#EFE6D7;border-radius:var(--rs);padding:16px 18px;margin-top:18px}
.dhonest .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--gold-br);margin-bottom:6px}
.dhonest .b{font-size:15px;line-height:22px;white-space:pre-line}
.robnote{font-size:13px;line-height:19px;color:var(--ink2);background:#faf6ee;border-left:2px solid #d8c08a;border-radius:8px;padding:10px 12px;margin-top:10px}
.trap{background:#fff;border:1px solid var(--line);border-left:3px solid var(--contested);border-radius:var(--rs);padding:14px 16px;margin-top:18px}
.trap .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--contested);margin-bottom:8px}
.grp .gh.locked{color:var(--meta)}
.dsrc{margin-top:18px}
.dsrc .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--meta);margin-bottom:5px}
.dsrc .b{font-size:13px;line-height:19px;color:var(--meta);white-space:pre-line}
.lk{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.lk:last-child{border-bottom:0}.lk:active{background:#fff}
.lk .d{width:10px;height:10px;border-radius:50%;flex:none}
.lk .d.solid{background:var(--solid)}.lk .d.mixed{background:var(--mixed)}.lk .d.contested{background:var(--contested)}.lk .d.inbox{background:var(--inbox)}
.lk .n{flex:1;font-size:16px;font-weight:600;min-width:0}
.lk .tag{font-size:12px;font-weight:600;color:var(--meta)}
.lk .tag.force{color:var(--force)}.lk .tag.tool{color:var(--tool)}
.lk .cv{color:var(--meta)}
.empty{padding:40px 0;text-align:center;color:var(--meta)}
.skel div{height:60px;background:linear-gradient(90deg,#EFEBE2,#F6F3ED,#EFEBE2);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px;margin-bottom:10px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(251,250,247,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:720px;margin:0 auto;display:flex}
.ni{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--meta);cursor:pointer}
.ni svg{width:24px;height:24px}.ni .lb{font-size:11px;font-weight:600}.ni.on{color:var(--gold)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/*TAP-FEEDBACK*/button:active,a:active,[onclick]:active,.ni:active,[data-k]:active,[data-route]:active,[data-slug]:active,[data-cont]:active,[data-q]:active,.row:active,.rt-row:active,.lg-row:active,.fc:active,.stoprow:active,.opt:active,.pill:active,.tab:active,.deeper:active{opacity:.6;transition:opacity .06s}
/*MCUX v1 — единый UX: нативные переходы между страницами, ховеры, тап-фидбек, reduced-motion*/
@view-transition{navigation:auto}
.nav{view-transition-name:mcnav}
button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.pill:active{opacity:.6;transition:opacity .06s}
@media(hover:hover){a:hover,button:hover,.ni:hover,.mrow:hover,.row:hover,.res:hover,.tbtn:hover,.fc:hover,.opt:hover,[data-k]:hover,[data-slug]:hover,[data-cont]:hover,[data-route]:hover,[data-q]:hover{opacity:.85;transition:opacity .12s ease;cursor:pointer}}
@media(hover:none){button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.lp:active,.rc:active,.cont:active,.hero:active,.scd:active,.tl:active,.fd:active,.lk:active,.deeper:active,[data-k]:active,[data-slug]:active,[data-cont]:active,[data-route]:active,[data-q]:active{opacity:.72;transform:scale(.97);transition:transform .06s ease,opacity .06s}}
a:focus-visible,button:focus-visible,[onclick]:focus-visible,.ni:focus-visible,.mrow:focus-visible,.row:focus-visible,.res:focus-visible,.tbtn:focus-visible,.fc:focus-visible,.opt:focus-visible,.lp:focus-visible,.rc:focus-visible,[data-k]:focus-visible,[data-slug]:focus-visible,[data-cont]:focus-visible,[data-route]:focus-visible,[data-go]:focus-visible{outline:2px solid var(--gold,#97591A);outline-offset:2px;border-radius:6px}
.mcstate{padding:46px 20px;text-align:center;color:var(--meta,#6E675E)}
.mcstate .ic{font-size:30px;line-height:1;margin-bottom:12px;opacity:.75}
.mcstate .msg{font-size:14.5px;line-height:20px;max-width:300px;margin:0 auto}
.mcstate .retry{margin-top:16px;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--gold,#97591A);background:none;border:1px solid var(--line,#ECE7DD);border-radius:999px;padding:9px 18px;cursor:pointer}
.mcsk{background:linear-gradient(90deg,#EFEBE2,#F6F3ED,#EFEBE2);background-size:200% 100%;animation:mcsh 1.2s infinite;border-radius:12px}
@keyframes mcsh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/*MCDESK v1 — десктоп (>=960px): нижний таб-бар -> левый сайдбар, контент смещается вправо; мобилка не трогается*/
@media(min-width:960px){
 body:has(nav.nav){padding-left:236px}
 nav.nav{top:0;bottom:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:0}
 nav.nav .navin{flex-direction:column;align-items:stretch;height:100vh;max-width:none;margin:0;padding:22px 14px;gap:3px}
 nav.nav .ni{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;min-height:0;height:auto;padding:12px 14px;border-radius:12px}
 nav.nav .ni svg{width:22px;height:22px}
 nav.nav .ni .lb{font-size:15px;font-weight:600}
 nav.nav .ni.on{background:rgba(176,106,31,.09)}
 @media(hover:hover){nav.nav .ni:hover{background:rgba(176,106,31,.06);opacity:1}}
 body:has(nav.nav) .topbar{left:236px}
 .wrap:has(.sitgrid){max-width:940px}
 .sitgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
 .sitgrid .sit{margin-top:0}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
<style>/*mc:desktop*/@media(min-width:1020px){.nav{top:0;bottom:0;left:0;right:auto;width:92px;border-top:0;border-right:1px solid var(--line);padding-bottom:0}.navin{flex-direction:column;justify-content:center;gap:8px;height:100%;max-width:none}.ni{flex:0 0 auto;padding:13px 0;margin:0 10px;border-radius:12px}.ni.on{background:rgba(151,89,26,.08)}body{padding-left:92px}.wrap{max-width:760px}.cta{left:92px}.topbar{left:92px}}@media(hover:hover){.ni{transition:color .15s,background .15s}.ni:hover{color:var(--gold)}a{transition:opacity .12s}}</style>

<script>/*mc:hashroute*/(function(){try{var m=(location.hash||"").match(/^#\/c\/([^?&#]+)/);if(m&&m[1]){location.replace("card.html?slug="+encodeURIComponent(decodeURIComponent(m[1])));}}catch(e){}})();</script>

<script>
var STAGES=["Привлечение","Онбординг","Активация","Привычка","Монетизация","Удержание","Отток"];
var ROBT={solid:"Проверено",mixed:"Есть нюансы",contested:"Спорно",inbox:"В проработке"};
// СИД: реальная публичная ситуация Service Recovery + её публичные силы
var SEED_HUB=[
 {slug:"scenario-recovery",title:"Восстановление после сбоя",moment:"РАЗРЫВ",task:"удержать ценность (восстановить доверие)",rob:"mixed",
  clin:"Продукт подвёл — упал сервис, зависла оплата. Кажется, доверие потеряно. На деле грамотный recovery может оставить пользователя довольнее, чем до сбоя."}
];
var SEED_DETAIL={
 "scenario-recovery":{
  title:"Восстановление после сбоя (Service Recovery)", rob:"mixed", stage:"Удержание",
  lead:"Продукт подвёл — упал сервис, зависла оплата, пришёл неверный результат. Service recovery — управление тем, что происходит после сбоя. Доверие рушится асимметрично: один инцидент перечёркивает несколько удачных опытов. Но парадокс: грамотный recovery может оставить пользователя довольнее, чем до сбоя (Service Recovery Paradox, McCollough & Bharadwaj 1992).",
  moves:"1. Проектируй failure flows заранее: на сервис-блупринте отметь точки сбоев и заготовь шаблоны коммуникации до инцидента.\n2. Скорость признания важнее полноты: «мы знаем, работаем» за 5 минут ценнее детального разбора через час.\n3. Уведомляй до того, как пользователь заметил — это меняет атрибуцию с «скрывают» на «следят».\n4. Управляй финалом: опыт должен закрыться позитивно — компенсация, подтверждение, следующий шаг.\n5. Никогда не показывай «успешный» экран при реальном фейле.",
  forces:[
   {slug:"trust-repair-asymmetry",title:"Асимметрия восстановления доверия",rob:"solid"},
   {slug:"peak-end-rule",title:"Правило пика и финала",rob:"solid"},
   {slug:"pratfall-effect",title:"Эффект оплошности (Pratfall)",rob:"mixed"}
  ],
  tools:[], adjacent:[]
 }
};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function plural(n,a,b,c){var m=Math.abs(+n||0)%100,d=m%10;if(m>10&&m<20)return c;if(d>1&&d<5)return b;if(d===1)return a;return c;}
var REL_FORCE={"involves-force":1}, REL_TOOL={"uses-tool":1}, REL_ADJ={"adjacent-to":1,"mechanism-of":1,"same-family":1}, REL_WATCH={"watch-trap":1};
// стадия детали из тега lifecycle-* (истина по данным), а не из пустого фолбэка
function stageFromTags(tags){ if(!tags||!tags.length) return null; for(var i=0;i<tags.length;i++){ var t=tags[i]||{}; if(t.axis==='lifecycle'&&t.label) return t.label; } return null; }

var qs=new URLSearchParams(location.search);
var SLUG=qs.get('slug');

function robChip(r){ return '<span class="rob '+r+'"><span class="d"></span>'+(ROBT[r]||'')+'</span>'; }
function rowsHtml(list,tag){
 return list.map(function(n){ return '<div class="lk" role="link" tabindex="0" data-go="'+esc(n.slug)+'"><span class="d '+(n.rob||'mixed')+'"></span><span class="n">'+esc(n.title)+'</span>'+(tag?'<span class="tag '+tag+'">'+(tag==='force'?'сила':'инструмент')+'</span>':'')+'<svg class="cv" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>'; }).join('');
}

// момент жизненного цикла — 4 колонки сетки задача×момент (порядок по пути пользователя)
var MOMENTS=[
 {k:'ВХОД',    t:'Вход',    s:'Первое знакомство и активация'},
 {k:'РЕШЕНИЕ', t:'Решение', s:'Момент выбора и оплаты'},
 {k:'РУТИНА',  t:'Рутина',  s:'Регулярное использование и привычка'},
 {k:'РАЗРЫВ',  t:'Разрыв',  s:'Сбой, отток, расставание'}
];
function sitCard(s){ var rob=s.rob||s.robustness||'mixed';
 return '<div class="sit" role="link" tabindex="0" data-go="'+esc(s.slug)+'">'+(s.task?'<div class="st">'+esc(s.task)+'</div>':'')+'<div class="ti">'+esc(s.title)+'</div><div class="cl">'+esc(s.clin||s.claim||'')+'</div>'+
  '<div class="mt"><span class="chip '+rob+'"><span class="d"></span>'+(ROBT[rob]||'')+'</span></div></div>';
}
function renderHub(list){
 list=(list||[]);
 document.getElementById('barTitle').textContent='Ситуации';
 var H='<div class="head"><div class="kick">База знаний</div><h1 class="h1">Под вашу задачу</h1><div class="sub">Ситуации продукта — по моменту жизненного цикла. Внутри каждого — задача, которую вы решаете.</div></div>';
 var byM={}; list.forEach(function(s){ var m=(s.moment||'—'); (byM[m]=byM[m]||[]).push(s); });
 var any=false;
 MOMENTS.forEach(function(M){ var arr=byM[M.k]; if(!arr||!arr.length) return; any=true;
  H+='<div class="msec"><div class="msh"><span class="mst">'+M.t+'</span><span class="msc">'+arr.length+'</span></div><div class="mss">'+M.s+'</div><div class="sitgrid">'+arr.map(sitCard).join('')+'</div></div>';
 });
 var rest=byM['—']||[]; if(rest.length){ any=true; H+='<div class="msec"><div class="msh"><span class="mst">Ещё</span><span class="msc">'+rest.length+'</span></div><div class="sitgrid">'+rest.map(sitCard).join('')+'</div></div>'; }
 if(!any) H+='<div class="mcstate"><div class="ic">✦</div><div class="msg">Ситуации скоро появятся.</div></div>';
 document.getElementById('body').innerHTML=H;
 bind();
}

function renderDetail(d){
 document.getElementById('barTitle').textContent=d.stage||'Ситуация';
 var H='<div class="dtype"><span class="badge">Ситуация'+(d.stage?' · '+d.stage:'')+'</span>'+robChip(d.rob||'mixed')+'</div>';
 H+='<div class="dt">'+esc(d.title)+'</div>';
 if(d.seem||d.real){
  H+='<div class="wedge">'+(d.seem?'<div class="we seem"><div class="l">Кажется</div>'+esc(d.seem)+'</div>':'')+(d.real?'<div class="we real"><div class="l">На деле</div>'+esc(d.real)+'</div>':'')+'</div>';
 } else if(d.lead){ H+='<div class="lead">'+esc(d.lead)+'</div>'; }
 if(d.moves) H+='<div class="moves"><div class="l">Что делать</div><div class="b">'+esc(d.moves)+'</div></div>';
 if(d.mech) H+='<div class="moves"><div class="l">Механизм</div><div class="b">'+esc(d.mech)+'</div></div>';
 if(d.chain) H+='<div class="moves"><div class="l">Причинная цепочка</div><div class="b">'+esc(d.chain)+'</div></div>';
 if(d.mistakes) H+='<div class="moves"><div class="l">Частые ошибки</div><div class="b">'+esc(d.mistakes)+'</div></div>';
 if(d.example) H+='<div class="moves"><div class="l">Пример</div><div class="b">'+esc(d.example)+'</div></div>';
 if(d.counter) H+='<div class="dhonest"><div class="l">А как на самом деле</div><div class="b">'+esc(d.counter)+'</div></div>';
 if(d.robnote) H+='<div class="robnote">'+esc(d.robnote)+'</div>';
 if(d.traps&&d.traps.length){ H+='<div class="trap"><div class="l">Ловушка / чего избегать</div><div class="gh">тёмные паттерны и вредное трение, в которые легко скатиться</div>'+rowsHtml(d.traps,'')+'</div>'; }
 if(d.forces&&d.forces.length){ H+='<div class="grp"><h2>Силы в игре</h2><div class="gh">психологические механизмы, которые здесь работают</div>'+rowsHtml(d.forces,'force')+'</div>'; }
 if(d.tools&&d.tools.length){ H+='<div class="grp"><h2>Инструменты</h2><div class="gh">приёмы и методы под эту ситуацию</div>'+rowsHtml(d.tools,'tool')+'</div>'; }
 else if(d.member===false){ H+='<div class="grp"><h2>Инструменты</h2><div class="gh locked">приёмы и методы под эту ситуацию доступны участникам</div></div>'; }
 if(d.adjacent&&d.adjacent.length){ H+='<div class="grp"><h2>Рядом</h2><div class="gh">смежные ситуации и идеи</div>'+rowsHtml(d.adjacent,'')+'</div>'; }
 if(d.sources) H+='<div class="dsrc"><div class="l">Источники</div><div class="b">'+esc(d.sources)+'</div></div>';
 document.getElementById('body').innerHTML=H;
 bind();
}

function bind(){
 Array.prototype.forEach.call(document.querySelectorAll('[data-go]'),function(el){ el.onclick=function(){
  var s=el.getAttribute('data-go');
  if(/^scenario-/.test(s)){ location.href='situations.html?slug='+encodeURIComponent(s); }
  else { location.href='card.html?slug='+encodeURIComponent(s); }
 }; });
}
document.addEventListener('keydown',function(e){ if(e.key!=='Enter'&&e.key!==' '&&e.key!=='Spacebar')return; var t=e.target&&e.target.closest?e.target.closest('[data-go]'):null; if(t){ e.preventDefault(); t.click(); } });
document.getElementById('back').onclick=function(){ if(SLUG){ location.href='situations.html'; } else if(history.length>1) history.back(); else location.href='solve-home.html'; };

// первичный рендер из сида
if(SLUG && SEED_DETAIL[SLUG]) renderDetail(SEED_DETAIL[SLUG]);
else if(SLUG) document.getElementById('body').innerHTML='<div class="skel"><div style="height:36px;width:60%"></div><div></div><div></div></div>';
else renderHub(SEED_HUB);

// плавная подмена сид→живое (кроссфейд, чтобы контент не «прыгал» резко)
function fadeSwap(elId, fn){ var el=document.getElementById(elId); if(!el){ fn(); return; } el.style.transition='opacity .2s'; el.style.opacity='0'; setTimeout(function(){ try{ fn(); }catch(e){} requestAnimationFrame(function(){ el.style.opacity='1'; }); }, 170); }
// живой режим
(function boot(){
 function classify(b,member){
  var bs=b.body_struct||b.body||{}; var edges=b.edges||[];
  var d={title:b.title, rob:b.robustness||'mixed', robnote:b.robustness_note||null,
    seem:bs['механизм-заблуждения'], real:bs['как-на-самом-деле'],
    lead:bs['суть'], moves:bs['применение'], mech:bs['механизм'], example:bs['пример'],
    chain:bs['причинная-цепочка'], mistakes:bs['частые-ошибки'],
    counter:bs['контртеория'], sources:bs['источники']||bs['источник'],
    stage:stageFromTags(b.tags), member:(member===true?true:member===false?false:undefined),
    forces:[],tools:[],adjacent:[],traps:[]};
  edges.forEach(function(e){ var it={slug:e.other,title:e.other_title||e.other,rob:e.other_robustness||'mixed'};
   if(REL_FORCE[e.relation]) d.forces.push(it); else if(REL_TOOL[e.relation]) d.tools.push(it); else if(REL_WATCH[e.relation]) d.traps.push(it); else if(REL_ADJ[e.relation]) d.adjacent.push(it); });
  return d;
 }
 function go(){
  try{
   if(!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient)) return;
   var SB=window.supabase.createClient(String(window.SUPABASE_URL).trim(),String(window.SUPABASE_ANON_KEY).trim());
   SB.auth.getSession().then(function(s){ var member=!!(s&&s.data&&s.data.session);
    if(SLUG){
     SB.rpc(member?'kb_node_bundle':'kb_public_bundle',{p_slug:SLUG}).then(function(r){ if(r&&!r.error&&r.data){ var d=classify(r.data,member); if(!d.stage) d.stage=(SEED_DETAIL[SLUG]||{}).stage; fadeSwap('body', function(){ renderDetail(d); }); }
      else if(!SEED_DETAIL[SLUG]){ detailFail(r&&r.error?'error':'missing'); } }).catch(function(){ if(!SEED_DETAIL[SLUG]) detailFail('error'); });
    } else {
     SB.rpc('situations_hub').then(function(r){ if(r&&!r.error&&r.data&&r.data.length){ fadeSwap('body', function(){ renderHub(r.data); }); } }).catch(function(){});
    }
   }).catch(function(){ if(SLUG&&!SEED_DETAIL[SLUG]) detailFail('error'); });
  }catch(_){}
 }
 // деталь без сида: сеть/неизвестный slug не должны крутить скелетон вечно (cold-audit)
 function detailFail(kind){ var el=document.getElementById('body'); if(!el) return;
  var msg=kind==='missing'?'Такой ситуации нет — возможно, ссылка устарела.':'Не удалось загрузить.';
  el.innerHTML='<div class="mcstate"><div class="ic">'+(kind==='missing'?'∅':'⚠')+'</div><div class="msg">'+msg+'</div>'+(kind==='missing'?'<button class="retry" onclick="location.href=\'situations.html\'">Все ситуации</button>':'<button class="retry" onclick="location.reload()">↻ Повторить</button>')+'</div>'; }
 function load(src,cb){ var s=document.createElement('script'); s.src=src; s.onload=cb; s.onerror=cb; document.head.appendChild(s); }
 function loadCfg(done){ var ps=['./config.js','../config.js','/book-reader/config.js']; var i=0; (function nx(){ if(window.SUPABASE_URL||i>=ps.length) return done(); var sc=document.createElement('script'); sc.src=ps[i++]; sc.onload=function(){ setTimeout(function(){ window.SUPABASE_URL?done():nx(); },0); }; sc.onerror=nx; document.head.appendChild(sc); })(); }
  loadCfg(function(){ if(!window.SUPABASE_URL){ if(SLUG&&!SEED_DETAIL[SLUG]) detailFail('error'); return; } load('vendor/supabase.min.js', function(){ if(!(window.supabase&&window.supabase.createClient)){ if(SLUG&&!SEED_DETAIL[SLUG]) detailFail('error'); return; } go(); }); });
})();
</script>
