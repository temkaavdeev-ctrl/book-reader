@media(prefers-reduced-motion:reduce){*{transition:none!important}}

  H+='</div></section>'; }

 // ПОД ТВОЮ ЗАДАЧУ — ситуации (тонко = ок, «пополняется»)
 if(d.situations && d.situations.length){
  H+='<section><div class="sh"><div class="st">Под твою задачу</div><div class="ss">ситуации, с которыми сталкиваешься в продукте</div></div><div class="lane">';
  d.situations.forEach(function(s,i){
   var meta=[]; if(s.forces) meta.push(s.forces+' сил'); if(s.tools) meta.push(s.tools+' приёмов'); meta.push('пополняется');
   H+='<div class="scd" data-k="s'+i+'">'+(s.stage?'<div class="scs">'+esc(s.stage)+'</div>':'<div class="scs">Ситуация</div>')+'<div class="sct">'+esc(s.title)+'</div><div class="scdd">'+esc(s.teaser)+'</div><div class="scm">'+meta.join(' · ')+'</div></div>'; });
  H+='</div></section>'; }

 // ОБЛАСТИ ЗНАНИЯ — темы (живые дисциплины)
 if(d.themes && d.themes.length){
  H+='<section><div class="sh"><div class="st">Области знания</div><div class="ss">по дисциплинам — выбери направление</div></div><div class="tiles">';
  d.themes.forEach(function(t,i){ var col=DCOL[t.discipline]||"--def";
   H+='<div class="tl" style="border-left-color:var('+col+')" data-k="t'+i+'"><div class="tlh"><span class="tln">'+esc(t.discipline)+'</span><span class="tlc">'+t.cnt+' идей</span></div><div class="tlx">'+(t.samples||[]).map(esc).join(' · ')+'</div><div class="tlt">внутри есть спорные места →</div></div>'; });
  H+='</div></section>'; }

 // ЕЩЁ НЕ ДОКАЗАНО — находки
 if(d.findings && d.findings.length){
  H+='<section><div class="sh"><div class="st">Ещё не доказано</div><div class="ss">гипотезы на грани знания — помечаем, насколько они подтверждены</div></div><div class="finds">';
  d.findings.forEach(function(f,i){ var conf=f.conf||10; var lab=conf<15?'слабо подтверждено':(conf<40?'мало данных':'есть данные');
   H+='<div class="fd" data-k="fd'+i+'"><div class="fdh"><span class="bdg">'+esc(FTYPE[f.type]||f.type||"Гипотеза")+'</span></div><div class="fdt">'+esc(f.title)+'</div><div class="fdd">'+esc(f.teaser)+'</div><div class="conf"><span class="bar"><i style="width:'+Math.max(6,Math.min(100,conf))+'%"></i></span><span>'+lab+'</span></div></div>'; });
  H+='</div></section>'; }

 // СЕРЕНДИП
 H+='<section><div class="sh"><div class="st">Не знаешь, с чего?</div></div><div class="duo">'+
   '<button class="bt" data-k="rnd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6l10 10v6h-6L4 10z"/><path d="M14 4h6v6"/></svg>Случайная идея</button>'+
   '<button class="bt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 1.5L13 16l-1.5-4.5z"/></svg>Открыть карту</button></div></section>';

 document.getElementById('app').innerHTML=H;
}

function cardHtml(title, rob, c){
 var r=robInfo(rob);
 var h='<div class="ct">'+esc(title)+'</div><div class="chip '+r.c+'" style="margin-bottom:14px"><span class="d"></span>'+esc(r.t)+'</div>';
 if(c.lead) h+='<div class="clead">'+esc(c.lead)+'</div>';
 if(c.apply) h+='<div class="cap"><div class="lb">Как применить в продукте</div><div class="bd">'+esc(c.apply)+'</div></div>';
 if(c.counter) h+='<div class="honest"><div class="lb">А как на самом деле</div><div class="bd">'+esc(c.counter)+'</div></div>';
 if(c.mech||c.ex){ h+='<div class="deep"><div class="dh">Разобрать глубже</div><div class="dn">механизм · пример</div>';
  if(c.mech) h+='<div class="dsec"><div class="l">Механизм</div><div class="b">'+esc(c.mech)+'</div></div>';
  if(c.ex) h+='<div class="dsec"><div class="l">Пример</div><div class="b">'+esc(c.ex)+'</div></div>'; h+='</div>'; }
 return h;
}
function openSeedCard(title, rob, c){ document.getElementById('cb').innerHTML=cardHtml(title,rob,c); showSheet(); }
function showSheet(){ document.getElementById('scrim').classList.add('on'); document.getElementById('sheet').classList.add('on'); document.getElementById('sheet').scrollTop=0; }
function closeCard(){ document.getElementById('scrim').classList.remove('on'); document.getElementById('sheet').classList.remove('on'); }

// клики
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-k]'); if(!el) return; var k=el.getAttribute('data-k');
 if(k==='hero' && CUR.hero){ openSeedCard(CUR.hero.title, CUR.hero.rob, CUR.hero.card); return; }
 if(k[0]==='f' && k[1]!=='d'){ var fi=+k.slice(1); var f=CUR.featured&&CUR.featured[fi]; if(f) openSeedCard(f.title,f.rob,f.card); return; }
 if(k[0]==='t'){ var ti=+k.slice(1); var t=CUR.themes&&CUR.themes[ti]; if(t){ var DKEY={"Поведенческая экономика":"be","Когнитивная психология":"cog","UX / HCI":"ux","UX/HCI":"ux","Социальная психология":"soc","Организационные системы":"org","Орг-системы":"org","Мотивация/идентичность":"mot","Продуктовые практики":"prod","Нейронаука/тело":"neu"}; var tk=DKEY[t.discipline]; location.href='concepts-browse.html'+(tk?('?theme='+tk):''); } return; }
 if(k[0]==='s' && k!=='s'){ var si=+k.slice(1); var s=CUR.situations&&CUR.situations[si]; if(s){ location.href='situations.html?slug='+encodeURIComponent(s.slug||''); } return; }
 if(k[0]==='f'&&k[1]==='d'){ var di=+k.slice(2); var fd=CUR.findings&&CUR.findings[di]; location.href='findings.html'+(fd&&fd.slug?('?slug='+encodeURIComponent(fd.slug)):''); return; }
 if(k==='rnd'){ var all=(CUR.featured||[]).concat(CUR.hero?[CUR.hero]:[]); var p=all[Math.floor(Math.random()*all.length)]; if(p) openSeedCard(p.title,p.rob,p.card); return; }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeCard(); });

// карточка по сети (для тем/ситуаций, у которых нет встроенного тела)
function liveCard(slugOrTitle){
 if(!window.__SB){ openSeedCard(slugOrTitle, 'mixed', {lead:'Полная карточка подгружается из базы при наличии сети.'}); return; }
 document.getElementById('cb').innerHTML='<div class="loading">Загружаю карточку…</div>'; showSheet();
 var guest=!window.__MEMBER;
 window.__SB.rpc(guest?'kb_public_bundle':'kb_node_bundle',{p_slug:slugOrTitle}).then(function(r){
  var b=r&&r.data; if(!b){ document.getElementById('cb').innerHTML=cardHtml(slugOrTitle,'mixed',{lead:'Карточка не найдена в открытой части базы.'}); return; }
  var bs=b.body_struct||b; 
  document.getElementById('cb').innerHTML=cardHtml(b.title||slugOrTitle, b.robustness||'mixed', {
   lead:bs['суть'], apply:bs['применение'], mech:bs['механизм'], ex:bs['пример'],
   counter:bs['как-на-самом-деле']||bs['механизм-заблуждения']});
 }).catch(function(){ document.getElementById('cb').innerHTML=cardHtml(slugOrTitle,'mixed',{lead:'Нет сети — полная карточка недоступна офлайн.'}); });
}

// первичный рендер из сида — мгновенно, без сети
render(SEED);

// живой запрос при наличии сети + конфига
(function boot(){
 function go(){
  try{
   if(!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient)) return;
   var SB=window.supabase.createClient(String(window.SUPABASE_URL).trim(), String(window.SUPABASE_ANON_KEY).trim());
   window.__SB=SB;
   SB.auth.getSession().then(function(s){ window.__MEMBER=!!(s&&s.data&&s.data.session); }).catch(function(){});
   SB.rpc('solve_home').then(function(r){ if(r&&!r.error&&r.data){ try{ render(r.data); }catch(_){} } }).catch(function(){});
  }catch(_){}
 }
 // подтянуть конфиг рядом с приложением (../config.js на Pages), затем supabase-js
 function load(src,cb){ var s=document.createElement('script'); s.src=src; s.onload=cb; s.onerror=cb; document.head.appendChild(s); }
 function loadCfg(done){ var ps=['../config.js','./config.js','config.js','/book-reader/config.js']; var i=0; (function nx(){ if(window.SUPABASE_URL||i>=ps.length) return done(); var sc=document.createElement('script'); sc.src=ps[i++]; sc.onload=function(){ setTimeout(function(){ window.SUPABASE_URL?done():nx(); },0); }; sc.onerror=nx; document.head.appendChild(sc); })(); }
  loadCfg(function(){ load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2', go); });
})();
</script>
