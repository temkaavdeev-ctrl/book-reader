<!doctype html>
<html lang="ru" style="background:#FBFAF7">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme:light)"><meta name="theme-color" content="#100D0A" media="(prefers-color-scheme:dark)"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Справочник — база знаний</title>
<style>
:root{
 --bg:#FBFAF7; --ink:#17150F; --ink2:#56504A; --meta:#6E675E; --line:#ECE7DD; --card:#fff;
 --gold:#97591A; --gold-br:#C98A3A; --on:#fff;
 --solid:#2F7D4F; --mixed:#B8801F; --contested:#C2452F; --info:#6B5CA5; --tension:#C2546A;
 --econ:#C98A3A; --cog:#CDA92F; --ux:#C2546A; --soc:#6B5CA5; --org:#2B8282; --mot:#B0452F; --prod:#3E8E8E; --neu:#8A5CC2; --evo:#4E9A6B; --def:#8B847B;
 --r:20px; --rs:14px; --pill:999px;
 --sh:0 2px 12px rgba(20,17,12,.05),0 1px 2px rgba(20,17,12,.04);
 --shh:0 18px 46px rgba(20,17,12,.24);
 --nav:64px;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* Тёмная тема (тёплая «ночная обсерватория»): токены переопределены в конце стилей — см. @media(prefers-color-scheme:dark) */
.app{max-width:720px;margin:0 auto;min-height:100vh;padding:0 20px calc(var(--nav) + env(safe-area-inset-bottom) + 16px)}
.top{padding:20px 0 4px;position:relative}
.shc{position:absolute;top:16px;right:0;width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);color:var(--ink2);box-shadow:var(--sh);text-decoration:none}.shc:active{opacity:.6}
.kick{font-size:13px;font-weight:600;color:var(--gold);letter-spacing:.02em}
.h1{font-size:34px;line-height:39px;font-weight:800;letter-spacing:-.025em;margin:3px 0 5px}
.subt{font-size:15px;line-height:21px;color:var(--ink2)}
/* v5 п.1/8: видимый поиск-инпут — главный вход в Матчасть, рядом «крутить случайную» */
.msearch{margin-top:16px}
.msf{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.msf svg{flex:none;color:var(--meta)}
.msf input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;min-width:0}
.msf input::placeholder{color:var(--meta)}
.msf input::-webkit-search-cancel-button{-webkit-appearance:none}
.msdice{flex:none;border:0;background:none;color:var(--gold);cursor:pointer;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;line-height:1;border-radius:8px}
.msdice:active{opacity:.55}
.mschips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mschip{border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:13px;font-weight:500;padding:7px 13px;border-radius:999px;cursor:pointer}
.mschip:active{opacity:.6}
/* v5 п.7: бейдж надёжности — чистый чип + смысл на тап (ⓘ), человечный ярлык; светлый и тёмный контексты */
.rbadge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;line-height:1;padding:5px 10px;border-radius:var(--pill);border:1px solid;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.rbadge .rbd{width:7px;height:7px;border-radius:50%;flex:none}
.rbadge .rbi{font-size:11px;font-weight:700;opacity:.7}
.rbadge.solid{background:rgba(47,125,79,.10);border-color:rgba(47,125,79,.34);color:#2C7549}
.rbadge.mixed{background:rgba(184,128,31,.11);border-color:rgba(184,128,31,.36);color:#8A5E14}
.rbadge.contested{background:rgba(194,69,47,.10);border-color:rgba(194,69,47,.34);color:#AC3820}
.rbadge.solid .rbd{background:#2F7D4F}.rbadge.mixed .rbd{background:#B8801F}.rbadge.contested .rbd{background:#C2452F}
.rbadge.on-dark.solid{background:rgba(127,212,160,.13);border-color:rgba(127,212,160,.32);color:#8FDCAC}
.rbadge.on-dark.mixed{background:rgba(231,192,122,.13);border-color:rgba(231,192,122,.32);color:#EBC98A}
.rbadge.on-dark.contested{background:rgba(240,165,147,.13);border-color:rgba(240,165,147,.34);color:#F0A593}
.rbadge.on-dark.solid .rbd{background:#8FDCAC}.rbadge.on-dark.mixed .rbd{background:#EBC98A}.rbadge.on-dark.contested .rbd{background:#F0A593}
.rbadge:active{opacity:.7}@media(hover:hover){.rbadge:hover{filter:brightness(1.05)}}
.fc .rbadge{margin-top:13px}.hcard .rbadge{margin-top:12px}
/* v5 d94ae8f1: вход в Фронтир знания (научный край) с Матчасти */
.frontlink{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 15px;box-shadow:var(--sh)}
.frontlink .fl-i{flex:none;width:38px;height:38px;border-radius:11px;background:rgba(201,138,58,.11);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.frontlink .fl-i svg{width:20px;height:20px}
.frontlink .fl-b{flex:1;min-width:0;display:block}
.frontlink .fl-t{display:block;font-size:15.5px;font-weight:700;color:var(--ink)}
.frontlink .fl-s{display:block;font-size:13px;line-height:18px;color:var(--meta);margin-top:2px}
.frontlink .fl-cv{flex:none;color:var(--meta)}
.ter{display:inline-flex;align-items:center;gap:7px;margin-top:13px;font-size:14px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:var(--pill);padding:7px 13px;box-shadow:var(--sh)}
/* Питч гостя (62bbf2db) */
.pitchhdr{margin-top:12px;font-size:13.5px;line-height:19px;font-weight:600;color:var(--ink2)}
.pitchban{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--sh)}
.pitchban .pb-t{flex:1;min-width:180px;font-size:13.5px;line-height:19px;color:var(--ink2)}
.pitchban .pb-cta{font-size:13.5px;font-weight:700;color:var(--gold);text-decoration:none;white-space:nowrap}
.pitchban .pb-x{flex:none;width:44px;height:44px;margin:-9px -9px -9px 0;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--meta);font-size:15px;line-height:1;cursor:pointer;border-radius:8px}
.pitchban .pb-x:hover{background:var(--bg)}
.ter b{color:var(--gold);font-weight:700}.ter svg{width:15px;height:15px;color:var(--gold-br)}
section{margin-top:30px}
.sh{margin-bottom:13px}
.st{font-size:22px;line-height:27px;font-weight:700;letter-spacing:-.01em}
.ss{font-size:14px;line-height:19px;color:var(--meta);margin-top:2px}
.arow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.all{font-size:14px;font-weight:600;color:var(--gold);text-decoration:none;white-space:nowrap;cursor:pointer;padding:13px 4px 13px 13px;margin:-13px -4px -13px -13px}
.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:22px;cursor:pointer;background:linear-gradient(152deg,#241E18,#15110C);color:#F4EEE2;box-shadow:var(--shh)}
.hero::after{content:"";position:absolute;right:-44px;top:-44px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(201,138,58,.32),transparent 70%)}
.hk{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-br);position:relative}
.ht{font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.02em;margin:9px 0 8px;position:relative}
.hb{font-size:15px;line-height:22px;color:#D8D0C3;position:relative}
.hf{display:flex;align-items:center;gap:12px;margin-top:16px;position:relative}
.tag{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:5px 11px;border-radius:var(--pill);background:rgba(194,69,47,.18);color:#F0A593;border:1px solid rgba(194,69,47,.42)}
.tag.mix{background:rgba(184,128,31,.18);color:#E7C07A;border-color:rgba(184,128,31,.42)}
.hgo{margin-left:auto;font-size:14px;font-weight:700;color:var(--gold-br)}
.hlane{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:2px 20px 8px;scrollbar-width:none}.hlane::-webkit-scrollbar{display:none}
.hcard{flex:0 0 254px;position:relative;overflow:hidden;background:linear-gradient(152deg,#241E18,#15110C);color:#F4EEE2;border-radius:var(--r);padding:18px;box-shadow:var(--shh);cursor:pointer}
.hcard::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(201,138,58,.28),transparent 70%)}
.hcard .hk{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-br);position:relative}
.hct{text-wrap:balance;font-size:18px;line-height:23px;font-weight:800;letter-spacing:-.01em;margin:7px 0 6px;position:relative}
.hcx{font-size:13.5px;line-height:19px;color:#CBBEA6;position:relative;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hcard .tag{margin-top:12px;position:relative}
.hmore{background:linear-gradient(152deg,#1c1913,#131110);display:flex;flex-direction:column;justify-content:center}
.hmore .hgo{margin:10px 0 0}
.cont{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:14px 16px;box-shadow:var(--sh);cursor:pointer}
.cont .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.cont .l{font-size:16px;font-weight:600}.cont .s{font-size:13px;color:var(--meta)}.cont svg{margin-left:auto;color:var(--meta)}
.feat{display:grid;gap:14px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);cursor:pointer;transition:transform .14s}
.fc:active{transform:scale(.99)}
.fcn{font-size:13px;font-weight:700;color:var(--gold)}
.fct{font-size:21px;line-height:26px;font-weight:700;letter-spacing:-.01em;margin:4px 0 6px}
.fcd{font-size:15px;line-height:22px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:13px;font-weight:600;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:var(--pill);padding:5px 11px}
.chip .d{width:8px;height:8px;border-radius:50%}.chip.solid .d{background:var(--solid)}.chip.mixed .d{background:var(--mixed)}.chip.contested .d{background:var(--contested)}
.lane{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.lane::-webkit-scrollbar{display:none}
.scd{flex:0 0 250px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);cursor:pointer}
.scs{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--org)}
.sct{font-size:18px;line-height:23px;font-weight:700;margin:6px 0 5px}
.scdd{font-size:14px;line-height:19px;color:var(--ink2)}
.scm{margin-top:14px;font-size:13px;color:var(--meta)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.tiles{grid-template-columns:1fr}}
.tl{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--econ);border-radius:var(--r);padding:18px;box-shadow:var(--sh);cursor:pointer}
.tlh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tln{font-size:17px;font-weight:700}.tlc{font-size:13px;color:var(--meta);white-space:nowrap}
.tlw{font-size:13.5px;line-height:19px;color:var(--ink2);margin-top:6px}
.tlx{font-size:12.5px;line-height:18px;color:var(--meta);margin-top:6px}
.tlt{margin-top:12px;font-size:13px;font-weight:600;color:#A0344C}/* затемнён с --tension #C2546A: мелкий текст 13px требует AA 4.5 (a11y-гейт 58560322) */
.finds{display:grid;gap:14px}
.fd{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);cursor:pointer}
.fdh{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bdg{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--info);background:rgba(107,92,165,.1);padding:3px 9px;border-radius:var(--pill)}
.fdt{font-size:17px;line-height:23px;font-weight:700}.fdd{font-size:14px;line-height:20px;color:var(--ink2);margin-top:4px}
.conf{margin-top:12px;display:flex;align-items:center;gap:9px}
.bar{width:64px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--mixed)}
.conf span{font-size:12px;font-weight:600;color:var(--meta)}
.duo{display:flex;gap:14px}
.bt{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;border-radius:var(--rs);font-size:15px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.serl{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.serlink{background:none;border:0;color:var(--meta);font-size:14px;font-weight:600;cursor:pointer;padding:6px 4px}
.serlink:hover{color:var(--ink)}
.serdot{color:var(--line)}
.bt svg{width:20px;height:20px;color:var(--gold)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(251,250,247,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:720px;margin:0 auto;display:flex}
.ni{flex:1;min-height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--meta);cursor:pointer}
.ni svg{width:25px;height:25px}.ni .lb{font-size:11px;font-weight:600}.ni.on{color:var(--gold)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(14,11,8,.45);opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:720px;margin:0 auto;max-height:93vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(101%);transition:transform .28s cubic-bezier(0,0,0,1);box-shadow:0 -8px 40px rgba(20,17,12,.2)}
.sheet.on{transform:translateY(0)}
.grip{width:38px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
.sbar{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;padding:8px 18px 12px;border-bottom:1px solid var(--line)}
.ib{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink2);border-radius:var(--pill);cursor:pointer;transition:color .15s}
.ib.on{color:var(--gold)}.ib.on svg{fill:var(--gold)}
.cb{padding:18px 22px 60px}
.ct{font-size:30px;line-height:35px;font-weight:800;letter-spacing:-.02em;margin:6px 0 12px}
.clead{font-size:17px;line-height:26px}
.cap{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:16px;box-shadow:var(--sh)}
.cap .lb{font-size:13px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.cap .bd{font-size:16px;line-height:24px;white-space:pre-line}
.honest{margin-top:16px;background:#211C16;color:#EFE6D7;border-radius:var(--rs);padding:16px}
.honest .lb{font-size:13px;font-weight:700;color:var(--gold-br);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.honest .bd{font-size:15px;line-height:23px;white-space:pre-line}
.deep{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}.deep .dh{font-size:18px;font-weight:700}.deep .dn{font-size:13px;color:var(--meta);margin-bottom:14px}
.dsec{margin-top:18px}.dsec .l{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--meta);margin-bottom:6px}.dsec .b{font-size:16px;line-height:24px;white-space:pre-line}
.loading{padding:40px 0;text-align:center;color:var(--meta);font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/*TAP-FEEDBACK*/button:active,a:active,[onclick]:active,.ni:active,[data-k]:active,[data-route]:active,[data-slug]:active,[data-cont]:active,[data-q]:active,.row:active,.rt-row:active,.lg-row:active,.fc:active,.stoprow:active,.opt:active,.pill:active,.tab:active,.deeper:active{opacity:.6;transition:opacity .06s}
/*MCUX v1 — единый UX: нативные переходы между страницами, ховеры, тап-фидбек, reduced-motion*/
@view-transition{navigation:auto}
.nav{view-transition-name:mcnav}
button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.pill:active{opacity:.6;transition:opacity .06s}
@media(hover:hover){a:hover,button:hover,.ni:hover,.mrow:hover,.row:hover,.res:hover,.tbtn:hover,.fc:hover,.opt:hover,[data-k]:hover,[data-slug]:hover,[data-cont]:hover,[data-route]:hover,[data-q]:hover{opacity:.85;transition:opacity .12s ease;cursor:pointer}}
@media(hover:none){button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.lp:active,.rc:active,.cont:active,.hero:active,.scd:active,.tl:active,.fd:active,.lk:active,.deeper:active,[data-k]:active,[data-slug]:active,[data-cont]:active,[data-route]:active,[data-q]:active{opacity:.72;transform:scale(.97);transition:transform .06s ease,opacity .06s}}
a:focus-visible,button:focus-visible,[onclick]:focus-visible,.ni:focus-visible,.mrow:focus-visible,.row:focus-visible,.res:focus-visible,.tbtn:focus-visible,.fc:focus-visible,.opt:focus-visible,.lp:focus-visible,.rc:focus-visible,[data-k]:focus-visible,[data-slug]:focus-visible,[data-cont]:focus-visible,[data-route]:focus-visible{outline:2px solid var(--gold,#97591A);outline-offset:2px;border-radius:6px}
.mcstate{padding:46px 20px;text-align:center;color:var(--meta,#6E675E)}
.mcstate .ic{font-size:30px;line-height:1;margin-bottom:12px;opacity:.75}
.mcstate .msg{font-size:14.5px;line-height:20px;max-width:300px;margin:0 auto}
.mcstate .retry{margin-top:16px;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--gold,#97591A);background:none;border:1px solid var(--line,#ECE7DD);border-radius:999px;padding:9px 18px;cursor:pointer}
.mcsk{background:linear-gradient(90deg,#EFEBE2,#F6F3ED,#EFEBE2);background-size:200% 100%;animation:mcsh 1.2s infinite;border-radius:12px}
@keyframes mcsh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/*MCDESK v1 — десктоп (>=960px): нижний таб-бар -> левый сайдбар, контент смещается вправо; мобилка не трогается*/
@media(min-width:960px){
 body:has(nav.nav){padding-left:236px}
 nav.nav{top:0;bottom:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:0}
 nav.nav .navin{flex-direction:column;align-items:stretch;height:100vh;max-width:none;margin:0;padding:22px 14px;gap:3px}
 nav.nav .ni{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;min-height:0;height:auto;padding:12px 14px;border-radius:12px}
 nav.nav .ni svg{width:22px;height:22px}
 nav.nav .ni .lb{font-size:15px;font-weight:600}
 nav.nav .ni.on{background:rgba(176,106,31,.09)}
 @media(hover:hover){nav.nav .ni:hover{background:rgba(176,106,31,.06);opacity:1}}
 body:has(nav.nav) .topbar{left:236px}
 body:has(nav.nav) .sheet{left:236px}
}
/*MCATM v1 — десктоп (>=960px): атмосфера/глубина обсерватории + микро-жизнь на ховере. Мобилка не трогается, всё в каноне.*/
@media(min-width:960px){
 body{background-color:var(--bg);background-repeat:no-repeat;background-attachment:fixed;
   background-image:
     radial-gradient(1150px 640px at 88% -8%, rgba(201,138,58,.08), transparent 62%),
     radial-gradient(820px 560px at 3% 106%, rgba(107,92,165,.05), transparent 60%);}

// карточка по сети (для тем/ситуаций, у которых нет встроенного тела)
function liveCard(slugOrTitle){
 SHEET_CUR={slug:slugOrTitle, title:slugOrTitle, kind:'card'};
 if(!window.__SB){ openSeedCard(slugOrTitle, 'mixed', {lead:'Полная карточка подгружается из базы при наличии сети.'}, slugOrTitle); return; }
 document.getElementById('cb').innerHTML='<div style="padding:6px 0"><div class="mcsk" style="height:20px;width:46%;margin-bottom:12px"></div><div class="mcsk" style="height:28px;width:84%;margin-bottom:16px"></div><div class="mcsk" style="height:15px;margin-bottom:7px"></div><div class="mcsk" style="height:15px;width:94%;margin-bottom:7px"></div><div class="mcsk" style="height:15px;width:68%;margin-bottom:20px"></div><div class="mcsk" style="height:88px;border-radius:14px"></div></div>'; showSheet();
 var guest=!window.__MEMBER;
 window.__SB.rpc(guest?'kb_public_bundle':'kb_node_bundle',{p_slug:slugOrTitle}).then(function(r){
  var b=r&&r.data; if(!b){ document.getElementById('cb').innerHTML=cardHtml(slugOrTitle,'mixed',{lead:'Карточка не найдена в открытой части базы.'}); return; }
  var bs=b.body_struct||b; if(SHEET_CUR){ SHEET_CUR.title=b.title||slugOrTitle; } syncFav();
  document.getElementById('cb').innerHTML=cardHtml(b.title||slugOrTitle, b.robustness||'mixed', {
   lead:bs['суть'], apply:bs['применение'], mech:bs['механизм'], ex:bs['пример'],
   counter:bs['как-на-самом-деле']||bs['механизм-заблуждения']});
 }).catch(function(){ document.getElementById('cb').innerHTML=cardHtml(slugOrTitle,'mixed',{lead:'Нет сети — полная карточка недоступна офлайн.'}); });
}

// синхронно: токен сессии в localStorage → рисуем как участник сразу (без гостевого мелькания)
function mcLikelyMember(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf('sb-')===0&&k.indexOf('-auth-token')>0){ var v=localStorage.getItem(k); if(v&&v.length>20) return true; } } }catch(e){} return false; }
if(mcLikelyMember()) window.__MEMBER=true;
// ── Онбординг-оверлей (первый визит): захватываем цели → Матчасть под задачу. Голос: «вы», сухой уважающий коллега.
var ONB_LEVERS=[
 {k:'activation',t:'Активация',s:'довести до ценности'},
 {k:'retention',t:'Удержание',s:'вернуть и удержать'},
 {k:'monetization',t:'Монетизация',s:'цена и оплата'},
 {k:'engagement',t:'Вовлечение',s:'внимание и привычка'},
 {k:'decisions',t:'Решения',s:'приоритеты и выбор'}
];
function mcModelGet(){ try{ return JSON.parse(localStorage.getItem('mc:model')||'null'); }catch(e){ return null; } }
function mcOnbSeen(){ var m=mcModelGet(); if(m && (m.skipped || (m.goals&&m.goals.length))) return true; try{ return localStorage.getItem('mc:onbdone')==='1'; }catch(e){ return false; } }
// v4 (screen-onboarding v4, 347341d9): ЦЕННОСТЬ первым — никакого вопроса-гейта до ценности (догфудинг:
// reciprocity + cognitive-load, принципы самой базы). Экран 1 = «что это» + живой вкус честного разбора, БЕЗ ввода.
// Персонализация «под задачу» — ОПЦИОНАЛЬНО и ПОТОМ (экран 2, opt-in). Закрыть = впустить (дружелюбный дефолт).
function showOnboarding(){
 if(document.getElementById('onbov') || mcOnbSeen()) return;
 var ov=document.createElement('div'); ov.id='onbov'; ov.className='onbov';
 document.body.appendChild(ov);
 requestAnimationFrame(function(){ ov.classList.add('on'); });
 var _prevFocus=document.activeElement;
 function close(seen){ if(seen){ try{ localStorage.setItem('mc:onbdone','1'); }catch(e){} } ov.classList.remove('on'); try{ if(_prevFocus&&_prevFocus.focus) _prevFocus.focus(); }catch(e){} setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); }, 320); }
 // a11y: Esc/тап-по-фону = впустить (дружелюбный дефолт, не «пропуск-как-отказ»); Tab-ловушка внутри.
 ov.addEventListener('keydown',function(e){
   if(e.key==='Escape'){ e.preventDefault(); close(true); return; }
   if(e.key==='Tab'){ var f=ov.querySelectorAll('button, [tabindex]'); if(!f.length) return; var a=f[0], z=f[f.length-1];
     if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); }
     else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); } }
 });
 ov.addEventListener('click',function(e){ if(e.target===ov) close(true); });

 // ── Экран 1: ЦЕННОСТЬ (что это + живой вкус разбора, без ввода) ──
 function renderWelcome(){
  var hero=(CUR&&CUR.hero)||SEED.hero; var hr=robInfo(hero.rob);
  var taste=(hero.card&&hero.card.counter)?hero.card.counter:hero.teaser;
  ov.innerHTML='<div class="onbc" role="dialog" aria-modal="true" aria-label="Честно о поведении">'
    +'<div class="onbk">Честно о поведении</div>'
    +'<div class="onbt">Как люди на самом деле принимают решения</div>'
    +'<div class="onbs">Разборы продуктовых методов — с пометкой, насколько концепт подтверждён, и ссылкой на источник. Не лайфхаки, а связанный граф.</div>'
    +'<div class="onbdemo"><div class="onbdemo-h"><span class="onbdemo-t">'+esc(hero.title)+'</span><span class="tag'+(hero.rob==="mixed"?" mix":"")+'">'+esc(hr.t)+'</span></div>'
      +'<div class="onbdemo-lb">А как на самом деле</div><div class="onbdemo-bd">'+esc(clip(taste,240))+'</div></div>'
    +'<div class="onbf"><button class="onbb" id="onbEnter" style="margin-left:0;width:100%">Открыть Справочник →</button></div>'
    +'<button class="onbtune" id="onbTune">Подстроить под вашу задачу →</button></div>';
  var eb=ov.querySelector('#onbEnter'); if(eb) try{ eb.focus(); }catch(e){}
  eb.onclick=function(){ try{ track('onboard_enter',{}); }catch(e){} close(true); };
  ov.querySelector('#onbTune').onclick=function(){ try{ track('onboard_tune_open',{}); }catch(e){} renderTune(); };
 }

 // ── Экран 2 (ОПЦИОНАЛЬНО, по желанию, ПОСЛЕ ценности): рычаг → под задачу ──
 function renderTune(){
  var sel={};
  var tiles=ONB_LEVERS.map(function(l){ return '<button class="onbi" data-k="'+l.k+'"><div class="t">'+esc(l.t)+'</div><div class="s">'+esc(l.s)+'</div></button>'; }).join('');
  ov.innerHTML='<div class="onbc" role="dialog" aria-modal="true" aria-label="Подстроить под вашу задачу"><div class="onbk">Подстроить под вашу задачу</div>'
    +'<div class="onbt">Над чем вы сейчас работаете?</div>'
    +'<div class="onbs">Выберите, что ближе — поднимем нужное первым. Необязательно, можно вернуться позже.</div>'
    +'<div class="onbg">'+tiles+'</div>'
    +'<div class="onbf"><button class="onbp" id="onbSkip">Не сейчас</button><button class="onbb" id="onbGo" disabled>Показать →</button></div></div>';
  var go=ov.querySelector('#onbGo');
  var _first=ov.querySelector('.onbi'); if(_first) try{ _first.focus(); }catch(e){}
  Array.prototype.forEach.call(ov.querySelectorAll('.onbi'),function(b){ b.onclick=function(){ var k=b.getAttribute('data-k'); if(sel[k]){ delete sel[k]; b.classList.remove('sel'); } else { sel[k]=1; b.classList.add('sel'); } go.disabled=Object.keys(sel).length===0; }; });
  ov.querySelector('#onbSkip').onclick=function(){ try{ track('onboard_skip',{}); }catch(e){} close(true); };
  go.onclick=function(){ var goals=Object.keys(sel); if(!goals.length) return;
    try{ localStorage.setItem('mc:model', JSON.stringify({goals:goals, ts:Date.now()})); localStorage.setItem('mc:onbdone','1'); }catch(e){}
    try{ track('onboard_done',{goals:goals}); }catch(e){}
    if(window.__MEMBER && window.__SB){ try{ var pr=window.__SB.rpc('um_apply',{p_goals:goals,p_interests:[],p_source:'overlay'}); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} }
    reRank(goals); // выбор ВИДИМО перестраивает главную: секция «Под вашу задачу» наверх, под цель
    close(false);
  };
 }

 renderWelcome();
}
function maybeOnboard(){ setTimeout(function(){ try{ if(!mcOnbSeen() && !window.__MEMBER) showOnboarding(); }catch(e){} }, 700); }

// первичный рендер: из кеша (localStorage — переживает перезапуск PWA) либо из сида
var HOME_CACHE=null;
try{ var _hc=localStorage.getItem('solvehome:data'); if(_hc){ HOME_CACHE=JSON.parse(_hc); } }catch(e){}
render(HOME_CACHE||SEED);
maybeOnboard();
// Сигнатура видимого контента главной (v5 п.6): что реально рисуется на экране. Меняется — перерисовываем; нет — пропускаем (без флеша).
function homeSig(d){ if(!d) return ''; return [(d.hero&&d.hero.slug)||'', d.all24||d.all28||'', (d.honest_series||[]).length, d.honest_total||'', d.honest_full||'', (d.featured||[]).length, (d.situations||[]).length, (d.themes||[]).length, (d.findings||[]).length].join('|'); }

// живой запрос при наличии сети + конфига
(function boot(){
 function go(){
  try{
   if(!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient)) return;
   var SB=window.supabase.createClient(String(window.SUPABASE_URL).trim(), String(window.SUPABASE_ANON_KEY).trim());
   window.__SB=SB;
   SB.auth.getSession().then(function(s){ var _sess=s&&s.data&&s.data.session; window.__MEMBER=!!_sess; try{
    // «Продолжить» из серверного контракта home_resume (свежайший визит из reader_signals, кросс-девайс); mc:last — мгновенный фолбэк
    if(_sess&&_sess.user&&_sess.user.id){ SB.rpc('home_resume',{p_who:_sess.user.id}).then(function(rr){ var rd=rr&&!rr.error&&rr.data; if(rd&&rd.has_continue&&rd.slug){ try{ localStorage.setItem('mc:last', JSON.stringify({slug:rd.slug,title:rd.title})); }catch(e){} /* «Продолжить» теперь в «Моё» (personal), не на Матчасти — ре-рендер главной не нужен (v5 п.2/п.6 антифлеш) */ } }).catch(function(){});
      // Онбординг для члена: гейт по um_get().onboarded_at; гостя, выбравшего цели, сливаем один раз (um_apply, source=merge)
      SB.rpc('um_get').then(function(um){ var m=(um&&!um.error&&um.data)||{}; var onboarded=!!(m&&m.onboarded_at); var g=mcModelGet();
        if(m && m.goals && m.goals.length){ MC_GOALS=m.goals; try{ if(window.CUR) render(window.CUR); }catch(e){} }
        if(!onboarded && g && g.goals && g.goals.length){ try{ var pr=SB.rpc('um_apply',{p_goals:g.goals,p_interests:[],p_source:'merge'}); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} onboarded=true; }
        if(onboarded){ try{ localStorage.setItem('mc:onbdone','1'); localStorage.removeItem('mc:model'); }catch(e){} var _o=document.getElementById('onbov'); if(_o){ _o.classList.remove('on'); setTimeout(function(){ if(_o.parentNode) _o.parentNode.removeChild(_o); },320); } }
        else if(!mcOnbSeen()){ showOnboarding(); }
      }).catch(function(){});
    } else { window.__MEMBER=false; maybeOnboard(); }
   }catch(_e){} }).catch(function(){});
   SB.rpc('solve_home').then(function(r){ if(r&&!r.error&&r.data){ var d=r.data;
       try{ localStorage.setItem('solvehome:data', JSON.stringify(d)); }catch(e){}
       // v5 п.6 фикс моргания: перерисовываем ТОЛЬКО когда реально видимый контент отличается от отрисованного
       // (stale-while-revalidate). Иначе — гратуитный repaint = флеш. Сигнатура по тому, что рендерится на экране
       // (territory убрана из v5 — в сигнатуру не входит).
       if(homeSig(d)===homeSig(CUR)){ CUR=d; return; }
       var app=document.getElementById('app'); app.style.transition='opacity .18s'; app.style.opacity='0';
       setTimeout(function(){ try{ render(d); }catch(_){} requestAnimationFrame(function(){ app.style.opacity='1'; }); }, 180);
     } }).catch(function(){});
  }catch(_){}
 }
 // подтянуть конфиг рядом с приложением (../config.js на Pages), затем supabase-js
 function load(src,cb){ var s=document.createElement('script'); s.src=src; s.onload=cb; s.onerror=cb; document.head.appendChild(s); }
 function loadCfg(done){ var ps=['./config.js','../config.js','/book-reader/config.js']; var i=0; (function nx(){ if(window.SUPABASE_URL||i>=ps.length) return done(); var sc=document.createElement('script'); sc.src=ps[i++]; sc.onload=function(){ setTimeout(function(){ window.SUPABASE_URL?done():nx(); },0); }; sc.onerror=nx; document.head.appendChild(sc); })(); }
  loadCfg(function(){ load('vendor/supabase.min.js', go); });
})();
</script>
