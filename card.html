 document.getElementById('wrap').innerHTML='<div class="mcstate"><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4L2.8 19.5h18.4z"/><path d="M12 10v4M12 17h.01"/></svg></div><div class="msg">'+(kind==='empty'?'Такой карточки нет — возможно, ссылка устарела или в ней опечатка.':'Не удалось загрузить карточку.')+'</div><div class="deadact">'+(kind==='error'?'<button class="retry" onclick="go(\''+slug+'\')">↻ Повторить</button>':'')+'<a class="retry" href="solve-home.html">К Матчасти</a><a class="retry" href="search.html">Найти через поиск</a></div></div>';
}
function go(slug){
 // stale-while-revalidate: показать кешированную карточку мгновенно, обновить в фоне
 var cached=null; try{ cached=JSON.parse(localStorage.getItem('mc:card:'+slug)||'null'); }catch(e){}
 if(cached&&cached.slug){ render(cached); } else { document.getElementById('wrap').innerHTML='<div class="skel"><div style="height:42px;width:60%"></div><div style="height:120px"></div><div style="height:90px"></div></div>'; }
 if(!window.__SB){ if(!cached) toast('Полная карточка — при наличии сети'); return; }
 var guest=!window.__MEMBER;
 window.__SB.rpc(guest?'kb_public_bundle':'kb_node_bundle',{p_slug:slug}).then(function(r){
  if(r&&!r.error&&r.data){ var d=r.data; d.updated=d.updated||'—'; d.status=d.status||(d.content_status||'канон'); try{ localStorage.setItem('mc:card:'+slug, JSON.stringify(d)); }catch(e){} render(d); track('card_view',{slug:slug, guest:guest, src:entrySrc()}); if(!guest){ try{ window.__SB.rpc('mark_visited',{p_slug:slug}).catch(function(){}); }catch(e){} try{ var _vis=JSON.parse(localStorage.getItem('mc:visited')||'{}'); if(!_vis[slug]){ _vis[slug]=1; localStorage.setItem('mc:visited',JSON.stringify(_vis)); toast('★ +1 · зажжено на вашей Карте'); } }catch(e){} } }
  else { track('card_deadend',{slug:slug, guest:guest, reason:'empty', src:entrySrc()}); if(!cached) deadEnd('empty',slug); }
 }).catch(function(){ track('card_deadend',{slug:slug, guest:guest, reason:'error', src:entrySrc()}); if(!cached) deadEnd('error',slug); });
}

// избранное: localStorage 'mc:fav' = [{slug,title,ts}]
function favGet(){ try{ return JSON.parse(localStorage.getItem('mc:fav')||'[]')||[]; }catch(e){ return []; } }
function favHas(s){ var l=favGet(); for(var i=0;i<l.length;i++){ if(l[i]&&l[i].slug===s) return true; } return false; }
function favToggle(s,t){ var l=favGet(),i=-1; for(var k=0;k<l.length;k++){ if(l[k]&&l[k].slug===s){i=k;break;} } if(i>=0) l.splice(i,1); else l.unshift({slug:s,title:t||s,ts:Date.now()}); try{ localStorage.setItem('mc:fav',JSON.stringify(l)); }catch(e){} return i<0; }
// DB-aware слой: залогин → RPC (источник истины), аноним → localStorage
function svToggle(slug,title,kind){
 if(window.__MEMBER && window.__SB){ return window.__SB.rpc('save_toggle',{p_slug:slug,p_title:title||slug,p_kind:kind||'card'}).then(function(r){ if(r&&r.error) throw r.error; return !!r.data; }); }
 return Promise.resolve(favToggle(slug,title));
}
function svState(slug){
 if(window.__MEMBER && window.__SB){ return window.__SB.rpc('card_user_state',{p_slug:slug}).then(function(r){ var d=(r&&!r.error&&r.data)||{}; return {saved:!!d.saved, reaction:d.reaction||null}; }).catch(function(){ return {saved:false,reaction:null}; }); }
 return Promise.resolve({saved:favHas(slug), reaction:null});
}
// merge-on-login: один раз слить localStorage-избранное → БД (только отсутствующее, чтобы не «перетогглить»), затем очистить локаль
function mergeFavs(SB, done){
 var local=favGet(); if(!local.length){ if(done)done(); return; }
 SB.rpc('saves_list',{p_kind:'card'}).then(function(r){
  var have={}; ((r&&!r.error&&r.data)||[]).forEach(function(x){ have[x.slug]=1; });
  var pend=local.filter(function(x){ return x&&x.slug&&!have[x.slug]; });
  var i=0; (function nx(){ if(i>=pend.length){ try{localStorage.removeItem('mc:fav');}catch(e){} if(done)done(); return; }
   var it=pend[i++]; SB.rpc('save_toggle',{p_slug:it.slug,p_title:it.title||it.slug,p_kind:'card'}).then(nx,nx); })();
 },function(){ if(done)done(); });
}
// источники: разбить по ';' ИЛИ переносу строки (premortem и др. используют '\n'), линковать DOI/URL, иначе — поиск
function linkSources(txt){ return String(txt||'').split(/;|\n/).map(function(part){ var c=part.trim(); if(!c) return ''; var u=null; var mU=c.match(/https?:\/\/[^\s)]+/); var mD=c.match(/\b10\.\d{4,9}\/[^\s,;]+/); if(mU) u=mU[0]; else if(mD) u='https://doi.org/'+mD[0]; else u='https://scholar.google.com/scholar?q='+encodeURIComponent(c); return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(c)+'</a>'; }).filter(Boolean).join('; '); }

// первичный рендер: сид только если слаг совпадает с сидом или отсутствует — иначе скелетон (без вспышки чужой карточки)
(function(){ var _s=(new URLSearchParams(location.search)).get('slug'); if(!_s||_s===SEED.slug){ render(SEED); return; } var _c=null; try{ _c=JSON.parse(localStorage.getItem('mc:card:'+_s)||'null'); }catch(e){} if(_c&&_c.slug){ render(_c); } else { document.getElementById('wrap').innerHTML='<div class="skel"><div style="height:42px;width:60%"></div><div style="height:120px"></div><div style="height:90px"></div></div>'; } })();

// живой режим: слаг из ?slug=, конфиг рядом, supabase-js
(function boot(){
 var slug=(new URLSearchParams(location.search)).get('slug');
 function go2(){
  try{
   if(!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient)) return;
   var SB=window.supabase.createClient(String(window.SUPABASE_URL).trim(), String(window.SUPABASE_ANON_KEY).trim());
   window.__SB=SB;
   SB.auth.getSession().then(function(s){ window.__MEMBER=!!(s&&s.data&&s.data.session);
     var after=function(){ if(slug) go(slug); else { var gst=!window.__MEMBER; SB.rpc(gst?'kb_public_bundle':'kb_node_bundle',{p_slug:SEED.slug}).then(function(r){ if(r&&!r.error&&r.data) render(r.data); }).catch(function(){}); } };
     if(window.__MEMBER) mergeFavs(SB, after); else after();
   }).catch(function(){ if(slug) go(slug); });
  }catch(_){}
 }
 function load(src,cb){ var s=document.createElement('script'); s.src=src; s.onload=cb; s.onerror=cb; document.head.appendChild(s); }
 function loadCfg(done){ var ps=['./config.js','../config.js','/book-reader/config.js']; var i=0; (function nx(){ if(window.SUPABASE_URL||i>=ps.length) return done(); var sc=document.createElement('script'); sc.src=ps[i++]; sc.onload=function(){ setTimeout(function(){ window.SUPABASE_URL?done():nx(); },0); }; sc.onerror=nx; document.head.appendChild(sc); })(); }
  // config/vendor не догрузились и карточка не из сида/кеша → deadEnd вместо вечного скелетона (cold-audit)
  function cfgFail2(){ if(!slug||slug===SEED.slug) return; var _c=null; try{ _c=JSON.parse(localStorage.getItem('mc:card:'+slug)||'null'); }catch(e){} if(!(_c&&_c.slug)) deadEnd('error',slug); }
  loadCfg(function(){ if(!window.SUPABASE_URL){ cfgFail2(); return; } load('vendor/supabase.min.js', function(){ if(!(window.supabase&&window.supabase.createClient)){ cfgFail2(); return; } go2(); }); });
})();
</script>
