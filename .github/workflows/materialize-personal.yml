name: materialize-personal
on:
  push:
    branches: [cursor/books-access-scheme-50da]
permissions:
  contents: write
concurrency:
  group: materialize-personal
  cancel-in-progress: false
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write exact personal.html from gzip-b64 parts
        env:
          PERSONAL_DEST: personal.html
        run: python3 artifacts/materialize.py
      - name: Commit restored file and drop helpers
        run: |
          git config user.name "Tema Avdeev"
          git config user.email "temka.avdeev@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Wire Authelia PKCE login and identity≠membership on Моё."
          git push
