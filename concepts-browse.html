<style>
:root{
 --bg:#FBFAF7; --ink:#17150F; --ink2:#56504A; --meta:#6E675E; --line:#ECE7DD; --card:#fff;
 --gold:#97591A; --gold-br:#99682A;
 --solid:#2F7D4F; --mixed:#B8801F; --contested:#C2452F; --inbox:#8B847B;
 --be:#C98A3A; --cog:#CDA92F; --ux:#C2546A; --soc:#6B5CA5; --org:#2F8E8E; --mot:#B0452F; --prod:#3E8E8E; --neu:#8A5CC2; --def:#9A9080;
 --pill:999px; --r:16px;
 --sh:0 2px 12px rgba(20,17,12,.05),0 1px 2px rgba(20,17,12,.04);
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;padding:0 20px calc(80px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.94);backdrop-filter:blur(8px);padding:8px 0 0}
.bartop{display:flex;align-items:center;gap:8px;padding:6px 0}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink2);border-radius:var(--pill);cursor:pointer}.ib:active{background:var(--line)}
.lens{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none}.lens::-webkit-scrollbar{display:none}
.lp{flex:none;font-size:14px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:var(--pill);padding:8px 15px;cursor:pointer;white-space:nowrap}
.lp.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.head{padding:14px 0 4px}
.kick{font-size:13px;font-weight:600;color:var(--gold)}
.h1{font-size:28px;line-height:33px;font-weight:800;letter-spacing:-.02em;margin:3px 0 6px}
.sub{font-size:15px;line-height:21px;color:var(--ink2)}
.tension{margin:14px 0 6px;font-size:14px;line-height:20px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-left:3px solid var(--contested);border-radius:10px;padding:11px 14px}
.tension b{color:var(--contested);font-weight:700}
.seccount{font-size:14px;color:var(--meta);margin:24px 0 6px;font-weight:600;display:flex;align-items:center;gap:8px}
.seccount .cbar{width:10px;height:10px;border-radius:3px}
.row{display:flex;align-items:center;gap:13px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:active{background:#fff}
.row .dot{width:11px;height:11px;border-radius:50%;flex:none}
.row .dot.solid{background:var(--solid)}.row .dot.mixed{background:var(--mixed)}.row .dot.contested{background:var(--contested)}.row .dot.inbox{background:var(--inbox)}
.row .main{flex:1;min-width:0}
.row .ti{font-size:16px;font-weight:600;line-height:21px}
.row .ds{font-size:13px;line-height:18px;color:var(--ink2);margin-top:3px}
.row .tg{font-size:12px;color:var(--meta);margin-top:3px}
.row .star{color:var(--gold-br);font-size:14px;flex:none}
.row .lit{width:8px;height:8px;border-radius:50%;background:var(--gold-br);box-shadow:0 0 6px var(--gold);flex:none}
.row .cv{color:var(--meta);flex:none}
.maplink{display:inline-flex;align-items:center;gap:7px;margin:22px 0 6px;font-size:14px;font-weight:600;color:var(--gold);cursor:pointer}
.maplink svg{width:16px;height:16px}
.skel div{height:54px;background:linear-gradient(90deg,#EFEBE2,#F6F3ED,#EFEBE2);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px;margin-bottom:8px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{padding:48px 0;text-align:center;color:var(--meta);font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(251,250,247,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:720px;margin:0 auto;display:flex}
.ni{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--meta);cursor:pointer}
.ni svg{width:24px;height:24px}.ni .lb{font-size:11px;font-weight:600}.ni.on{color:var(--gold)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/*TAP-FEEDBACK*/button:active,a:active,[onclick]:active,.ni:active,[data-k]:active,[data-route]:active,[data-slug]:active,[data-cont]:active,[data-q]:active,.row:active,.rt-row:active,.lg-row:active,.fc:active,.stoprow:active,.opt:active,.pill:active,.tab:active,.deeper:active{opacity:.6;transition:opacity .06s}
/*MCUX v1 — единый UX: нативные переходы между страницами, ховеры, тап-фидбек, reduced-motion*/
@view-transition{navigation:auto}
.nav{view-transition-name:mcnav}
button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.pill:active{opacity:.6;transition:opacity .06s}
@media(hover:hover){a:hover,button:hover,.ni:hover,.mrow:hover,.row:hover,.res:hover,.tbtn:hover,.fc:hover,.opt:hover,[data-k]:hover,[data-slug]:hover,[data-cont]:hover,[data-route]:hover,[data-q]:hover{opacity:.85;transition:opacity .12s ease;cursor:pointer}}
@media(hover:none){button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.lp:active,.rc:active,.cont:active,.hero:active,.scd:active,.tl:active,.fd:active,.lk:active,.deeper:active,[data-k]:active,[data-slug]:active,[data-cont]:active,[data-route]:active,[data-q]:active{opacity:.72;transform:scale(.97);transition:transform .06s ease,opacity .06s}}
a:focus-visible,button:focus-visible,[onclick]:focus-visible,.ni:focus-visible,.mrow:focus-visible,.row:focus-visible,.res:focus-visible,.tbtn:focus-visible,.fc:focus-visible,.opt:focus-visible,.lp:focus-visible,.rc:focus-visible,[data-k]:focus-visible,[data-slug]:focus-visible,[data-cont]:focus-visible,[data-route]:focus-visible{outline:2px solid var(--gold,#97591A);outline-offset:2px;border-radius:6px}
.mcstate{padding:46px 20px;text-align:center;color:var(--meta,#6E675E)}
.mcstate .ic{font-size:30px;line-height:1;margin-bottom:12px;opacity:.75}
.mcstate .msg{font-size:14.5px;line-height:20px;max-width:300px;margin:0 auto}
.mcstate .retry{margin-top:16px;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--gold,#97591A);background:none;border:1px solid var(--line,#ECE7DD);border-radius:999px;padding:9px 18px;cursor:pointer}
.mcsk{background:linear-gradient(90deg,#EFEBE2,#F6F3ED,#EFEBE2);background-size:200% 100%;animation:mcsh 1.2s infinite;border-radius:12px}
@keyframes mcsh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/*MCDESK v1 — десктоп (>=960px): нижний таб-бар -> левый сайдбар, контент смещается вправо; мобилка не трогается*/
@media(min-width:960px){
 body:has(nav.nav){padding-left:236px}
 nav.nav{top:0;bottom:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:0}
 nav.nav .navin{flex-direction:column;align-items:stretch;height:100vh;max-width:none;margin:0;padding:22px 14px;gap:3px}
 nav.nav .ni{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;min-height:0;height:auto;padding:12px 14px;border-radius:12px}
 nav.nav .ni svg{width:22px;height:22px}
 nav.nav .ni .lb{font-size:15px;font-weight:600}
 nav.nav .ni.on{background:rgba(176,106,31,.09)}
 @media(hover:hover){nav.nav .ni:hover{background:rgba(176,106,31,.06);opacity:1}}
 body:has(nav.nav) .topbar{left:236px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
<style>
/*mc:desktop v2 — десктопный слой (>=960px): левый рельс, ритм страницы, предметные ховеры.
  Мобилка (<960px) не трогается. Заменяет прежний mc:desktop, который конфликтовал с MCDESK v1
  (рельс 92px против 236px) и на всех страницах зажимал .wrap до 760px — из-за чего, например,
  двухколоночная карточка концепта схлопывалась в 350px колонку чтения.*/
@media(min-width:960px){
 /* ── левый рельс: пункты сверху, а не по центру пустого экрана ── */
 nav.nav .navin{justify-content:flex-start;padding:18px 12px 24px;gap:2px;overflow-y:auto}
 nav.nav .navin::before{content:"Матчасть";display:block;flex:none;margin-bottom:8px;padding:4px 14px 15px;border-bottom:1px solid var(--line);font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
 nav.nav .ni{align-items:center;padding:11px 14px;border-radius:11px}
 nav.nav .ni .lb{font-size:14.5px;letter-spacing:-.005em}
 nav.nav .ni.on .lb{font-weight:700}
 /* ── колонка контента: заголовок не липнет к верхней кромке окна ── */
 .wrap{max-width:min(var(--dsk-wrap,760px),calc(100% - 48px));padding-top:36px}
 /* фиксированные слои начинаются за рельсом, а не под ним */
 body:has(nav.nav) .cta,body:has(nav.nav) .topbar,body:has(nav.nav) .start,body:has(nav.nav) .sheet{left:236px}
}
@media(min-width:960px) and (hover:hover){
 /* было: любая ссылка и кнопка выцветали до .85 — вместо этого предметные состояния */
 a:hover,button:hover,.ni:hover,.mrow:hover,.row:hover,.res:hover,.tbtn:hover,.fc:hover,.opt:hover,[data-k]:hover,[data-slug]:hover,[data-cont]:hover,[data-route]:hover,[data-q]:hover{opacity:1}
 nav.nav .ni{transition:background .15s,color .15s}
 nav.nav .ni:hover{background:rgba(176,106,31,.07);color:var(--gold)}
 .rc,.chrow.live,.scd,.sit,.cont,.fc,.tile{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
 .rc:hover,.chrow.live:hover,.scd:hover,.sit:hover,.cont:hover,.fc:hover,.tile:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(20,17,12,.11);border-color:var(--gold-br)}
 .hcta a:hover,.pnext button:hover,.start button:hover,.hacts .pri:hover,.fin .btns button.pri:hover,.cta button:hover{filter:brightness(1.08)}
}
@media(prefers-reduced-motion:reduce){nav.nav .ni,.rc,.chrow.live,.scd,.sit,.cont,.fc,.tile{transition:none}}
</style>

 <button class="ni" onclick="location.href='personal.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="lb">Моё</span></button>
</div></nav>

<script>
var D={be:"Поведенческая экономика",cog:"Когнитивная психология",soc:"Социальная психология",prod:"Продуктовые практики",mot:"Мотивация/идентичность",ux:"UX / HCI",org:"Организационные системы",neu:"Нейронаука/тело",def:"Другое"};
var DCOLV={be:"--be",cog:"--cog",soc:"--soc",prod:"--prod",mot:"--mot",ux:"--ux",org:"--org",neu:"--neu",def:"--def"};
var IMP={};["cognitive-load-theory","loss-aversion","social-proof","present-bias","anchoring","sludge","social-identity","variable-reward","mental-accounting","peak-end-rule","habit-loop","reference-point","prospect-theory","attention-residue","fogg-behavior-model","source-credibility","operant-conditioning"].forEach(function(s){IMP[s]=1;});
var SEED=[
 ["cognitive-load-theory","Теория когнитивной нагрузки","cog","solid"],["loss-aversion","Неприятие потерь","be","mixed"],
 ["social-proof","Социальное доказательство","soc","solid"],["present-bias","Смещение к настоящему","be","solid"],
 ["jtbd","JTBD — Jobs To Be Done","prod","solid"],["anchoring","Якорение","be","solid"],
 ["sludge","Вредное трение (Sludge)","be","solid"],["north-star-metric","Метрика Полярной звезды","prod","solid"],
 ["social-identity","Социальная идентичность","soc","solid"],["aarrr-funnel","Воронка AARRR","prod","solid"],
 ["psychological-reactance","Реактивное сопротивление","soc","mixed"],["variable-reward","Переменное вознаграждение","mot","solid"],
 ["habit-loop","Петля привычки","mot","solid"],["mental-accounting","Ментальный учёт","be","solid"],
 ["peak-end-rule","Правило пика и финала","neu","solid"],["reference-point","Точка отсчёта","be","solid"],
 ["goodharts-law","Закон Гудхарта","be","solid"],["network-effects-metcalfe","Сетевые эффекты Меткалфа","ux","mixed"],
 ["prospect-theory","Теория перспектив","be","solid"],["system-1-2","Система 1 и Система 2","cog","mixed"],
 ["vanity-metrics","Тщеславные метрики","def","mixed"],["attention-residue","Остаточное внимание","cog","solid"],
 ["bandwagon-effect","Эффект присоединения к большинству","be","solid"],["fogg-behavior-model","Модель поведения Фогга","mot","mixed"],
 ["fomo","Страх упустить (FOMO)","be","solid"],["retention-curve","Кривая удержания","prod","solid"],
 ["lean-startup","Бережливый стартап","def","mixed"],["payment-pain","Боль оплаты","be","solid"],
 ["source-credibility","Доверие к источнику","soc","solid"],["hook-model","Модель крючка (Hook Model)","be","mixed"],
 ["mvp","MVP — минимально жизнеспособный продукт","def","mixed"],["operant-conditioning","Оперантное обусловливание","cog","solid"],
 ["product-market-fit","Соответствие продукта рынку","org","mixed"],["partition-pricing","Партиционирование цен","be","mixed"],
 ["scarcity-mindset","Психология дефицита","be","mixed"],["trust-calibration","Калибровка доверия","ux","solid"],
 ["growth-loops","Петли роста против воронок","be","mixed"],["trust-repair-asymmetry","Асимметрия восстановления доверия","be","solid"],
 ["build-trap","Ловушка фич","org","solid"],["flow","Поток (Flow)","mot","mixed"],
 ["miller-law","Закон Миллера","ux","mixed"],["reward-prediction-error","Ошибка предсказания награды","be","solid"],
 ["mimetic-desire","Миметическое желание","soc","mixed"],["diffusion-of-innovations","Диффузия инноваций","def","solid"]
];
var ROBT={solid:"Проверено",mixed:"Есть нюансы",contested:"Спорно",inbox:"В проработке"};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function cssv(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

var NODES=SEED.map(function(a){return {s:a[0],t:a[1],d:a[2],r:a[3]};});
var VISITED={}, MEMBER=false;
// синхронно: токен сессии в localStorage → участник сразу
try{ for(var _mi=0;_mi<localStorage.length;_mi++){ var _mk=localStorage.key(_mi); if(_mk&&_mk.indexOf('sb-')===0&&_mk.indexOf('-auth-token')>0){ var _mv=localStorage.getItem(_mk); if(_mv&&_mv.length>20){ MEMBER=true; break; } } } }catch(e){}
try{ var _vc=JSON.parse(localStorage.getItem('mc:visited')||'null'); if(_vc&&typeof _vc==='object'){ VISITED=_vc; } }catch(e){}
var LENS='theme';   // theme(=По областям) | all | nesushie
var FILTER=null;    // конкретная дисциплина (ключ) при дип-линке

var qs=new URLSearchParams(location.search);
if(qs.get('view')==='nesushie') LENS='nesushie';
if(qs.get('theme')){ FILTER=qs.get('theme'); LENS='theme'; }

// Обрезка тизера по границе слова (строка «что это» под концептом, v5 п.6).
function clipW(s,n){ s=String(s==null?'':s).replace(/\s+/g,' ').trim(); if(s.length<=n) return s; var c=s.slice(0,n); var i=c.lastIndexOf(' '); if(i>Math.floor(n*0.6)) c=c.slice(0,i); return c.replace(/[\s.,;:!?«»()"'—–-]+$/,'')+'…'; }
function rowHtml(n,showTag){
 var lit=MEMBER&&VISITED[n.s];
 return '<div class="row" data-go="'+esc(n.s)+'" role="button" tabindex="0" aria-label="'+esc(n.t)+'"><span class="dot '+n.r+'" title="'+esc(ROBT[n.r]||'')+'"></span>'+
   '<div class="main"><div class="ti">'+esc(n.t)+'</div>'+(n.c?'<div class="ds">'+esc(clipW(n.c,95))+'</div>':'')+(showTag?'<div class="tg">'+esc(D[n.d]||'')+'</div>':'')+'</div>'+
   (IMP[n.s]?'<span class="star" title="Ключевой концепт">★</span>':'')+
   (lit?'<span class="lit" title="Изучено"></span>':'')+
   '<svg class="cv" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>';
}
function lensBar(){
 var items=[['nesushie','Несущие'],['theme','По областям'],['all','Все']];
 return items.map(function(it){return '<button class="lp'+(LENS===it[0]&&!FILTER?' on':(FILTER&&it[0]==='theme'?'':''))+'" data-lens="'+it[0]+'">'+it[1]+'</button>';}).join('');
}
function render(){
 document.getElementById('lens').innerHTML=lensBar();
 var H='';
 if(LENS==='nesushie'){
  var ns=NODES.filter(function(n){return IMP[n.s];});
  document.getElementById('barTitle').textContent='Ключевые концепты';
  H+='<div class="head"><div class="kick">База знаний</div><h1 class="h1">С чего начать</h1><div class="sub">'+ns.length+' главных концептов о том, как люди принимают решения. Основа, на которую опирается всё остальное.</div></div>';
  H+=ns.map(function(n){return rowHtml(n,true);}).join('') || '<div class="mcstate"><div class="ic">✦</div><div class="msg">Скоро здесь появятся концепты.</div></div>';
 } else if(FILTER){
  var inT=NODES.filter(function(n){return n.d===FILTER;});
  document.getElementById('barTitle').textContent=D[FILTER]||'Тема';
  var spor=inT.filter(function(n){return n.r==='mixed'||n.r==='contested';}).slice(0,3).map(function(n){return n.t;});
  H+='<div class="head"><div class="kick">Область знания</div><h1 class="h1">'+esc(D[FILTER]||'Область знания')+'</h1><div class="sub">'+inT.length+' '+(inT.length===1?'концепт':(inT.length<5?'концепта':'концептов'))+' в этой области</div></div>';
