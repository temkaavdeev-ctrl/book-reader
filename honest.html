<!doctype html>
<html lang="ru" style="background:#FBFAF7">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBFAF7"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Честный разбор · Матчасть</title>
<style>
:root{
 --bg:#FBFAF7; --ink:#17150F; --ink2:#56504A; --meta:#6E675E; --line:#ECE7DD; --card:#fff;
 --gold:#97591A; --gold-br:#C98A3A;
 --solid:#2F7D4F; --mixed:#B8801F; --contested:#C2452F;
 --r:16px; --rs:13px; --pill:999px;
 --sh:0 2px 12px rgba(20,17,12,.05),0 1px 2px rgba(20,17,12,.04);
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;padding:0 18px calc(84px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink2);border-radius:var(--pill);cursor:pointer;flex:none}.ib:active{background:var(--line)}
.bt{font-size:15px;font-weight:700}
.head{padding:18px 2px 4px}
.kick{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.h1{font-size:28px;line-height:33px;font-weight:800;letter-spacing:-.02em;margin:5px 0 7px}
.sub{font-size:15px;line-height:21px;color:var(--ink2)}
.res{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:15px;margin-top:12px;box-shadow:var(--sh);border-left:3px solid var(--mixed)}
.res:active{opacity:.6}
.res.solid{border-left-color:var(--solid)}.res.contested{border-left-color:var(--contested)}.res.mixed{border-left-color:var(--mixed)}
.res .rt{display:flex;align-items:center;gap:8px}
.res .nm{font-size:17px;font-weight:700;flex:1;line-height:22px}
.res .dot{width:9px;height:9px;border-radius:50%;flex:none}
.res .dot.solid{background:var(--solid)}.res .dot.mixed{background:var(--mixed)}.res .dot.contested{background:var(--contested)}
.res .hl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--gold);margin-top:9px}
.res .sn{font-size:14.5px;line-height:21px;color:var(--ink2);margin-top:3px}
.skel div{height:96px;background:linear-gradient(90deg,#EFEBE2,#F6F3ED,#EFEBE2);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--rs);margin-top:12px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.hint{font-size:13px;color:var(--meta);text-align:center;padding:24px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/*TAP-FEEDBACK*/button:active,a:active{opacity:.6;transition:opacity .06s}

/*MCUX v1 — единый UX: нативные переходы между страницами, ховеры, тап-фидбек, reduced-motion*/
@view-transition{navigation:auto}
.nav{view-transition-name:mcnav}
button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.pill:active{opacity:.6;transition:opacity .06s}
@media(hover:hover){a:hover,button:hover,.ni:hover,.mrow:hover,.row:hover,.res:hover,.tbtn:hover,.fc:hover,.opt:hover,[data-k]:hover,[data-slug]:hover,[data-cont]:hover,[data-route]:hover,[data-q]:hover{opacity:.85;transition:opacity .12s ease;cursor:pointer}}
@media(hover:none){button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.lp:active,.rc:active,.cont:active,.hero:active,.scd:active,.tl:active,.fd:active,.lk:active,.deeper:active,[data-k]:active,[data-slug]:active,[data-cont]:active,[data-route]:active,[data-q]:active{opacity:.72;transform:scale(.97);transition:transform .06s ease,opacity .06s}}
a:focus-visible,button:focus-visible,[onclick]:focus-visible,.ni:focus-visible,.mrow:focus-visible,.row:focus-visible,.res:focus-visible,.tbtn:focus-visible,.fc:focus-visible,.opt:focus-visible,.lp:focus-visible,.rc:focus-visible,[data-k]:focus-visible,[data-slug]:focus-visible,[data-cont]:focus-visible,[data-route]:focus-visible{outline:2px solid var(--gold,#97591A);outline-offset:2px;border-radius:6px}
.mcstate{padding:46px 20px;text-align:center;color:var(--meta,#6E675E)}
.mcstate .ic{font-size:30px;line-height:1;margin-bottom:12px;opacity:.75}
.mcstate .msg{font-size:14.5px;line-height:20px;max-width:300px;margin:0 auto}
.mcstate .retry{margin-top:16px;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--gold,#97591A);background:none;border:1px solid var(--line,#ECE7DD);border-radius:999px;padding:9px 18px;cursor:pointer}
.mcsk{background:linear-gradient(90deg,#EFEBE2,#F6F3ED,#EFEBE2);background-size:200% 100%;animation:mcsh 1.2s infinite;border-radius:12px}
@keyframes mcsh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/*MCDESK v1 — десктоп (>=960px): нижний таб-бар -> левый сайдбар, контент смещается вправо; мобилка не трогается*/
@media(min-width:960px){
 body:has(nav.nav){padding-left:236px}
 nav.nav{top:0;bottom:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:0}
 nav.nav .navin{flex-direction:column;align-items:stretch;height:100vh;max-width:none;margin:0;padding:22px 14px;gap:3px}
 nav.nav .ni{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;min-height:0;height:auto;padding:12px 14px;border-radius:12px}
 nav.nav .ni svg{width:22px;height:22px}
 nav.nav .ni .lb{font-size:15px;font-weight:600}
 nav.nav .ni.on{background:rgba(176,106,31,.09)}
 @media(hover:hover){nav.nav .ni:hover{background:rgba(176,106,31,.06);opacity:1}}
 body:has(nav.nav) .topbar{left:236px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
/*MCNAV — единый навбар для детальных страниц*/
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(251,250,247,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:720px;margin:0 auto;display:flex}
.ni{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--meta);cursor:pointer}
.ni svg{width:24px;height:24px}.ni .lb{font-size:11px;font-weight:600}.ni.on{color:var(--gold)}
</style>
<style>
/*mc:desktop v2 — десктопный слой (>=960px): левый рельс, ритм страницы, предметные ховеры.
  Мобилка (<960px) не трогается. Заменяет прежний mc:desktop, который конфликтовал с MCDESK v1
  (рельс 92px против 236px) и на всех страницах зажимал .wrap до 760px — из-за чего, например,
  двухколоночная карточка концепта схлопывалась в 350px колонку чтения.*/
@media(min-width:960px){
 /* ── левый рельс: пункты сверху, а не по центру пустого экрана ── */
 nav.nav .navin{justify-content:flex-start;padding:18px 12px 24px;gap:2px;overflow-y:auto}
 nav.nav .navin::before{content:"Матчасть";display:block;flex:none;margin-bottom:8px;padding:4px 14px 15px;border-bottom:1px solid var(--line);font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
 nav.nav .ni{align-items:center;padding:11px 14px;border-radius:11px}
 nav.nav .ni .lb{font-size:14.5px;letter-spacing:-.005em}
 nav.nav .ni.on .lb{font-weight:700}
 /* ── колонка контента: заголовок не липнет к верхней кромке окна ── */
 .wrap{max-width:min(var(--dsk-wrap,760px),calc(100% - 48px));padding-top:36px}
 /* фиксированные слои начинаются за рельсом, а не под ним */
 body:has(nav.nav) .cta,body:has(nav.nav) .topbar,body:has(nav.nav) .start,body:has(nav.nav) .sheet{left:236px}
}
@media(min-width:960px) and (hover:hover){
 /* было: любая ссылка и кнопка выцветали до .85 — вместо этого предметные состояния */
 a:hover,button:hover,.ni:hover,.mrow:hover,.row:hover,.res:hover,.tbtn:hover,.fc:hover,.opt:hover,[data-k]:hover,[data-slug]:hover,[data-cont]:hover,[data-route]:hover,[data-q]:hover{opacity:1}
 nav.nav .ni{transition:background .15s,color .15s}
 nav.nav .ni:hover{background:rgba(176,106,31,.07);color:var(--gold)}
 .rc,.chrow.live,.scd,.sit,.cont,.fc,.tile{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
 .rc:hover,.chrow.live:hover,.scd:hover,.sit:hover,.cont:hover,.fc:hover,.tile:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(20,17,12,.11);border-color:var(--gold-br)}
 .hcta a:hover,.pnext button:hover,.start button:hover,.hacts .pri:hover,.fin .btns button.pri:hover,.cta button:hover{filter:brightness(1.08)}
}
@media(prefers-reduced-motion:reduce){nav.nav .ni,.rc,.chrow.live,.scd,.sit,.cont,.fc,.tile{transition:none}}
</style>
</head>
<body>
<script>/*mc:hashroute*/(function(){try{var m=(location.hash||"").match(/^#\/c\/([^?&#]+)/);if(m&&m[1]){location.replace("card.html?slug="+encodeURIComponent(decodeURIComponent(m[1])));}}catch(e){}})();</script>
<div class="wrap">
  <div class="bar">
    <button class="ib" id="back" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="bt">Честный разбор</div>
  </div>
  <div class="head"><div class="kick">А как на самом деле</div><div class="h1">Где идея не так проста</div><div class="sub">Карточки, у которых есть честный двойник: что говорят данные против, где граница, что спорно. Мы не выдаём догадки за факты.</div></div>
  <div id="out"><div class="skel"><div></div><div></div><div></div></div></div>
</div>
<script>
var ROBT={solid:"Проверено",mixed:"Есть нюансы",contested:"Спорно",inbox:"В проработке"};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var out=document.getElementById('out');
document.getElementById('back').onclick=function(){ if(history.length>1) history.back(); else location.href='solve-home.html'; };
function render(rows){
 if(!rows||!rows.length){ out.innerHTML='<div class="mcstate"><div class="ic">✦</div><div class="msg">Пока нет карточек с честным разбором.</div></div>'; return; }
 out.innerHTML=rows.map(function(r){
  var rob=r.robustness||'mixed';
  var dot=ROBT[rob]?('<span class="dot '+rob+'" title="'+esc(ROBT[rob])+'"></span>'):'';
  var sn=r.honest?('<div class="hl">Честный двойник</div><div class="sn">'+esc(r.honest)+(r.honest.length>=170?'…':'')+'</div>'):'';
  return '<a class="res '+rob+'" href="card.html?slug='+encodeURIComponent(r.slug)+'"><div class="rt"><span class="nm">'+esc(r.title||r.slug)+'</span>'+dot+'</div>'+sn+'</a>';
 }).join('');
}
function load(){ if(!window.__SB) return; window.__SB.rpc('kb_honest_feed').then(function(r){ if(r&&!r.error&&r.data) render(r.data); else out.innerHTML='<div class="mcstate"><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4L2.8 19.5h18.4z"/><path d="M12 10v4M12 17h.01"/></svg></div><div class="msg">Не удалось загрузить.</div><button class="retry" onclick="load()">↻ Повторить</button></div>'; }).catch(function(){ out.innerHTML='<div class="mcstate"><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4L2.8 19.5h18.4z"/><path d="M12 10v4M12 17h.01"/></svg></div><div class="msg">Не удалось загрузить.</div><button class="retry" onclick="load()">↻ Повторить</button></div>'; }); }
(function boot(){
 function go(){ try{ if(!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient)) return; window.__SB=window.supabase.createClient(String(window.SUPABASE_URL).trim(),String(window.SUPABASE_ANON_KEY).trim()); load(); }catch(_){} }
 function ld(src,cb){ var s=document.createElement('script'); s.src=src; s.onload=cb; s.onerror=cb; document.head.appendChild(s); }
 function loadCfg(done){ var ps=['./config.js','../config.js','/book-reader/config.js']; var i=0; (function nx(){ if(window.SUPABASE_URL||i>=ps.length) return done(); var sc=document.createElement('script'); sc.src=ps[i++]; sc.onload=function(){ setTimeout(function(){ window.SUPABASE_URL?done():nx(); },0); }; sc.onerror=nx; document.head.appendChild(sc); })(); }
 // config/vendor не догрузились → ошибка с ретраем вместо вечного скелетона (cold-audit)
 function cfgFail3(){ out.innerHTML='<div class="mcstate"><div class="ic">⚠</div><div class="msg">Не удалось подключиться.</div><button class="retry" onclick="location.reload()">↻ Повторить</button></div>'; }
 loadCfg(function(){ if(!window.SUPABASE_URL){ cfgFail3(); return; } ld('vendor/supabase.min.js', function(){ if(!(window.supabase&&window.supabase.createClient)){ cfgFail3(); return; } go(); }); });
})();
</script>
<script>(function(){if(!('serviceWorker' in navigator))return;var reg=null,shown=false;function anim(){var st=document.createElement('style');st.textContent='@keyframes __spin{to{transform:rotate(360deg)}}';document.head.appendChild(st);var o=document.createElement('div');o.id='__updanim';o.style.cssText='position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(20,17,12,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .3s';o.innerHTML='<div style="width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#C98A3A;animation:__spin .8s linear infinite"></div><div style="color:#F4EEE2;font:600 15px/1.3 -apple-system,system-ui,sans-serif">Обновляем…</div>';(document.body||document.documentElement).appendChild(o);requestAnimationFrame(function(){o.style.opacity='1';});}function doUpdate(){var bb=document.getElementById('__updbar');if(bb)bb.style.opacity='0';anim();try{if(reg&&reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});}catch(e){}var done=false,fin=function(){if(done)return;done=true;location.reload();};try{navigator.serviceWorker.addEventListener('controllerchange',fin);}catch(e){}setTimeout(fin,1600);}function showUpd(){if(shown)return;shown=true;try{if(sessionStorage.getItem('mc:updshown'))return;sessionStorage.setItem('mc:updshown','1');}catch(e){}var b=document.createElement('div');b.id='__updbar';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(16px + env(safe-area-inset-bottom));z-index:99999;display:flex;align-items:center;gap:12px;background:#17150F;color:#F4EEE2;font:600 14px/1.3 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:10px 12px 10px 16px;border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.34);max-width:calc(100vw - 26px);opacity:0;transition:opacity .25s,transform .25s';var s=document.createElement('span');s.textContent='Доступна новая версия';var btn=document.createElement('button');btn.textContent='Обновить';btn.style.cssText='border:0;background:#C98A3A;color:#fff;font:inherit;font-weight:700;padding:8px 15px;border-radius:10px;cursor:pointer;flex:none';btn.onclick=doUpdate;b.appendChild(s);b.appendChild(btn);(document.body||document.documentElement).appendChild(b);requestAnimationFrame(function(){b.style.opacity='1';b.style.transform='translateX(-50%) translateY(0)';});}try{navigator.serviceWorker.register('sw.js').then(function(r){reg=r;}).catch(function(){});}catch(e){}try{navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.type==='NEW_VERSION')showUpd();});}catch(e){}try{navigator.serviceWorker.ready.then(function(r){reg=r;if(r.waiting)showUpd();r.addEventListener('updatefound',function(){var nw=r.installing;if(nw)nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpd();});});});}catch(e){}})();</script>

 <button class="ni" onclick="location.href='path.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.2"/><path d="M8.3 15.7C11 13 13 11 15.7 8.3"/><path d="M17.5 3l1.1 2.4L21 6.5l-2.4 1.1L17.5 10l-1.1-2.4L14 6.5l2.4-1.1z"/></svg><span class="lb">Путь</span></button>
