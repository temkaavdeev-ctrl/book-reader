<!doctype html>
<html lang="ru" style="background:#FBFAF7">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBFAF7"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Путь · Матчасть</title>
<style>
:root{
 --bg:#FBFAF7; --ink:#17150F; --ink2:#56504A; --meta:#6E675E; --line:#ECE7DD; --card:#fff;
 --gold:#97591A; --gold-br:#C98A3A;
 --solid:#2F7D4F; --mixed:#B8801F; --tw:#B8455C;
 --pill:999px; --r:20px; --rs:14px;
 --sh:0 2px 12px rgba(20,17,12,.05),0 1px 2px rgba(20,17,12,.04);
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;padding:0 20px calc(80px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink2);border-radius:var(--pill);cursor:pointer}.ib:active{background:var(--line)}
.ib.on{color:var(--gold)}.ib.on svg{fill:currentColor;stroke:currentColor}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:96px;z-index:50;background:#17150F;color:#F4EEE2;font-size:14px;font-weight:600;padding:10px 16px;border-radius:var(--pill);box-shadow:0 8px 28px rgba(0,0,0,.25);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.bt{font-size:15px;font-weight:700}
.head{padding:16px 0 4px}
.kick{font-size:13px;font-weight:600;color:var(--gold)}
.h1{font-size:30px;line-height:35px;font-weight:800;letter-spacing:-.02em;margin:3px 0 6px}
.sub{font-size:15px;line-height:21px;color:var(--ink2)}
.feat{margin-top:18px;border-radius:var(--r);padding:24px;cursor:pointer;background:linear-gradient(150deg,#241E18,#15110C);color:#F4EEE2;box-shadow:0 18px 46px rgba(20,17,12,.22);position:relative;overflow:hidden}
.feat::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(201,138,58,.30),transparent 70%)}
.feat .fk{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--gold-br);position:relative}
.feat .ic{margin:10px 0 6px;position:relative;color:var(--gold-br)}.feat .ic .qi{display:block}
.feat .ti{text-wrap:balance;font-size:24px;line-height:29px;font-weight:800;letter-spacing:-.02em;margin:4px 0 8px;position:relative}
.feat .pr{font-size:15px;line-height:22px;color:#D8D0C3;position:relative}
.feat .mt{margin-top:16px;display:flex;align-items:center;gap:10px;position:relative}
.feat .go{font-size:15px;font-weight:700;color:var(--gold-br)}
.feat .meta{font-size:13px;color:#A89C88}
.seclbl{font-size:14px;color:var(--meta);font-weight:700;margin:26px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.rc{display:flex;align-items:center;gap:15px;background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:16px;box-shadow:var(--sh);cursor:pointer;margin-top:11px}
.rc:active{transform:scale(.995)}
.rc .ic{flex:none;width:30px;display:flex;justify-content:center;color:var(--gold-br)}
.rc .m{flex:1;min-width:0}
.rc .t{font-size:16px;font-weight:700;line-height:21px}
.rc .p{font-size:13px;line-height:18px;color:var(--ink2);margin-top:2px}
.rc .meta{font-size:12px;color:var(--meta);margin-top:7px}
.rc .cv{color:var(--meta);flex:none}
.prog{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--gold-br)}
/* деталь */
.coldq{font-size:24px;line-height:31px;font-weight:800;letter-spacing:-.015em;margin:18px 0 12px}
.dmeta{font-size:14px;color:var(--meta);margin-bottom:18px}
.ddesc{font-size:16px;line-height:25px;color:var(--ink2)}
.stops{margin-top:22px}
.stops .l{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--meta);margin-bottom:8px}
.stoprow{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.stoprow:last-child{border-bottom:0}
.stoprow .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--gold-br);color:var(--gold);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.stoprow .sb{display:flex;flex-direction:column;gap:2px;min-width:0;padding-top:2px}
.stoprow .t{font-size:15px;font-weight:600}
.stoprow .sd{font-size:13px;line-height:18px;color:var(--meta)}
.stoprow.sdone .n{background:var(--gold);border-color:var(--gold);color:#fff}
.stoprow.sdone .t{color:var(--meta)}
.stoprow.scur .n{outline:3px solid rgba(151,89,26,.18)}
.start{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(transparent,#FBFAF7 40%);padding:18px 20px calc(18px + env(safe-area-inset-bottom))}
.start-in{max-width:680px;margin:0 auto}
.start button{width:100%;height:54px;border-radius:var(--rs);border:0;background:var(--gold);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
/* player */
.cold{position:fixed;inset:0;z-index:5;background:radial-gradient(120% 90% at 50% 10%,#241E18,#15110C 60%,#0E0C0A);color:#F4EEE2;display:flex;flex-direction:column;justify-content:center;padding:32px 26px calc(40px + env(safe-area-inset-bottom))}
.cold .ck{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-br)}
.cold .cq{text-wrap:balance;font-size:30px;line-height:38px;font-weight:800;letter-spacing:-.02em;margin:14px 0 16px}
.cold .cm{font-size:14px;color:#A89C88}
.cold .cb{margin-top:auto;width:100%;height:54px;border-radius:var(--rs);border:0;background:var(--gold);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.ptop{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.95);backdrop-filter:blur(8px);padding:10px 0}
.ptop .row{display:flex;align-items:center;gap:10px}
.ptop .x{width:44px;height:44px;border:0;background:none;color:var(--ink2);border-radius:var(--pill);cursor:pointer;font-size:20px}
.ptop .pc{flex:1;font-size:13px;font-weight:600;color:var(--meta)}
.beat{margin:20px 0 4px;font-size:17.5px;line-height:28px;color:var(--ink);letter-spacing:-.003em}
.beat p{margin:0 0 18px}.beat p:last-child{margin-bottom:0}
.beat p:first-child{font-size:20px;line-height:30px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
.beat.soon{color:var(--meta);font-style:italic;border-left:3px solid var(--gold-br);padding-left:14px}
.beat.soon p:first-child{font-size:inherit;font-weight:inherit}
.beat.reveal{margin-top:8px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--tw);border-radius:14px;padding:16px 18px;box-shadow:var(--sh)}
.beat.reveal p:first-child{font-size:17.5px;line-height:28px;font-weight:400}
.twtag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--tw);padding:4px 11px;border-radius:999px;margin:22px 0 6px}
.pdots{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.pdots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s}.pdots i.on{background:var(--gold-br)}.pdots i.cur{background:var(--gold);transform:scale(1.35)}
.stopcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);margin-top:8px}
.stopcard .tw{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--tw);margin-bottom:6px}
.stopcard h2{font-size:23px;line-height:28px;font-weight:800;letter-spacing:-.01em;margin:0 0 10px}
.stopcard .lead{font-size:16px;line-height:25px}
.stopcard .ap{margin-top:16px;background:var(--bg);border-radius:12px;padding:14px}.stopcard .ap .l{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}.stopcard .ap .b{font-size:15px;line-height:23px}
.deeper{margin-top:14px;font-size:14px;font-weight:600;color:var(--gold);cursor:pointer}
/* inline concept-card accordion (Разобрать глубже) */
.dig{margin-top:18px}
/* крупная заметная кнопка-CTA (Артём): клиент должен захотеть нажать и узнать подробнее */
.dig .dt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:linear-gradient(135deg,rgba(151,89,26,.10),rgba(201,138,58,.05));border:1.5px solid var(--gold-br);border-radius:16px;padding:15px 17px;cursor:pointer;user-select:none;box-shadow:var(--sh);font:inherit;color:var(--ink)}
.dig .dt:active{transform:scale(.99);opacity:.85}
.dig .dt .di{flex:none;width:40px;height:40px;border-radius:12px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center}
.dig .dt .di svg{width:21px;height:21px}
.dig .dt .dtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dig .dt .dtl{font-size:16px;font-weight:800;color:var(--gold);letter-spacing:-.01em}
.dig .dt .dts{font-size:13px;line-height:17px;color:var(--meta)}
.dig .dt .cv{flex:none;width:22px;height:22px;color:var(--gold-br);transition:transform .18s ease}
.dig.open .dt{border-radius:16px 16px 0 0}
.dig.open .dt .cv{transform:rotate(90deg)}
@media(hover:hover){.dig .dt:hover{background:linear-gradient(135deg,rgba(151,89,26,.15),rgba(201,138,58,.08))}}
.dig .db{overflow:hidden;max-height:0;transition:max-height .28s ease}
.dig.open .db{max-height:none}
.dig .dinner{margin-top:0;background:#fff;border:1.5px solid var(--gold-br);border-top:0;border-radius:0 0 16px 16px;padding:16px 18px;box-shadow:var(--sh)}
.dig .dsec{margin-bottom:14px}.dig .dsec:last-child{margin-bottom:0}
.dig .dsec .l{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
.dig .dsec .b{font-size:15px;line-height:23px;color:var(--ink)}
.dig .dsec.honest{background:var(--bg);border-radius:12px;padding:12px 14px}
.dig .dsec.honest .l{color:var(--tw)}
.dig .dmore{margin-top:14px;display:inline-block;font-size:13px;font-weight:600;color:var(--gold)}
.dig .dload{font-size:14px;color:var(--meta);padding:4px 0}
@media(min-width:1020px){
 .dirs{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}
 .hh{padding-top:14px}
 .ht1{font-size:32px;line-height:38px}
 .chrow.live{transition:border-color .15s, transform .12s}
 .chrow.live:hover{border-color:var(--gold-br)}
 .hcta a{max-width:420px;margin:0 auto}
}
@media(prefers-reduced-motion:reduce){.dig .db{transition:none}.dig .dt .cv{transition:none}}
.predict{background:#211C16;color:#EFE6D7;border-radius:var(--r);padding:22px;margin-top:8px}
.predict .q{font-size:20px;line-height:27px;font-weight:700;margin-bottom:16px}
.predict .opts{display:flex;gap:12px;flex-wrap:wrap}
.predict .opts button{flex:1 1 28%;min-width:92px;min-height:50px;padding:9px 12px;border-radius:12px;border:1px solid #4A4030;background:transparent;color:#EFE6D7;font-size:15px;font-weight:700;line-height:1.25;cursor:pointer}
.predict .opts button:active{background:#2C261D}
.fsky{display:flex;gap:12px;justify-content:center;margin:8px 0 14px}
.fstar{color:#F0CE8A;font-size:20px;opacity:.25;animation:ign .5s ease forwards}
@keyframes ign{to{opacity:1;text-shadow:0 0 12px rgba(240,206,138,.65)}}
/* reduced-motion гасил анимацию → звёзды застревали на opacity .25 навсегда: показываем финальное состояние (a11y, cold-audit) */
@media(prefers-reduced-motion:reduce){.fstar{opacity:1;animation:none;text-shadow:0 0 12px rgba(240,206,138,.65)}}
.fmoves{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:15px 16px;margin:16px 0 4px}
.fmoves .l{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gold);margin-bottom:9px}
.fmv{display:flex;gap:10px;font-size:14.5px;line-height:21px;margin-top:7px}
.fmv .n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--meta);display:flex;align-items:center;justify-content:center}
/* ── дом Пути (v1.1) ── */
.hh{padding:6px 0 0}
.hkick{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}
.ht1{font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.02em;margin:8px 0 0;text-wrap:balance}
.hline{font-size:16px;line-height:25px;color:var(--ink2);margin-top:12px}
.hwhat{font-size:13.5px;line-height:20px;color:var(--meta);margin-top:10px;padding-left:12px;border-left:2px solid var(--line)}
.hrecap{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:14.5px;line-height:21px;color:var(--ink2)}
.hoverall{margin-top:18px;font-size:13.5px;font-weight:600;color:var(--meta)}
.hoverall+.hprog{margin-top:6px}
.hnext{margin-top:12px;font-size:13.5px;line-height:19px;color:var(--meta);text-align:center}
.hprog{margin-top:18px;font-size:14px;font-weight:600;color:var(--meta)}
.hdots{display:flex;gap:7px;margin-top:9px}
.hdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.hdots i.on{background:var(--gold-br)}
.hdots i.cur{background:var(--gold);outline:3px solid rgba(151,89,26,.18)}
.hsky{margin-top:22px;background:linear-gradient(170deg,#1E1913,#12100C);border-radius:18px;padding:18px}
.hsl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#8f8574;margin-bottom:10px}
.hstars{display:flex;gap:14px;flex-wrap:wrap;align-items:center;min-height:28px}
.hst{width:10px;height:10px;border-radius:50%;background:#3a332a;transition:background .3s}
.hst.lit{background:#F0CE8A;box-shadow:0 0 10px 2px rgba(240,206,138,.5)}
.hcta{margin-top:22px}
.hcta a{display:flex;align-items:center;justify-content:center;height:54px;border-radius:var(--rs);background:var(--gold);color:#fff;font-size:16px;font-weight:700;text-decoration:none}
.haside{display:block;text-align:center;margin-top:14px;font-size:13.5px;color:var(--meta);text-decoration:none;padding:12px 8px}
.hrestart{display:block;text-align:center;margin-top:4px;font-size:13.5px;color:var(--meta);background:none;border:0;font:inherit;cursor:pointer;width:100%;padding:10px 8px}
.hacts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.hacts a{display:flex;align-items:center;justify-content:center;height:50px;border-radius:var(--rs);text-decoration:none;font-size:15px;font-weight:700}
.hacts .pri{background:var(--gold);color:#fff}
.hacts .sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.dirs{margin-top:30px}
.dir{margin-bottom:22px}
.dname{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--meta)}
.dtag{font-size:13px;line-height:19px;color:var(--meta);margin:3px 0 9px}
.chrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:13px 15px;margin-bottom:8px;box-shadow:var(--sh)}
.chrow.live{cursor:pointer}
.chrow.writing{background:var(--bg);box-shadow:none;border-style:dashed}
.chn{flex:none;min-width:26px;height:26px;border-radius:13px;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--meta);display:flex;align-items:center;justify-content:center;padding:0 5px}
.chrow.done .chn{background:rgba(47,125,79,.12);border-color:transparent;color:#2F7D4F}
.chb{flex:1;min-width:0}
.cht{display:block;font-size:15px;font-weight:650}
.chm{display:block;font-size:12.5px;color:var(--meta);margin-top:1px}
.chm .chrev{font-style:normal;color:var(--meta)} /* тихо, не оранжевым (bus 38895927 п.2д) */
.chrow svg.cv{flex:none;color:var(--meta)}
.chrow.cur{border-color:var(--gold-br);box-shadow:0 0 0 1px var(--gold-br) inset, var(--sh)}
.chrow.cur .chn{background:var(--gold);border-color:var(--gold);color:#fff}
.chrow.cur .chm{color:var(--gold)}
.dir-empty .dname{margin-bottom:6px}
.chrow.writing.thin{padding:10px 15px}
.pnext{margin-top:20px}
.pnext button{width:100%;height:52px;padding:0 18px;border-radius:var(--rs);border:0;background:var(--gold);color:#fff;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin{text-align:center;padding:40px 0 0}
.fin .em{font-size:40px}.fin h2{font-size:26px;font-weight:800;margin:10px 0 6px}.fin p{color:var(--ink2)}
.fin .btns{margin-top:24px;display:grid;gap:12px}
.fin .btns button{height:52px;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.fin .btns button.pri{background:var(--gold);color:#fff;border:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(251,250,247,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:720px;margin:0 auto;display:flex}
.ni{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--meta);cursor:pointer}
.ni svg{width:24px;height:24px}.ni .lb{font-size:11px;font-weight:600}.ni.on{color:var(--gold)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/*TAP-FEEDBACK*/button:active,a:active,[onclick]:active,.ni:active,[data-k]:active,[data-route]:active,[data-slug]:active,[data-cont]:active,[data-q]:active,.row:active,.rt-row:active,.lg-row:active,.fc:active,.stoprow:active,.opt:active,.pill:active,.tab:active,.deeper:active{opacity:.6;transition:opacity .06s}
/*MCUX v1 — единый UX: нативные переходы между страницами, ховеры, тап-фидбек, reduced-motion*/
@view-transition{navigation:auto}
.nav{view-transition-name:mcnav}
button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.pill:active{opacity:.6;transition:opacity .06s}
@media(hover:hover){a:hover,button:hover,.ni:hover,.mrow:hover,.row:hover,.res:hover,.tbtn:hover,.fc:hover,.opt:hover,[data-k]:hover,[data-slug]:hover,[data-cont]:hover,[data-route]:hover,[data-q]:hover{opacity:.85;transition:opacity .12s ease;cursor:pointer}}
@media(hover:none){button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.lp:active,.rc:active,.cont:active,.hero:active,.scd:active,.tl:active,.fd:active,.lk:active,.deeper:active,[data-k]:active,[data-slug]:active,[data-cont]:active,[data-route]:active,[data-q]:active{opacity:.72;transform:scale(.97);transition:transform .06s ease,opacity .06s}}
a:focus-visible,button:focus-visible,[onclick]:focus-visible,.ni:focus-visible,.mrow:focus-visible,.row:focus-visible,.res:focus-visible,.tbtn:focus-visible,.fc:focus-visible,.opt:focus-visible,.lp:focus-visible,.rc:focus-visible,[data-k]:focus-visible,[data-slug]:focus-visible,[data-cont]:focus-visible,[data-route]:focus-visible{outline:2px solid var(--gold,#97591A);outline-offset:2px;border-radius:6px}
.mcstate{padding:46px 20px;text-align:center;color:var(--meta,#6E675E)}
.mcstate .ic{font-size:30px;line-height:1;margin-bottom:12px;opacity:.75}
.mcstate .msg{font-size:14.5px;line-height:20px;max-width:300px;margin:0 auto}

function digFetch(slug){

 if(!slug) return Promise.resolve(null);
 var c=window.__digCache;

 var SB=window.__SB;
 if(!(SB&&SB.rpc)) return Promise.resolve(null); // офлайн / нет Supabase → фолбэк
 var rpc=window.__MEMBER?'kb_node_bundle':'kb_public_bundle';
 return SB.rpc(rpc,{p_slug:slug}).then(function(r){
  if(r&&!r.error&&r.data){ c[slug]=r.data; return r.data; }

function digBodyHTML(bundle,slug){

// Разворот на месте: ленивая загрузка при первом раскрытии, кэш, фолбэк на card.html при сбое/офлайне.
function digToggle(el,slug){
 var wrap=el.closest?el.closest('.dig'):(function(n){while(n&&!(n.className&&/\bdig\b/.test(n.className)))n=n.parentNode;return n;})(el);
 if(!wrap) return;
 var body=wrap.querySelector('.db');
 var open=/\bopen\b/.test(wrap.className);
 if(open){ wrap.className=wrap.className.replace(/\s*\bopen\b/,''); return; }
 if(wrap.getAttribute('data-loaded')==='1'){ wrap.className+=' open'; return; }
 if(wrap.getAttribute('data-loading')==='1') return;
 wrap.setAttribute('data-loading','1');
 body.innerHTML='<div class="dload">Загружаем…</div>';
 wrap.className+=' open';
 digFetch(slug).then(function(bundle){
  wrap.removeAttribute('data-loading');
  if(!bundle){ // фолбэк: без данных ведём на card.html, как раньше
   try{ track('quest_deeper_fallback',{slug:slug}); }catch(e){}
   location.href='card.html?slug='+encodeURIComponent(slug); return;
  }
  wrap.setAttribute('data-loaded','1');
  body.innerHTML='<div class="dinner">'+digBodyHTML(bundle,slug)+'</div>';
  try{ track('quest_deeper_open',{slug:slug}); }catch(e){}
 });
}
