<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Созвездие — Исследовать</title>
<style>
:root{
 --sky0:#0E0C0A; --sky1:#15110C; --sky2:#1C1812;
 --ink:#F4EEE2; --ink2:#B8AE9D; --meta:#897F70; --line:#2A241C;
 --gold:#C98A3A; --gold-br:#E7C07A;
 --be:#C98A3A; --cog:#CDA92F; --ux:#C2546A; --soc:#8B7BD6; --org:#3FA9A9; --mot:#D06A4F; --prod:#52B0B0; --neu:#A77BE0; --def:#9A9080;
 --solid:#7FD49B; --mixed:#E7C07A; --contested:#E78A78;
 --pill:999px;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--sky0);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
#sky{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%,#1C1812 0%,#15110C 45%,#0E0C0A 100%)}
#stars{position:fixed;inset:0;pointer-events:none;opacity:.5}
svg.map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
svg.map:active{cursor:grabbing}
.edge{stroke:#5A4F3C;stroke-opacity:.28}
.edge.tension{stroke:#7A4030;stroke-opacity:.4}
.lbl{font-size:11px;fill:var(--ink2);pointer-events:none;text-anchor:middle;font-weight:600}
.node-hit{cursor:pointer}
/* верх-панель */
.topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:linear-gradient(#0E0C0A 30%,rgba(14,12,10,0))}
.terr{display:inline-flex;align-items:center;gap:8px;background:rgba(28,24,18,.8);border:1px solid var(--line);border-radius:var(--pill);padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink)}
.terr b{color:var(--gold-br)}.terr svg{width:15px;height:15px;color:var(--gold)}
.tspacer{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(28,24,18,.8);border:1px solid var(--line);border-radius:var(--pill);padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.tbtn svg{width:15px;height:15px}
.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;text-align:center;color:var(--meta);font-size:14px;max-width:240px;pointer-events:none;opacity:0;transition:opacity .4s}
.hint.on{opacity:1}
/* нижний таб */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(14,12,10,.86);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:720px;margin:0 auto;display:flex}
.ni{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--meta);cursor:pointer}
.ni svg{width:24px;height:24px}.ni .lb{font-size:11px;font-weight:600}.ni.on{color:var(--gold-br)}
/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:720px;margin:0 auto;background:var(--sky2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(101%);transition:transform .28s cubic-bezier(0,0,0,1);box-shadow:0 -8px 40px rgba(0,0,0,.5);padding:0 22px calc(26px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.grip{width:38px;height:5px;border-radius:3px;background:#3A3328;margin:10px auto 14px}
.np-type{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--gold-br);background:rgba(201,138,58,.14);padding:4px 10px;border-radius:var(--pill)}
.rob{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:var(--pill);padding:3px 10px}
.rob .d{width:8px;height:8px;border-radius:50%}.rob.solid .d{background:var(--solid)}.rob.mixed .d{background:var(--mixed)}.rob.contested .d{background:var(--contested)}.rob.inbox .d{background:var(--meta)}
.np-title{font-size:22px;line-height:27px;font-weight:800;letter-spacing:-.01em;margin:2px 0 8px}
.np-claim{font-size:15px;line-height:22px;color:var(--ink2)}
.np-lit{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:13px;font-weight:600}
.np-lit .s{width:9px;height:9px;border-radius:50%}
.np-lit.on{color:var(--gold-br)}.np-lit.on .s{background:var(--gold-br);box-shadow:0 0 8px var(--gold)}
.np-lit.off{color:var(--meta)}.np-lit.off .s{background:#3A3328}
.np-open{margin-top:18px;width:100%;height:50px;border-radius:14px;border:0;background:var(--gold);color:#1A1407;font-size:15px;font-weight:700;cursor:pointer}
.lg-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
.lg-row:last-child{border-bottom:0}
.lg-dot{width:16px;height:16px;border-radius:50%;flex:none}
.lg-h{font-size:20px;font-weight:800;margin:4px 0 8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="sky"></div>
<canvas id="stars"></canvas>
<svg class="map" id="map" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice"><g id="vp"></g></svg>
<div class="hint" id="hint"></div>

<div class="topbar">
 <div class="terr" id="terr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.3 6.2L20.5 11l-6.2 2.3L12 19.5 9.7 13.3 3.5 11l6.2-1.8z"/></svg><span id="terrTxt">…</span></div>
 <div class="tspacer"></div>
 <div class="tbtn" id="legendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>Легенда</div>
</div>

<nav class="nav"><div class="navin">
 <button class="ni on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 1.5L13 16l-1.5-4.5z"/></svg><span class="lb">Исследовать</span></button>
 <button class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5A2.5 2.5 0 0 0 6.5 8H20"/></svg><span class="lb">Решить</span></button>
 <button class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg><span class="lb">Расти</span></button>
 <button class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="lb">Меню</span></button>
</div></nav>

<div class="scrim" id="scrim" onclick="closeSheets()"></div>
<div class="sheet" id="np"><div class="grip"></div><div id="npBody"></div></div>
<div class="sheet" id="legend"><div class="grip"></div>
 <div class="lg-h">Как читать карту</div>
 <div class="lg-row"><span class="lg-dot" style="background:var(--be)"></span>Цвет — область знания (дисциплина)</div>
 <div class="lg-row"><span class="lg-dot" style="background:var(--gold-br);box-shadow:0 0 8px var(--gold)"></span>Зажжено — вы это изучили</div>
 <div class="lg-row"><span class="lg-dot" style="background:#2A241C;border:1px solid #3A3328"></span>Тускло — ещё не открыто</div>
 <div class="lg-row"><span class="lg-dot" style="background:var(--ink2)"></span>Размер — сколько связей у идеи</div>
 <div class="lg-row"><span class="lg-dot" style="border:2px solid var(--gold-br)"></span>Кольцо — это инструмент (а не концепт)</div>
 <div class="lg-row" style="color:var(--meta);border:0;padding-top:14px">Линии — связи между идеями; красноватые — спорные места.</div>
</div>

<script>
// СИД: реальный публичный подграф (топ по связям) — рендер без сети; при сети тянем полный kb_public_graph + туман my_visited_slugs.
var D={be:"Поведенческая экономика",cog:"Когнитивная психология",soc:"Социальная психология",prod:"Продуктовые практики",mot:"Мотивация/идентичность",ux:"UX / HCI",org:"Организационные системы",neu:"Нейронаука/тело",def:"Другое"};
var SEEDN=[
 ["cognitive-load-theory","Когнитивная нагрузка","cog","solid",14],["loss-aversion","Неприятие потерь","be","mixed",14],
 ["social-proof","Социальное доказательство","soc","solid",14],["present-bias","Смещение к настоящему","be","solid",14],
 ["jtbd","JTBD — Jobs To Be Done","prod","solid",14],["anchoring","Якорение","be","solid",14],
 ["sludge","Вредное трение (Sludge)","be","solid",14],["north-star-metric","Полярная звезда","prod","solid",14],
 ["social-identity","Социальная идентичность","soc","solid",14],["aarrr-funnel","Воронка AARRR","prod","solid",14],
 ["psychological-reactance","Реактивное сопротивление","soc","mixed",14],["variable-reward","Переменное вознаграждение","mot","solid",14],
 ["habit-loop","Петля привычки","mot","solid",14],["mental-accounting","Ментальный учёт","be","solid",14],
 ["peak-end-rule","Правило пика и финала","neu","solid",14],["reference-point","Точка отсчёта","be","solid",14],
 ["goodharts-law","Закон Гудхарта","be","solid",14],["network-effects-metcalfe","Сетевые эффекты","ux","mixed",14],
 ["prospect-theory","Теория перспектив","be","solid",14],["system-1-2","Система 1 и 2","cog","mixed",14],
 ["vanity-metrics","Тщеславные метрики","def","mixed",14],["attention-residue","Остаточное внимание","cog","solid",14],
 ["bandwagon-effect","Эффект большинства","be","solid",14],["fogg-behavior-model","Модель Фогга","mot","mixed",14],
 ["fomo","Страх упустить (FOMO)","be","solid",14],["retention-curve","Кривая удержания","prod","solid",14],
 ["lean-startup","Бережливый стартап","def","mixed",13],["payment-pain","Боль оплаты","be","solid",13],
 ["source-credibility","Доверие к источнику","soc","solid",13],["hook-model","Модель крючка (Hook)","be","mixed",12],
 ["mvp","MVP","def","mixed",12],["operant-conditioning","Оперантное обусловливание","cog","solid",12],
 ["product-market-fit","Product-Market Fit","org","mixed",12],["partition-pricing","Партиционирование цен","be","mixed",11],
 ["scarcity-mindset","Психология дефицита","be","mixed",10],["trust-calibration","Калибровка доверия","ux","solid",10],
 ["growth-loops","Петли роста","be","mixed",10],["trust-repair-asymmetry","Асимметрия доверия","be","solid",10],
 ["build-trap","Ловушка фич","org","solid",8],["flow","Поток (Flow)","mot","mixed",6],
 ["miller-law","Закон Миллера","ux","mixed",6],["reward-prediction-error","Ошибка предсказания награды","be","solid",7],
 ["mimetic-desire","Миметическое желание","soc","mixed",7],["diffusion-of-innovations","Диффузия инноваций","def","solid",7]
];
var TENSION={"competes-with":1,"contradicts":1};
var SEEDE=[["aarrr-funnel","present-bias"],["anchoring","prospect-theory"],["anchoring","partition-pricing"],["attention-residue","aarrr-funnel"],["attention-residue","cognitive-load-theory"],["bandwagon-effect","fomo"],["bandwagon-effect","social-proof"],["build-trap","goodharts-law"],["build-trap","north-star-metric"],["cognitive-load-theory","aarrr-funnel"],["cognitive-load-theory","miller-law"],["cognitive-load-theory","scarcity-mindset"],["cognitive-load-theory","system-1-2"],["fogg-behavior-model","habit-loop"],["fomo","present-bias"],["fomo","scarcity-mindset"],["growth-loops","aarrr-funnel"],["habit-loop","operant-conditioning"],["hook-model","fogg-behavior-model"],["hook-model","habit-loop"],["hook-model","operant-conditioning"],["hook-model","sludge"],["hook-model","variable-reward"],["loss-aversion","north-star-metric"],["loss-aversion","prospect-theory"],["mental-accounting","payment-pain"],["mental-accounting","prospect-theory"],["mimetic-desire","social-identity"],["network-effects-metcalfe","bandwagon-effect"],["network-effects-metcalfe","growth-loops"],["north-star-metric","aarrr-funnel"],["north-star-metric","goodharts-law"],["operant-conditioning","variable-reward"],["partition-pricing","mental-accounting"],["partition-pricing","sludge"],["payment-pain","loss-aversion"],["payment-pain","partition-pricing"],["peak-end-rule","present-bias"],["present-bias","scarcity-mindset"],["product-market-fit","habit-loop"],["product-market-fit","jtbd"],["product-market-fit","loss-aversion"],["product-market-fit","reference-point"],["product-market-fit","retention-curve"],["product-market-fit","vanity-metrics"],["prospect-theory","loss-aversion"],["reference-point","anchoring"],["reference-point","loss-aversion"],["retention-curve","aarrr-funnel"],["retention-curve","habit-loop"],["retention-curve","vanity-metrics"],["reward-prediction-error","habit-loop"],["reward-prediction-error","variable-reward"],["scarcity-mindset","system-1-2"],["sludge","aarrr-funnel"],["social-proof","bandwagon-effect"],["social-proof","mimetic-desire"],["social-proof","north-star-metric"],["social-proof","social-identity"],["source-credibility","social-proof"],["system-1-2","anchoring"],["trust-calibration","trust-repair-asymmetry"],["trust-repair-asymmetry","source-credibility"],["vanity-metrics","aarrr-funnel"],["vanity-metrics","build-trap"],["vanity-metrics","goodharts-law"],["vanity-metrics","north-star-metric"],["variable-reward","habit-loop"],["diffusion-of-innovations","social-proof"]];

var DCOLVAR={be:"--be",cog:"--cog",soc:"--soc",prod:"--prod",mot:"--mot",ux:"--ux",org:"--org",neu:"--neu",def:"--def"};
var ROBT={solid:"Подтверждено",mixed:"Неоднозначно",contested:"Спорно",inbox:"В проработке"};
function cssv(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ((h>>>0)%100000)/100000;}

var W=1000,H=1000, VISITED={}, MEMBER=false, TOTAL=517;
var NODES=[], EDGES=[], POS={};

function layout(nodes){
 // кластеры по дисциплинам на эллипсе
 var byD={}; nodes.forEach(function(n){ (byD[n.d]=byD[n.d]||[]).push(n); });
 var disc=Object.keys(byD); var cx=W/2, cy=H/2;
 var centers={};
 disc.forEach(function(d,i){ var a=(i/disc.length)*Math.PI*2 - Math.PI/2; centers[d]=[cx+Math.cos(a)*W*0.30, cy+Math.sin(a)*H*0.30]; });
 POS={};
 disc.forEach(function(d){ var arr=byD[d]; var c=centers[d]; var spread=70+arr.length*9;
  arr.forEach(function(n,j){ var ang=hash(n.s)*Math.PI*2; var rad=spread*(0.30+0.70*hash(n.s+'r')); 
   POS[n.s]=[c[0]+Math.cos(ang)*rad+(hash(n.s+'x')-0.5)*26, c[1]+Math.sin(ang)*rad+(hash(n.s+'y')-0.5)*26]; }); });
}
function nodeR(g){ return 7+Math.min(14,g||4)*0.95; }

function draw(){
 var vp=document.getElementById('vp'); var ns='http://www.w3.org/2000/svg';
 var frag=document.createDocumentFragment();
 var LBL=pickLabels();
 // рёбра
 EDGES.forEach(function(e){ var a=POS[e[0]],b=POS[e[1]]; if(!a||!b) return;
  var ln=document.createElementNS(ns,'line'); ln.setAttribute('x1',a[0]);ln.setAttribute('y1',a[1]);ln.setAttribute('x2',b[0]);ln.setAttribute('y2',b[1]);
  ln.setAttribute('class','edge'+(e[2]?' tension':'')); ln.setAttribute('stroke-width',e[2]?1.1:0.8); frag.appendChild(ln); });
 // узлы
 NODES.forEach(function(n,i){ var p=POS[n.s]; if(!p) return; var lit=MEMBER?!!VISITED[n.s]:false;
  var col=cssv(DCOLVAR[n.d]||'--def'); var r=nodeR(n.g);
  var g=document.createElementNS(ns,'g'); g.setAttribute('class','node-hit'); g.setAttribute('data-slug',n.s); g.style.opacity='0';
  g.style.animation='none'; setTimeout((function(gg,d){return function(){gg.style.transition='opacity .5s';gg.style.opacity='1';};})(g,i),Math.min(900,i*8));
  if(lit){ var hl=document.createElementNS(ns,'circle'); hl.setAttribute('cx',p[0]);hl.setAttribute('cy',p[1]);hl.setAttribute('r',r+7);hl.setAttribute('fill',cssv('--gold'));hl.setAttribute('opacity','0.18'); g.appendChild(hl); }
  var c=document.createElementNS(ns,'circle'); c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',r);
  if(MEMBER && !lit){ c.setAttribute('fill','#2A241C'); c.setAttribute('stroke',col); c.setAttribute('stroke-opacity','0.5'); c.setAttribute('stroke-width','1.4'); c.setAttribute('opacity','0.5'); }
  else { c.setAttribute('fill',col); c.setAttribute('opacity', lit?1:(n.r==='solid'?0.92:(n.r==='inbox'?0.5:0.74))); if(lit){c.setAttribute('stroke',cssv('--gold-br'));c.setAttribute('stroke-width','1.5');} }
  g.appendChild(c);
  // подпись только для крупных (несущие), чтобы не было каши
  if(LBL[n.s]){ var t=document.createElementNS(ns,'text'); t.setAttribute('x',p[0]);t.setAttribute('y',p[1]+r+13);t.setAttribute('class','lbl');t.textContent=n.t.length>22?n.t.slice(0,21)+'…':n.t; g.appendChild(t); }
  frag.appendChild(g);
 });
 vp.innerHTML=''; vp.appendChild(frag);
}

function pickLabels(){
 var placed=[], LBL={};
 NODES.slice().sort(function(a,b){return (b.g||0)-(a.g||0);}).forEach(function(n){ var p=POS[n.s]; if(!p||(n.g||0)<12) return;
  var ok=true; for(var i=0;i<placed.length;i++){ if(Math.hypot(placed[i][0]-p[0],placed[i][1]-p[1])<92){ok=false;break;} }
  if(ok){ LBL[n.s]=1; placed.push(p); } });
 return LBL;
}
function render(){ layout(NODES); draw(); updateTerr(); updateHint(); }
function updateTerr(){
 var lit=Object.keys(VISITED).filter(function(s){return VISITED[s];}).length;
 document.getElementById('terrTxt').innerHTML = MEMBER ? ('зажёг <b>'+lit+'</b> из '+TOTAL) : (TOTAL+' идей · '+Object.keys(groupDisc()).length+' областей');
}
function groupDisc(){ var g={}; NODES.forEach(function(n){g[n.d]=1;}); return g; }
function updateHint(){
 var h=document.getElementById('hint'); var lit=Object.keys(VISITED).filter(function(s){return VISITED[s];}).length;
 if(MEMBER && lit===0){ h.textContent='Карта пока в тумане. Откройте любую идею — звезда зажжётся.'; h.classList.add('on'); }
 else if(!MEMBER){ h.textContent=''; h.classList.remove('on'); }
 else h.classList.remove('on');
}

// node-preview
function openPreview(slug){
 var n=NODES.filter(function(x){return x.s===slug;})[0]; if(!n) return;
 var lit=MEMBER&&!!VISITED[slug];
 var claim=n.c||'';
 var html='<div class="np-type"><span class="badge">'+(D[n.d]||'Концепт')+'</span><span class="rob '+n.r+'"><span class="d"></span>'+(ROBT[n.r]||'')+'</span></div>'+
  '<div class="np-title">'+n.t+'</div>'+
  (claim?'<div class="np-claim">'+claim+'</div>':'')+
  '<div class="np-lit '+(lit?'on':'off')+'"><span class="s"></span>'+(lit?'Зажжено — вы это изучили':(MEMBER?'Ещё не открыто':'Откройте, чтобы изучить'))+'</div>'+
  '<button class="np-open" id="npOpen">Открыть →</button>';
 document.getElementById('npBody').innerHTML=html;
 document.getElementById('npOpen').onclick=function(){ location.href='card.html?slug='+encodeURIComponent(slug); };
 openSheet('np');
}
function openSheet(id){ document.getElementById('scrim').classList.add('on'); document.getElementById(id).classList.add('on'); }
function closeSheets(){ document.getElementById('scrim').classList.remove('on'); document.getElementById('np').classList.remove('on'); document.getElementById('legend').classList.remove('on'); }
document.getElementById('legendBtn').onclick=function(){ openSheet('legend'); };

// клики по узлам (делегирование)
document.getElementById('map').addEventListener('click',function(e){ if(_moved) return; var g=e.target.closest('[data-slug]'); if(g) openPreview(g.getAttribute('data-slug')); });

// пан/зум
var T={x:0,y:0,k:1}, _drag=null, _moved=false;
function applyT(){ document.getElementById('vp').setAttribute('transform','translate('+T.x+' '+T.y+') scale('+T.k+')'); }
var map=document.getElementById('map');
map.addEventListener('pointerdown',function(e){ _drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y}; _moved=false; map.setPointerCapture(e.pointerId); });
map.addEventListener('pointermove',function(e){ if(!_drag) return; var dx=e.clientX-_drag.x, dy=e.clientY-_drag.y; if(Math.abs(dx)+Math.abs(dy)>4)_moved=true;
 var sc=map.clientWidth/1000||1; T.x=_drag.tx+dx/sc; T.y=_drag.ty+dy/sc; applyT(); });
map.addEventListener('pointerup',function(e){ _drag=null; });
map.addEventListener('pointercancel',function(){ _drag=null; });
map.addEventListener('wheel',function(e){ e.preventDefault(); var f=e.deltaY<0?1.12:0.89; var nk=Math.max(0.5,Math.min(4,T.k*f));
 T.x=T.x*(nk/T.k); T.y=T.y*(nk/T.k); T.k=nk; applyT(); },{passive:false});

map.addEventListener('touchmove',function(e){ if(e.touches.length===2){ e.preventDefault(); var a=e.touches[0],b=e.touches[1]; var d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
 if(_pd){ var f=d/_pd; var nk=Math.max(0.5,Math.min(4,T.k*f)); T.x=T.x*(nk/T.k);T.y=T.y*(nk/T.k);T.k=nk; applyT(); } _pd=d; _moved=true; } },{passive:false});
