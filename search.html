<!doctype html>
<html lang="ru" style="background:#FBFAF7">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBFAF7"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Поиск · Матчасть</title>
<style>
:root{
 --bg:#FBFAF7; --ink:#17150F; --ink2:#56504A; --meta:#6E675E; --line:#ECE7DD; --card:#fff;
 --gold:#97591A; --gold-br:#C98A3A;
 --solid:#2F7D4F; --mixed:#B8801F; --contested:#C2452F;
 --r:16px; --rs:13px; --pill:999px;
 --sh:0 2px 12px rgba(20,17,12,.05),0 1px 2px rgba(20,17,12,.04);
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;padding:0 18px calc(84px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink2);border-radius:var(--pill);cursor:pointer;flex:none}.ib:active{background:var(--line)}
.field{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--pill);padding:0 14px;box-shadow:var(--sh)}
.field svg{color:var(--meta);flex:none}
.field input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--ink);padding:10px 0}
.field .clr{color:var(--meta);background:none;border:0;cursor:pointer;font-size:18px;padding:4px;display:none}
.field .clr.on{display:block}
.grp{margin-top:22px}
.grp .gl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;padding-left:2px}
.res{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:13px 15px;margin-bottom:9px;box-shadow:var(--sh)}
.res:active{opacity:.6}
.res .rt{display:flex;align-items:center;gap:8px}
.res .nm{font-size:16px;font-weight:700;flex:1;line-height:21px}
.res .dot{width:9px;height:9px;border-radius:50%;flex:none}
.res .dot.solid{background:var(--solid)}.res .dot.mixed{background:var(--mixed)}.res .dot.contested{background:var(--contested)}
.res .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--gold);background:rgba(176,106,31,.09);padding:2px 8px;border-radius:var(--pill);flex:none}
.res .sn{font-size:14px;line-height:20px;color:var(--ink2);margin-top:5px}
.res .ds{font-size:12px;color:var(--contested);margin-top:6px;font-weight:600}
.empty{padding:34px 6px}
.empty .l{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--meta);margin:18px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--pill);padding:8px 14px;cursor:pointer;text-decoration:none}
.chip:active{opacity:.6}
.nf{padding:30px 4px;text-align:center}
.nf .em{margin-bottom:8px;color:var(--meta)}
.nf .t{font-size:17px;font-weight:700}
.nf .s{font-size:14px;color:var(--ink2);margin-top:6px;line-height:21px}
.nf .acts{display:flex;flex-direction:column;gap:9px;margin-top:18px;max-width:320px;margin-left:auto;margin-right:auto}
.nf .acts button,.nf .acts a{display:block;width:100%;text-decoration:none;text-align:center;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:15px;font-weight:600;padding:12px;border-radius:var(--rs);cursor:pointer}
.nf .acts .pri{background:var(--gold);color:#fff;border-color:var(--gold)}
.nf .acts a:active,.nf .acts button:active{opacity:.6}
.hint{font-size:13px;color:var(--meta);text-align:center;padding:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:36px;z-index:50;background:#17150F;color:#F4EEE2;font-size:14px;font-weight:600;padding:10px 16px;border-radius:var(--pill);box-shadow:0 8px 28px rgba(0,0,0,.25);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/*TAP-FEEDBACK*/button:active,a:active{opacity:.6;transition:opacity .06s}

/*MCUX v1 — единый UX: нативные переходы между страницами, ховеры, тап-фидбек, reduced-motion*/
@view-transition{navigation:auto}
.nav{view-transition-name:mcnav}
button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.pill:active{opacity:.6;transition:opacity .06s}
@media(hover:hover){a:hover,button:hover,.ni:hover,.mrow:hover,.row:hover,.res:hover,.tbtn:hover,.fc:hover,.opt:hover,[data-k]:hover,[data-slug]:hover,[data-cont]:hover,[data-route]:hover,[data-q]:hover{opacity:.85;transition:opacity .12s ease;cursor:pointer}}
@media(hover:none){button:active,a:active,[onclick]:active,.ni:active,.mrow:active,.row:active,.res:active,.tbtn:active,.fc:active,.opt:active,.lp:active,.rc:active,.cont:active,.hero:active,.scd:active,.tl:active,.fd:active,.lk:active,.deeper:active,[data-k]:active,[data-slug]:active,[data-cont]:active,[data-route]:active,[data-q]:active{opacity:.72;transform:scale(.97);transition:transform .06s ease,opacity .06s}}
a:focus-visible,button:focus-visible,[onclick]:focus-visible,.ni:focus-visible,.mrow:focus-visible,.row:focus-visible,.res:focus-visible,.tbtn:focus-visible,.fc:focus-visible,.opt:focus-visible,.lp:focus-visible,.rc:focus-visible,[data-k]:focus-visible,[data-slug]:focus-visible,[data-cont]:focus-visible,[data-route]:focus-visible{outline:2px solid var(--gold,#97591A);outline-offset:2px;border-radius:6px}
.mcstate{padding:46px 20px;text-align:center;color:var(--meta,#6E675E)}
.mcstate .ic{font-size:30px;line-height:1;margin-bottom:12px;opacity:.75}
.mcstate .msg{font-size:14.5px;line-height:20px;max-width:300px;margin:0 auto}
.mcstate .retry{margin-top:16px;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--gold,#97591A);background:none;border:1px solid var(--line,#ECE7DD);border-radius:999px;padding:9px 18px;cursor:pointer}
.mcsk{background:linear-gradient(90deg,#EFEBE2,#F6F3ED,#EFEBE2);background-size:200% 100%;animation:mcsh 1.2s infinite;border-radius:12px}
@keyframes mcsh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/*MCDESK v1 — десктоп (>=960px): нижний таб-бар -> левый сайдбар, контент смещается вправо; мобилка не трогается*/
@media(min-width:960px){
 body:has(nav.nav){padding-left:236px}
 nav.nav{top:0;bottom:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:0}
 nav.nav .navin{flex-direction:column;align-items:stretch;height:100vh;max-width:none;margin:0;padding:22px 14px;gap:3px}
 nav.nav .ni{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;min-height:0;height:auto;padding:12px 14px;border-radius:12px}
 nav.nav .ni svg{width:22px;height:22px}
 nav.nav .ni .lb{font-size:15px;font-weight:600}
 nav.nav .ni.on{background:rgba(176,106,31,.09)}
 @media(hover:hover){nav.nav .ni:hover{background:rgba(176,106,31,.06);opacity:1}}
 body:has(nav.nav) .topbar{left:236px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
/*MCNAV — единый навбар для детальных страниц*/
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(251,250,247,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:720px;margin:0 auto;display:flex}
.ni{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--meta);cursor:pointer}
.ni svg{width:24px;height:24px}.ni .lb{font-size:11px;font-weight:600}.ni.on{color:var(--gold)}
</style>
<style>
/*mc:desktop v2 — десктопный слой (>=960px): левый рельс, ритм страницы, предметные ховеры.
  Мобилка (<960px) не трогается. Заменяет прежний mc:desktop, который конфликтовал с MCDESK v1
  (рельс 92px против 236px) и на всех страницах зажимал .wrap до 760px — из-за чего, например,
  двухколоночная карточка концепта схлопывалась в 350px колонку чтения.*/
@media(min-width:960px){
 /* ── левый рельс: пункты сверху, а не по центру пустого экрана ── */
 nav.nav .navin{justify-content:flex-start;padding:18px 12px 24px;gap:2px;overflow-y:auto}
 nav.nav .navin::before{content:"Матчасть";display:block;flex:none;margin-bottom:8px;padding:4px 14px 15px;border-bottom:1px solid var(--line);font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
 nav.nav .ni{align-items:center;padding:11px 14px;border-radius:11px}
 nav.nav .ni .lb{font-size:14.5px;letter-spacing:-.005em}
 nav.nav .ni.on .lb{font-weight:700}
 /* ── колонка контента: заголовок не липнет к верхней кромке окна ── */
 .wrap{max-width:min(var(--dsk-wrap,760px),calc(100% - 48px));padding-top:36px}
 /* фиксированные слои начинаются за рельсом, а не под ним */
 body:has(nav.nav) .cta,body:has(nav.nav) .topbar,body:has(nav.nav) .start,body:has(nav.nav) .sheet{left:236px}
}
@media(min-width:960px) and (hover:hover){
 /* было: любая ссылка и кнопка выцветали до .85 — вместо этого предметные состояния */
 a:hover,button:hover,.ni:hover,.mrow:hover,.row:hover,.res:hover,.tbtn:hover,.fc:hover,.opt:hover,[data-k]:hover,[data-slug]:hover,[data-cont]:hover,[data-route]:hover,[data-q]:hover{opacity:1}
 nav.nav .ni{transition:background .15s,color .15s}
 nav.nav .ni:hover{background:rgba(176,106,31,.07);color:var(--gold)}
 .rc,.chrow.live,.scd,.sit,.cont,.fc,.tile{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
 .rc:hover,.chrow.live:hover,.scd:hover,.sit:hover,.cont:hover,.fc:hover,.tile:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(20,17,12,.11);border-color:var(--gold-br)}
 .hcta a:hover,.pnext button:hover,.start button:hover,.hacts .pri:hover,.fin .btns button.pri:hover,.cta button:hover{filter:brightness(1.08)}
}
@media(prefers-reduced-motion:reduce){nav.nav .ni,.rc,.chrow.live,.scd,.sit,.cont,.fc,.tile{transition:none}}
</style>
</head>
<body>
<script>/*mc:hashroute*/(function(){try{var m=(location.hash||"").match(/^#\/c\/([^?&#]+)/);if(m&&m[1]){location.replace("card.html?slug="+encodeURIComponent(decodeURIComponent(m[1])));}}catch(e){}})();</script>
<div class="wrap">
  <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Поиск</h1>
  <div class="bar">
    <button class="ib" id="back" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" aria-label="Поиск" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Концепт, ситуация, термин…" enterkeyhint="search">
      <button class="clr" id="clr" aria-label="Очистить">✕</button>
    </div>
  </div>
  <div id="out"></div>
</div>
<div class="toast" id="toast"></div>
<script>
// несущие концепты для пустого состояния (известные публичные slug)
var CORE=[
 {slug:"cognitive-load-theory",t:"Когнитивная нагрузка"},
 {slug:"anchoring",t:"Якорение"},
 {slug:"loss-aversion",t:"Неприятие потерь"},
 {slug:"decoy-effect",t:"Эффект приманки"},
 {slug:"miller-law",t:"Закон Миллера"},
 {slug:"waiting-psychology",t:"Психология ожидания"}
];
var ROBT={solid:"Проверено",mixed:"Есть нюансы",contested:"Спорно",inbox:"В проработке"};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},1800);}
// Слой-1 телеметрия (fire-and-forget; аноним тоже)
function track(k,p){ try{ if(window.__SB) window.__SB.rpc('reader_event',{p_kind:k,p_payload:p||{}}); }catch(e){} }
function isSituation(slug){ return /^scenario-/.test(slug||''); }
function hrefFor(slug){ return (isSituation(slug)?'situations.html?slug=':'card.html?slug=')+encodeURIComponent(slug); }
// недавние запросы
function recGet(){ try{ return JSON.parse(localStorage.getItem('mc:searches')||'[]')||[]; }catch(e){ return []; } }
function recAdd(q){ q=(q||'').trim(); if(q.length<2) return; var l=recGet().filter(function(x){return x.toLowerCase()!==q.toLowerCase();}); l.unshift(q); l=l.slice(0,6); try{ localStorage.setItem('mc:searches',JSON.stringify(l)); }catch(e){} }

var out=document.getElementById('out'), inp=document.getElementById('q'), clr=document.getElementById('clr');

function renderEmpty(){
 var rec=recGet();
 var H='<div class="empty">';
 if(rec.length){ H+='<div class="l">Недавнее</div><div class="chips">'+rec.map(function(q){ return '<span class="chip" data-q="'+esc(q)+'">'+esc(q)+'</span>'; }).join('')+'</div>'; }
 H+='<div class="l">Несущие концепты</div><div class="chips">'+CORE.map(function(c){ return '<a class="chip" href="'+hrefFor(c.slug)+'">'+esc(c.t)+'</a>'; }).join('')+'</div>';
 H+='<div class="hint">Имя, явление или разговорный синоним. Поиск — на случай, когда не нашлось взглядом.</div>';
 H+='</div>';
 out.innerHTML=H;
 Array.prototype.forEach.call(out.querySelectorAll('[data-q]'),function(el){ el.onclick=function(){ inp.value=el.getAttribute('data-q'); clr.classList.add('on'); doSearch(inp.value); }; });
}

// подсветку ts_headline (<b>…</b>) не экранируем в текст: эскейпим сниппет, затем возвращаем только пары <b> (cold-audit)
function snHl(s){return esc(String(s||'')).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');}
function resHtml(r){
 var rob=r.robustness&&ROBT[r.robustness]?('<span class="dot '+r.robustness+'" title="'+esc(ROBT[r.robustness])+'"></span>'):'';
 var sn=r.snippet?('<div class="sn">'+snHl(r.snippet)+'</div>'):'';
 var ds=r.dissent_slug?('<div class="ds">↔ есть спор: '+esc((r.dissent_slug||'').replace(/-/g,' '))+'</div>'):'';
 return '<a class="res" href="'+hrefFor(r.slug)+'"><div class="rt"><span class="nm">'+esc(r.title||r.slug)+'</span>'+rob+'</div>'+sn+ds+'</a>';
}
function renderResults(rows, q){
 var con=rows.filter(function(r){return !isSituation(r.slug);});
 var sit=rows.filter(function(r){return isSituation(r.slug);});
 var H='';
 if(con.length) H+='<div class="grp"><h2 class="gl">Концепты · '+con.length+'</h2>'+con.map(resHtml).join('')+'</div>';
 if(sit.length) H+='<div class="grp"><h2 class="gl">Ситуации · '+sit.length+'</h2>'+sit.map(resHtml).join('')+'</div>';
 out.innerHTML=H;
 recAdd(q);
}
function renderNotFound(q, near){
 track('search_zero',{q:(q||'').slice(0,60), near:(near&&near.length)||0});
 var H='<div class="nf"><div class="em"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div><div class="t">По «'+esc(q)+'» точного нет</div>';
 if(near&&near.length){ H+='<div class="s">Возможно, вы про это:</div></div>'; out.innerHTML=H;
   out.querySelector('.nf').insertAdjacentHTML('beforeend','<div style="margin-top:14px">'+near.map(resHtml).join('')+'</div>');
 } else { H+='<div class="s">Ничего близкого не нашлось.</div></div>'; out.innerHTML=H; }
 var acts='<div class="acts"><button class="pri" id="reqC">Запросить этот концепт →</button>'+
   '<a href="explore.html">Не знаю точно — открыть карту</a>'+
   '<button id="rnd">Случайный концепт</button></div>';
 out.querySelector('.nf').insertAdjacentHTML('beforeend',acts);
 document.getElementById('reqC').onclick=function(){ try{ var l=JSON.parse(localStorage.getItem('mc:requests')||'[]'); l.unshift({q:q,ts:Date.now()}); localStorage.setItem('mc:requests',JSON.stringify(l.slice(0,30))); }catch(e){} toast('Записали запрос — рассмотрим'); };
 document.getElementById('rnd').onclick=function(){ var c=CORE[Math.floor(recGet().length+inp.value.length)%CORE.length]; location.href=hrefFor(c.slug); };
}

var seq=0;
function doSearch(q){
 q=(q||'').trim();
 if(q.length<2){ renderEmpty(); return; }
 if(!window.__SB){ out.innerHTML='<div class="mcstate"><div class="ic">⏳</div><div class="msg">Поиск подключается…</div><button class="retry" onclick="doSearch(inp.value)">↻ Повторить</button></div>'; return; }
 var my=++seq;
 // Живой поиск: kb_search_epistemic_v2 — эпистемный слой поверх ГИБРИДА (RRF fulltext+voyage-вектор, 60dadc49): golden MRR 0.77, вектор без лексики честно weak.
 // Контракт рендера сверен с формой RPC: slug/title/robustness/snippet/dissent_slug — все поля есть в выдаче (resHtml их и читает).
 // NB: ранжирование чинится на стороне RPC (домен research, задача 655e241a): у части рядов rank завязан в tie/fallback 0.206695 — порядок топа не идеален. Фронт этого НЕ трогает.
 window.__SB.rpc('kb_search_epistemic_v2',{p_query:q}).then(function(r){
  if(my!==seq) return; // устаревший ответ
  var rows=(r&&!r.error&&r.data)||[];
  // порог релевантности (go-live D5): мусор ≈0.30–0.42 (вектор без лексики, закон честности) НЕ ответ.
  // rank≥0.45 = уверенный (лексика/алиас ≥0.74); слабые ряды идут в «возможно, вы про это», не как ответ.
  var strong=rows.filter(function(x){ return x.rank==null || x.rank>=0.45; });
  if(strong.length){ renderResults(strong, q); return; }
  // ничего уверенного → ближайшие через kb_search (шире); фолбэк — слабые эпистемные ряды как подсказки; затем notfound
  window.__SB.rpc('kb_search',{p_query:q}).then(function(r2){
   if(my!==seq) return;
   var near=((r2&&!r2.error&&r2.data)||[]).slice(0,4).map(function(x){ return {slug:x.slug,title:x.title,robustness:x.robustness}; });
   if(!near.length) near=rows.slice(0,4).map(function(x){ return {slug:x.slug,title:x.title,robustness:x.robustness}; });
   recAdd(q); renderNotFound(q, near);
  }).catch(function(){ if(my===seq){ recAdd(q); renderNotFound(q, rows.slice(0,4).map(function(x){return {slug:x.slug,title:x.title,robustness:x.robustness};})); } });
 }).catch(function(){ if(my===seq) out.innerHTML='<div class="mcstate"><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4L2.8 19.5h18.4z"/><path d="M12 10v4M12 17h.01"/></svg></div><div class="msg">Поиск временно недоступен.</div><button class="retry" onclick="doSearch(inp.value)">↻ Повторить</button></div>'; });
}

// debounce ввода
var t=null;
inp.addEventListener('input',function(){ clr.classList.toggle('on', !!inp.value); clearTimeout(t); var v=inp.value; t=setTimeout(function(){ doSearch(v); },200); });
inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ clearTimeout(t); doSearch(inp.value); inp.blur(); } });
clr.onclick=function(){ inp.value=''; clr.classList.remove('on'); inp.focus(); renderEmpty(); };
