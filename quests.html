<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квесты — Расти</title>
<style>
:root{--bg:#FBFAF7;--ink:#17150F;--ink2:#56504A;--meta:#8B847B;--line:#ECE7DD;--gold:#B06A1F;--gold-br:#C98A3A;--solid:#2F7D4F;--mixed:#B8801F;--tw:#C2546A;--pill:999px;--r:20px;--rs:14px;--sh:0 2px 12px rgba(20,17,12,.05)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:24px}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;padding:0 20px calc(80px + env(safe-area-inset-bottom))}
.feat{margin-top:18px;border-radius:var(--r);padding:24px;background:linear-gradient(150deg,#241E18,#15110C);color:#F4EEE2;cursor:pointer}
.feat .fk{font-size:12px;font-weight:700;color:var(--gold-br);text-transform:uppercase}
.feat .ti{font-size:24px;font-weight:800;margin:4px 0 8px}
.feat .pr{font-size:15px;color:#D8D0C3}
.rc{display:flex;gap:15px;background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:16px;margin-top:11px;cursor:pointer}
.rc .t{font-size:16px;font-weight:700}
.rc .p{font-size:13px;color:var(--ink2);margin-top:2px}
.seclbl{font-size:14px;color:var(--meta);font-weight:700;margin:26px 0 8px;text-transform:uppercase}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(251,250,247,.94);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:720px;margin:0 auto;display:flex}
.ni{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--meta);cursor:pointer}
.ni.on{color:var(--gold)}
.cold{position:fixed;inset:0;background:#15110C;color:#F4EEE2;display:flex;flex-direction:column;justify-content:center;padding:32px 26px}
.cold .cq{font-size:30px;font-weight:800;margin:14px 0}
.stopcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:8px}
.stopcard h2{font-size:23px;font-weight:800;margin:0 0 10px}
.start{position:fixed;left:0;right:0;bottom:0;padding:18px 20px calc(18px + env(safe-area-inset-bottom))}
.start button{width:100%;height:54px;border-radius:var(--rs);border:0;background:var(--gold);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.fin{text-align:center;padding:40px 0}
.fin h2{font-size:26px;font-weight:800}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<div id="overlay"></div>
<nav class="nav" id="nav"><div class="navin">
<button class="ni" onclick="location.href='explore.html'"><span class="lb">Исследовать</span></button>
<button class="ni" onclick="location.href='solve-home.html'"><span class="lb">Решить</span></button>
<button class="ni on"><span class="lb">Расти</span></button>
<button class="ni"><span class="lb">Меню</span></button>
</div></nav>
<script>
var QUESTS=[
 {key:"m1-osnovy",icon:"🧭",rec:true,title:"Основы продуктового мышления",promise:"Из чего складывается продуктовое мышление — от мотивации человека до метрики продукта",desc:"Как JTBD объясняет зачем, MVP — насколько дорого ошибиться, а build trap поджидает тех, кто забыл об обоих.",n:7,slugs:["jtbd","jtbd-christensen","mvp","build-trap","product-market-fit","north-star-metric","engagement"]},
 {key:"m2-cena",icon:"⚖️",rec:false,title:"Цена и ценность",promise:"Цена — конструкция в голове, а не число на экране",desc:"Как опорная точка, привязка и боль платежа управляют воспринимаемой стоимостью.",n:8,slugs:["reference-point","anchoring","prospect-theory","loss-aversion","loss-aversion-critique","mental-accounting","payment-pain","decoy-effect"]},
 {key:"m3-vnimanie",icon:"🧠",rec:false,title:"Внимание и состояние",promise:"Внимание — не ресурс",desc:"Почему продукт ломается в реальном контексте.",n:8,slugs:["cognitive-load-theory","miller-law","system-1-2","attention-residue","scarcity-mindset","scarcity-critique","present-bias","flow"]},
 {key:"m4-privychka",icon:"🔄",rec:false,title:"Привычка и удержание",promise:"Что превращает разовое действие в рутину",desc:"Петля повторного использования.",n:8,slugs:["habit-loop","fogg-behavior-model","operant-conditioning"]},
 {key:"m5-socialnoe",icon:"🪞",rec:false,title:"Социальное и идентичность",promise:"Решение редко принимается в одиночестве",desc:"Социальное давление.",n:7,slugs:["social-proof","bandwagon-effect","social-identity"]},
 {key:"m6-doverie",icon:"🔗",rec:false,title:"Доверие и сбои",promise:"Доверие строится годами",desc:"Психологический контракт.",n:8,slugs:["source-credibility","trust-calibration","peak-end-rule"]},
 {key:"m7-temnye",icon:"🔦",rec:false,title:"Тёмные паттерны",promise:"Как их видеть до того, как они ударят",desc:"Цена тёмных паттернов.",n:7,slugs:["sludge","partition-pricing","fomo"]},
 {key:"m8-metriki",icon:"📊",rec:false,title:"Метрики честно",promise:"Когда метрика становится целью",desc:"Закон Гудхарта.",n:7,slugs:["north-star-metric","aarrr-funnel","goodharts-law"]}
];
var TITLES={jtbd:"JTBD — Jobs To Be Done",mvp:"MVP",engagement:"Вовлечённость",anchoring:"Якорение","loss-aversion":"Неприятие потерь","cognitive-load-theory":"Теория когнитивной нагрузки"};
var SEEDCARD={jtbd:{lead:"Люди «нанимают» продукт, чтобы продвинуться в своей жизненной ситуации.",apply:"Спрашивай не «что добавить», а «какую работу пользователь пытается сделать»."}};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function mins(n){return '~'+Math.max(5,Math.round(n*3))+' мин';}
function titleOf(s){return TITLES[s]||s.replace(/-/g,' ');}
function isTwist(s){return /critique|critic|contra/i.test(s);}
var qs=new URLSearchParams(location.search);
var QKEY=qs.get('quest'),STOP=qs.get('stop')?parseInt(qs.get('stop'),10):null;
function quest(k){return QUESTS.filter(function(q){return q.key===k;})[0];}
function renderHub(){document.getElementById('nav').style.display='';var feat=QUESTS.filter(function(q){return q.rec;})[0]||QUESTS[0];var rest=QUESTS.filter(function(q){return q.key!==feat.key;});var H='<div class="bar"><div class="bt">Квесты</div></div><div class="head"><div class="kick">Учись через истории</div><div class="h1">Расти</div><div class="sub">Ведомые маршруты по идеям.</div></div><div class="feat" data-q="'+feat.key+'"><div class="fk">Начни отсюда</div><div class="ti">'+esc(feat.title)+'</div><div class="pr">'+esc(feat.promise)+'</div></div><div class="seclbl">Все маршруты</div>';H+=rest.map(function(q){return '<div class="rc" data-q="'+q.key+'"><div class="t">'+esc(q.title)+'</div><div class="p">'+esc(q.promise)+'</div><div class="meta">'+q.n+' остановок · '+mins(q.n)+'</div></div>';}).join('');document.getElementById('wrap').innerHTML=H;bindQ();}
function renderDetail(q){document.getElementById('nav').style.display='';var H='<div class="coldq">'+esc(q.promise)+'</div><div class="ddesc">'+esc(q.desc)+'</div>';document.getElementById('wrap').innerHTML=H;document.getElementById('overlay').innerHTML='<div class="start"><button id="startBtn">Начать квест →</button></div>';document.getElementById('startBtn').onclick=function(){location.href='quests.html?quest='+q.key+'&stop=0';};bindQ();}
function renderPlayer(q,stop){document.getElementById('nav').style.display='none';document.getElementById('overlay').innerHTML='';var M=q.slugs.length;if(stop===0){document.getElementById('wrap').innerHTML='';document.getElementById('overlay').innerHTML='<div class="cold"><div class="cq">'+esc(q.promise)+'</div><button id="go">Начать →</button></div>';document.getElementById('go').onclick=function(){location.href='quests.html?quest='+q.key+'&stop=1';};return;}if(stop>M){document.getElementById('wrap').innerHTML='<div class="fin"><h2>Квест пройден</h2><p>'+esc(q.title)+'</p></div>';return;}var slug=q.slugs[stop-1];var H='<div class="pc">Остановка '+stop+' из '+M+'</div><div id="stopwrap"></div>';document.getElementById('wrap').innerHTML=H;var sc=SEEDCARD[slug];function paintCard(title,lead,apply){document.getElementById('stopwrap').innerHTML='<div class="stopcard"><h2>'+esc(title)+'</h2><div class="lead">'+esc(lead)+'</div></div><button onclick="location.href=\'quests.html?quest='+q.key+'&stop='+(stop+1)+'\'">Дальше →</button>';}paintCard(titleOf(slug),sc?sc.lead:'',sc?sc.apply:'');if(!sc&&window.__livecard)window.__livecard(slug,paintCard);}
function bindQ(){Array.prototype.forEach.call(document.querySelectorAll('[data-q]'),function(el){el.onclick=function(){location.href='quests.html?quest='+el.getAttribute('data-q');};});}
if(QKEY&&quest(QKEY)){if(STOP!==null)renderPlayer(quest(QKEY),STOP);else renderDetail(quest(QKEY));}else renderHub();
function wireLive(SB,member){window.__MEMBER=!!member;window.__SB=SB;window.__livecard=function(slug,paint){SB.rpc(member?'kb_node_bundle':'kb_public_bundle',{p_slug:slug}).then(function(r){if(r&&!r.error&&r.data){var b=r.data,bs=b.body||b.body_struct||{};paint(b.title||titleOf(slug),bs['суть']||'',bs['применение']||'');}}).catch(function(){});};SB.from('quests').select('key,ord,title,icon,promise,description,slugs,recommended,status').eq('status','active').order('ord').then(function(r){if(r&&!r.error&&r.data&&r.data.length){QUESTS=r.data.map(function(q){return{key:q.key,icon:q.icon||'✦',rec:!!q.recommended,title:q.title,promise:q.promise||'',desc:q.description||'',n:(q.slugs||[]).length,slugs:q.slugs||[]};});if(QKEY&&quest(QKEY)){if(STOP!==null)renderPlayer(quest(QKEY),STOP);else renderDetail(quest(QKEY));}else renderHub();}}).catch(function(){});}
(function boot(){function go(){try{if(!(window.SUPABASE_URL&&window.SUPABASE_ANON_KEY&&window.supabase&&window.supabase.createClient))return;var SB=window.supabase.createClient(String(window.SUPABASE_URL).trim(),String(window.SUPABASE_ANON_KEY).trim());window.__SB=SB;McAuth.boot(SB,function(acc){wireLive(SB,acc.member);});}catch(_){}}function load(src,cb){var s=document.createElement('script');s.src=src;s.onload=cb;s.onerror=cb;document.head.appendChild(s);}function loadCfg(done){var ps=['../config.js','./config.js','config.js','/book-reader/config.js'];var i=0;(function nx(){if(window.SUPABASE_URL||i>=ps.length)return done();var sc=document.createElement('script');sc.src=ps[i++];sc.onload=function(){setTimeout(function(){window.SUPABASE_URL?done():nx();},0);};sc.onerror=nx;document.head.appendChild(sc);})();}loadCfg(function(){load('vendor/supabase.min.js',function(){load('mc-auth.js',go);});});})();
</script>
</body>
</html>
