<!doctype html>
<html lang="ru" style="background:#FBFAF7">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путь · Матчасть</title>
<script>
/* ЛЕГАСИ-РЕДИРЕКТ (path-build-contract §C): «Истории» стали Путём.
   quests.html?quest=X&stop=N → path.html (path сам конвертит индекс N в stop_id).
   Слово quest живёт ТОЛЬКО здесь как redirect-вход — старые ссылки не умирают. */
(function(){ try{
 var q=new URLSearchParams(location.search); var ch=q.get('quest'); var st=q.get('stop');
 location.replace(ch?('path.html?quest='+encodeURIComponent(ch)+(st!=null?('&stop='+encodeURIComponent(st)):'')):'path.html');
}catch(e){ location.replace('path.html'); } })();
</script>
</head>
<body></body>
</html>
