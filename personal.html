<!doctype html>
<html lang="ru" style="background:#FBFAF7">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme:light)"><meta name="theme-color" content="#100D0A" media="(prefers-color-scheme:dark)"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Моё · Управляя поведением</title>
<style>
:root{
 --bg:#FBFAF7; --ink:#17150F; --ink2:#56504A; --meta:#6E675E; --line:#ECE7DD; --card:#fff;
 --gold:#97591A; --gold-br:#C98A3A;
 --be:#C98A3A; --cog:#CDA92F; --ux:#C2546A; --soc:#6B5CA5; --org:#2F8E8E; --mot:#B0452F; --prod:#3E8E8E; --neu:#8A5CC2; --def:#9A9080;
 --pill:999px; --r:18px; --rs:14px;
 --sh:0 2px 12px rgba(20,17,12,.05),0 1px 2px rgba(20,17,12,.04);--navbg:rgba(251,250,247,.94)}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;padding:0 20px calc(80px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;background:var(--navbg);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink2);border-radius:var(--pill);cursor:pointer}.ib:active{background:var(--line)}
.bt{font-size:15px;font-weight:700}
/* профиль */
.prof{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
/* «Продолжить» — перенос с Матчасти (v5 п.2 / c4ff6366): последнее открытое */
.resume{display:flex;align-items:center;gap:13px;margin-top:16px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh)}
.resume .rsm-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.resume .rsm-b{flex:1;min-width:0;display:block}
.resume .rsm-l{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--meta)}
.resume .rsm-s{display:block;font-size:15.5px;font-weight:700;color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume .rsm-cv{flex:none;color:var(--meta)}
.resume.rsm-start{border-color:var(--gold-br);background:linear-gradient(180deg,#fff,#FBF4E8)}
.resume.rsm-start .rsm-s{white-space:normal;font-weight:600;font-size:14.5px;line-height:20px}
.prow{display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(150deg,#C98A3A,#8A5520);color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.pinfo{flex:1;min-width:0}
.pinfo .nm{font-size:18px;font-weight:700}
.pinfo .em{font-size:14px;color:var(--meta);word-break:break-word}
.psignout{flex:none;align-self:center;background:none;border:1px solid var(--line);color:var(--meta);font-size:13px;font-weight:600;border-radius:var(--pill);padding:7px 15px;cursor:pointer}
.psignout:active{opacity:.6}
@media(hover:hover){.psignout:hover{border-color:var(--gold-br);color:var(--gold)}}
.terr{margin-top:18px}
.terrh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
.terrh .l{font-size:14px;font-weight:600;color:var(--ink2)}
.terrh .v{font-size:14px;font-weight:700;color:var(--gold)}
.pbar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#C98A3A,#E7C07A)}
.terrm{margin-top:8px;font-size:13px;color:var(--meta)}
.discs{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:10px;font-size:13px}
.drow .nm{flex:1;color:var(--ink2)}
.drow .mini{width:90px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.drow .mini i{display:block;height:100%}
.drow .ct{color:var(--meta);width:54px;text-align:right}
.guest{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);text-align:center}
.guest p{color:var(--ink2);margin:0 0 14px}
.btn{height:48px;border-radius:var(--rs);border:0;font-size:15px;font-weight:700;cursor:pointer;padding:0 22px}
.btn.pri{background:var(--gold);color:#fff}
.menu{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.mrow{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}.mrow:active{background:var(--bg)}
.mrow .ic{width:22px;height:22px;color:var(--gold);flex:none}
.mrow .t{flex:1;font-size:16px;font-weight:600}
.mrow .badge{font-size:12px;font-weight:600;color:var(--meta);background:var(--bg);border:1px solid var(--line);border-radius:var(--pill);padding:3px 9px}
.mrow .reldot{width:9px;height:9px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 3px rgba(229,72,77,.16);flex:none}
.mrow .cv{color:var(--meta);flex:none}
.seclbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--meta);margin:24px 0 8px;padding-left:4px}
.sign{margin-top:20px;text-align:center}
.sign button{background:none;border:0;color:var(--gold);font-size:15px;font-weight:600;cursor:pointer}
/* подэкраны */
.head{padding:16px 0 4px}.h1{font-size:28px;line-height:33px;font-weight:800;letter-spacing:-.02em;margin:3px 0 8px}
.prose{font-size:16px;line-height:25px;color:var(--ink2)}
.prose p{margin:0 0 14px}.prose strong{color:var(--ink)}
.empty{padding:60px 24px;text-align:center;color:var(--meta)}
.empty .em{font-size:36px;margin-bottom:10px}
.statusbox{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.statusbox .l{font-size:13px;font-weight:700;color:var(--meta);text-transform:uppercase;letter-spacing:.03em}
.statusbox .v{font-size:16px;font-weight:700;margin-top:4px}
.statusbox .v .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--meta);margin-right:7px}
.mcpdemo{margin:18px 0;background:linear-gradient(160deg,#241E18,#15110C);border-radius:var(--r);padding:18px;color:#EFE6D7}
.mcpdemo .dl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gold-br)}
.mcpdemo .dq{font-size:15px;font-weight:700;margin:10px 0 8px;color:#fff}
.mcpdemo .da{font-size:14px;line-height:21px;color:#D9CFBE}
.mcpdemo .rb{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px}.mcpdemo .rb.solid{color:#9BD8B4;background:#16271d}
.mcpdemo .src{display:block;font-size:12px;color:#B3A893;margin-top:6px}
.tokbox,.cfgbox{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:14px}
.tokbox .l,.cfgbox .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--meta);margin-bottom:8px}
.tokbox code{display:block;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--ink);word-break:break-all;background:var(--bg);border-radius:8px;padding:9px 11px}
.cfgbox pre{margin:0;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:18px;color:var(--ink);background:var(--bg);border-radius:8px;padding:11px;overflow-x:auto;white-space:pre}
.mcpbtn{margin-top:10px;height:42px;border-radius:var(--rs);border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:0 16px}
.mcpbtn.pri{background:var(--gold);color:#fff;border-color:var(--gold);width:100%}
.mcpbtn.rot{color:var(--gold);border-color:var(--gold);margin-top:14px}
.mcpguest{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--ink2)}
.mcpguest a{color:var(--gold);font-weight:700;text-decoration:none}
/* пер-клиентские карточки подключения MCP (6ac1f4c6) */
.mcpcli{display:flex;flex-direction:column;gap:10px}
.mcpc{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:14px 15px}
.mcpc .ch{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink)}
.mcpc .cst{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--meta);border:1px solid var(--line)}
.mcpc .cst.ok{color:#2C7549;border-color:rgba(47,125,79,.35);background:rgba(47,125,79,.08)}
.mcpc .cb{font-size:13.5px;line-height:20px;color:var(--ink2);margin-top:7px}
.fw{font-size:13px;color:var(--meta);margin-top:18px;line-height:19px}
.cstat
