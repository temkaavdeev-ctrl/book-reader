<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Меню — Матчасть</title>
<style>
:root{
 --bg:#FBFAF7; --ink:#17150F; --ink2:#56504A; --meta:#8B847B; --line:#ECE7DD; --card:#fff;
 --gold:#B06A1F; --gold-br:#C98A3A;
 --be:#C98A3A; --cog:#CDA92F; --ux:#C2546A; --soc:#6B5CA5; --org:#2F8E8E; --mot:#B0452F; --prod:#3E8E8E; --neu:#8A5CC2;
 --pill:999px; --r:18px; --rs:14px;
 --sh:0 2px 12px rgba(20,17,12,.05),0 1px 2px rgba(20,17,12,.04);
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;padding:0 20px calc(80px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink2);border-radius:var(--pill);cursor:pointer}.ib:active{background:var(--line)}
.bt{font-size:15px;font-weight:700}
/* профиль */
.prof{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.prow{display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(150deg,#C98A3A,#8A5520);color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.pinfo .nm{font-size:18px;font-weight:700}
.pinfo .em{font-size:14px;color:var(--meta)}
.terr{margin-top:18px}
.terrh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
.terrh .l{font-size:14px;font-weight:600;color:var(--ink2)}
.terrh .v{font-size:14px;font-weight:700;color:var(--gold)}
.pbar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#C98A3A,#E7C07A)}
.terrm{margin-top:8px;font-size:13px;color:var(--meta)}
.discs{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:10px;font-size:13px}
.drow .nm{flex:1;color:var(--ink2)}
.drow .mini{width:90px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.drow .mini i{display:block;height:100%}
.drow .ct{color:var(--meta);width:54px;text-align:right}
.guest{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);text-align:center}
.guest p{color:var(--ink2);margin:0 0 14px}
.btn{height:48px;border-radius:var(--rs);border:0;font-size:15px;font-weight:700;cursor:pointer;padding:0 22px}
.btn.pri{background:var(--gold);color:#fff}
.menu{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.mrow{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}.mrow:active{background:var(--bg)}
.mrow .ic{width:22px;height:22px;color:var(--gold);flex:none}
.mrow .t{flex:1;font-size:16px;font-weight:600}
.mrow .badge{font-size:12px;font-weight:600;color:var(--meta);background:var(--bg);border:1px solid var(--line);border-radius:var(--pill);padding:3px 9px}
.mrow .cv{color:var(--meta);flex:none}
.seclbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--meta);margin:24px 0 8px;padding-left:4px}
.sign{margin-top:20px;text-align:center}
.sign button{background:none;border:0;color:#C2452F;font-size:15px;font-weight:600;cursor:pointer}
/* подэкраны */
.head{padding:16px 0 4px}.h1{font-size:28px;line-height:33px;font-weight:800;letter-spacing:-.02em;margin:3px 0 8px}
.prose{font-size:16px;line-height:25px;color:var(--ink2)}
.prose p{margin:0 0 14px}.prose strong{color:var(--ink)}
.empty{padding:60px 24px;text-align:center;color:var(--meta)}
.empty .em{font-size:36px;margin-bottom:10px}
.statusbox{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.statusbox .l{font-size:13px;font-weight:700;color:var(--meta);text-transform:uppercase;letter-spacing:.03em}
.statusbox .v{font-size:16px;font-weight:700;margin-top:4px}
.statusbox .v .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--meta);margin-right:7px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}.toggle .t{font-size:15px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.sw.on{background:var(--gold)}.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}.sw.on i{left:21px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(251,250,247,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:720px;margin:0 auto;display:flex}
.ni{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--meta);cursor:pointer}
.ni svg{width:24px;height:24px}.ni .lb{font-size:11px;font-weight:600}.ni.on{color:var(--gold)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<nav class="nav"><div class="navin">
 <button class="ni" onclick="location.href='explore.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 1.5L13 16l-1.5-4.5z"/></svg><span class="lb">Исследовать</span></button>
 <button class="ni" onclick="location.href='solve-home.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5A2.5 2.5 0 0 0 6.5 8H20"/></svg><span class="lb">Решить</span></button>
 <button class="ni" onclick="location.href='quests.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg><span class="lb">Расти</span></button>
 <button class="ni on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="lb">Меню</span></button>
</div></nav>

<script>
var D={be:"Поведенческая экономика",cog:"Когнитивная психология",soc:"Социальная психология",prod:"Продуктовые практики",mot:"Мотивация/идентичность",ux:"UX / HCI",org:"Орг-системы",neu:"Нейронаука/тело"};
var DCOLV={be:"--be",cog:"--cog",soc:"--soc",prod:"--prod",mot:"--mot",ux:"--ux",org:"--org",neu:"--neu"};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function cssv(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

var STATE={member:false, name:'', email:'', territory:null, mcpOn:false};
var qs=new URLSearchParams(location.search); var VIEW=qs.get('view');

function icon(p){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; }
var IC={book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/>',star:'<path d="M12 3l2.6 6.3L21 10l-4.8 4 .8 6.7L12 17.6 6 20.7l.8-6.7L2 10l6.4-.7z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',plug:'<path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0z"/><path d="M12 16v5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',cv:'<path d="M9 6l6 6-6 6"/>'};

function row(view,ic,t,badge){ return '<div class="mrow" data-view="'+view+'">'+icon(ic)+'<span class="t">'+esc(t)+'</span>'+(badge?'<span class="badge">'+esc(badge)+'</span>':'')+'<svg class="cv" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>'; }

function renderHub(){
 var H='<div class="bar"><div class="bt">Меню</div></div>';
 if(STATE.member){
  var t=STATE.territory||{lit:0,total:517,by_discipline:[],frontier_open:0};
  var pct=t.total?Math.round(t.lit/t.total*100):0;
  H+='<div class="prof"><div class="prow"><div class="av">'+esc((STATE.name||STATE.email||'?').slice(0,1).toUpperCase())+'</div><div class="pinfo"><div class="nm">'+esc(STATE.name||'Читатель')+'</div><div class="em">'+esc(STATE.email||'')+'</div></div></div>'+
   '<div class="terr"><div class="terrh"><span class="l">Изучено идей</span><span class="v">'+t.lit+' из '+t.total+'</span></div><div class="pbar"><i style="width:'+Math.max(2,pct)+'%"></i></div>'+
   '<div class="terrm">'+(t.frontier_open?('открыто '+t.frontier_open+' гипотез на фронтире · '):'')+pct+'% карты зажжено</div>';
  if(t.by_discipline&&t.by_discipline.length){ H+='<div class="discs">'+t.by_discipline.slice(0,6).map(function(d){ var k=d.key||'be'; var dp=d.total?Math.round(d.lit/d.total*100):0; return '<div class="drow"><span class="nm">'+esc(D[k]||d.label||k)+'</span><span class="mini"><i style="width:'+Math.max(3,dp)+'%;background:var('+(DCOLV[k]||'--be')+')"></i></span><span class="ct">'+d.lit+'/'+d.total+'</span></div>'; }).join('')+'</div>'; }
  H+='</div>';
 } else {
  H+='<div class="guest"><p>Вы листаете как гость. Честный слой виден, но прогресс, заметки и реакции — после входа.</p><button class="btn pri" onclick="location.href=\'access.html\'">Войти</button></div>';
 }
 H+='<div class="seclbl">Личное</div><div class="menu">'+row('polka',IC.book,'Полка')+row('favorites',IC.star,'Избранное')+'</div>';
 H+='<div class="seclbl">О проекте</div><div class="menu">'+row('about',IC.user,'Об авторе и принципах')+row('mcp',IC.plug,'Доступ к MCP', STATE.mcpOn?'включено':'выключено')+row('settings',IC.gear,'Настройки')+'</div>';
 if(STATE.member) H+='<div class="sign"><button id="signout">Выйти</button></div>';
 document.getElementById('wrap').innerHTML=H;
 Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(el){ el.onclick=function(){ location.href='personal.html?view='+el.getAttribute('data-view'); }; });
 var so=document.getElementById('signout'); if(so) so.onclick=function(){ if(window.__SB) window.__SB.auth.signOut().then(function(){ location.href='access.html'; }); else location.href='access.html'; };
}

function sub(title, inner){
 document.getElementById('wrap').innerHTML='<div class="bar"><button class="ib" id="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><div class="bt">'+esc(title)+'</div></div>'+inner;
 document.getElementById('back').onclick=function(){ location.href='personal.html'; };
}

function renderView(v){
 if(v==='polka') sub('Полка','<div class="empty"><div class="em">📑</div>Сохраняй интересное — появится здесь.<br>Карточки и атомы под рукой, в том числе офлайн.</div>');
 else if(v==='favorites') sub('Избранное','<div class="empty"><div class="em">★</div>Отмечай ★ на карточках — собирай нужное в одном месте.</div>');
 else if(v==='about') sub('Об авторе и принципах',
   '<div class="head"><div class="h1">Честно о решениях</div></div><div class="prose">'+
   '<p>Это база знаний о том, как люди принимают решения, собранная для продакт-менеджеров. Не сборник лайфхаков, а связанный граф идей из поведенческой экономики, психологии и UX.</p>'+
   '<p><strong>Честность устойчивости.</strong> У каждой идеи помечено, насколько она подтверждена: «подтверждено», «неоднозначно» или «спорно». Где идея ещё гипотеза — она в разделе «Ещё не доказано», с полосой уверенности и оговорками. Мы не выдаём догадки за факты.</p>'+
   '<p><strong>Firewall.</strong> Мы свободно называем и разбираем тёмные паттерны — но никогда не применяем их к собственным читателям. Никаких поддельных лотерей, давления и манипулятивных триггеров здесь.</p>'+
   '<p>Проект открывается узким кругом по приглашениям.</p></div>');
 else if(v==='mcp') sub('Доступ к MCP',
   '<div class="head"><div class="h1">Честный слой для ИИ</div></div><div class="prose">'+
   '<p>MCP (Model Context Protocol) даёт любому ИИ-ассистенту доступ к этой базе знаний — с теми же пометками устойчивости и оговорками. Ваш ассистент сможет отвечать на продуктовые вопросы, опираясь на честный граф, а не на догадки.</p>'+
   '<p>Это power-tool для продвинутых: подключение появится, когда доступ откроют.</p></div>'+
   '<div class="statusbox"><div class="l">Статус подключения</div><div class="v"><span class="dot"></span>'+(STATE.mcpOn?'Включено':'Выключено по умолчанию')+'</div></div>');
 else if(v==='settings') sub('Настройки',
   '<div style="margin-top:18px"><div class="toggle"><span class="t">Тёмная тема</span><div class="sw" id="sw1"><i></i></div></div>'+
   '<div class="toggle"><span class="t">Уведомления о новом</span><div class="sw on" id="sw2"><i></i></div></div>'+
   '<div class="toggle"><span class="t">Сохранять для офлайна</span><div class="sw" id="sw3"><i></i></div></div></div>'+
   '<p style="color:var(--meta);font-size:13px;margin-top:16px">Настройки применяются на этом устройстве.</p>');
 else { renderHub(); return; }
 Array.prototype.forEach.call(document.querySelectorAll('.sw'),function(s){ s.onclick=function(){ s.classList.toggle('on'); }; });
}

if(VIEW) renderView(VIEW); else renderHub();

// живой режим
(function boot(){
 function go(){
  try{
   if(!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient)) return;
   var SB=window.supabase.createClient(String(window.SUPABASE_URL).trim(),String(window.SUPABASE_ANON_KEY).trim()); window.__SB=SB;
   SB.auth.getSession().then(function(s){ var sess=s&&s.data&&s.data.session;
    STATE.member=!!sess; if(sess){ STATE.email=sess.user.email||''; STATE.name=(sess.user.user_metadata&&(sess.user.user_metadata.name||sess.user.user_metadata.full_name))||''; }
    if(STATE.member){ SB.rpc('my_territory').then(function(r){ if(r&&!r.error&&r.data){ STATE.territory=r.data; } if(!VIEW) renderHub(); }).catch(function(){ if(!VIEW) renderHub(); }); }
    if(!VIEW) renderHub(); else renderView(VIEW);
   }).catch(function(){});
  }catch(_){}
 }
 function load(src,cb){ var sc=document.createElement('script'); sc.src=src; sc.onload=cb; sc.onerror=cb; document.head.appendChild(sc); }
 function loadCfg(done){ var ps=['../config.js','./config.js','config.js','/book-reader/config.js']; var i=0; (function nx(){ if(window.SUPABASE_URL||i>=ps.length) return done(); var sc=document.createElement('script'); sc.src=ps[i++]; sc.onload=function(){ setTimeout(function(){ window.SUPABASE_URL?done():nx(); },0); }; sc.onerror=nx; document.head.appendChild(sc); })(); }
  loadCfg(function(){ load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', go); });
})();
</script>
</body>
</html>
