// merge-on-login: слить localStorage-избранное (карточки) → БД, только отсутствующее, затем очистить локаль
function mergeFavs(SB, done){
 var local=favGet(); if(!local.length){ if(done)done(); return; }
 SB.rpc('saves_list',{p_kind:'card'}).then(function(r){
  var have={}; ((r&&!r.error&&r.data)||[]).forEach(function(x){ have[x.slug]=1; });
  var pend=local.filter(function(x){ return x&&x.slug&&!have[x.slug]; });
  var i=0; (function nx(){ if(i>=pend.length){ try{localStorage.removeItem('mc:fav');}catch(e){} if(done)done(); return; }
   var it=pend[i++]; SB.rpc('save_toggle',{p_slug:it.slug,p_title:it.title||it.slug,p_kind:'card'}).then(nx,nx); })();
 },function(){ if(done)done(); });
}

function mcLikelySignedIn(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf('sb-')===0&&k.indexOf('-auth-token')>0){ var v=localStorage.getItem(k); if(v&&v.length>20) return true; } } }catch(e){} return false; }

try{ var _ps=localStorage.getItem('personal:state'); if(_ps){ var _pd=JSON.parse(_ps); if(_pd){ STATE.email=_pd.email||''; STATE.name=_pd.name||''; STATE.territory=_pd.territory||null; STATE.signedIn=!!_pd.signedIn; } } }catch(e){}

  }

 } else if(STATE.signedIn){
  H+='<div class="guest"><p>Вы вошли, но членство книги — по приглашению. Прогресс, заметки и реакции откроются по ссылке от участника.</p><a class="btn pri" href="access.html" style="display:inline-flex;text-decoration:none;margin-bottom:10px">Как получить доступ</a><div><button class="psignout" id="signout" type="button">Выйти</button></div></div>';
 } else {

 }

 //  • есть позиция → «Мой путь · продолжить»;  • нет и карта пуста → онбординг «Начать Путь». Таб «Путь» = глобальный вход.
 if(_pl){
  var _pt=(_pl.title?_pl.title+' · ':'')+'остановка '+_pl.stop+(_pl.m?(' из '+_pl.m):'');

 }
 H+='<div class="seclbl">Личное</div><div class="menu">'+row('favorites',IC.star,'Сохранённое')+(STATE.member?row('community',IC.people,'Сообщество'):'')+'</div>';
 // «Диагностика метода» убрана из прода (реш. Артёма)
 // MCP — доступ участнику всегда открыт (это не тумблер): убран ложный бейдж «выключено» (6ac1f4c6; MOM E2E: MCP жив, лейбл врал).
 H+='<div class="seclbl">О проекте</div><div class="menu">'+row('about',IC.user,'Об авторе и принципах')+row('mcp',IC.plug,'Доступ к MCP')+row('settings',IC.gear,'Настройки')+
   '<div class="mrow" role="button" tabindex="0" id="appUpd">'+icon(IC.refresh)+'<span class="t">Обновить приложение</span><svg class="cv" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div></div>';
 if(STATE.member && (STATE.email||'').toLowerCase()==='temka.avdeev@gmail.com'){
  var _chev='<svg class="cv" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  H+='<div class="seclbl">Админ</div><div class="menu">'+

     '<div class="mrow" role="button" tabindex="0" onclick="location.href=\'index-admin.html#dash\'">'+icon(IC.gear)+'<span class="t">Старая админка · редакторы</span>'+_chev+'</div>'+
     '</div>';
 }
 // Интерфейс-откат «к старой версии» — ТОЛЬКО админу (1f9546e7 ч.2): всем остальным новый интерфейс по умолчанию, без тумблера отката.
 if(STATE.member && (STATE.email||'').toLowerCase()==='temka.avdeev@gmail.com') H+='<div class="seclbl">Интерфейс</div><div class="menu"><div class="mrow" role="button" tabindex="0" onclick="location.href=\'index.html?v2=1\'">'+icon(IC.gear)+'<span class="t">Вернуться к старой версии</span><svg class="cv" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div></div>';
 // «Выйти» переехала в карточку профиля (рядом с читателем, реш. Артёма); нижняя дублирующая убрана
 document.getElementById('wrap').innerHTML=H;
 Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(el){ el.onclick=function(){ location.href='personal.html?view='+el.getAttribute('data-view'); }; });
 var so=document.getElementById('signout'); if(so) so.onclick=function(){ if(!confirm('Точно выйти из аккаунта?')) return; clearLocalProgress(); if(window.__SB) window.__SB.auth.signOut().then(function(){ location.href='access.html'; }); else location.href='access.html'; };
 // «Обновить приложение»: снимаем service-worker и весь кеш → гарантированно свежая версия с сервера (бейдж «v5» убран — читался как вечное уведомление)
 var _up=document.getElementById('appUpd');
 if(_up) _up.onclick=function(){ _up.querySelector('.t').textContent='Обновляю…';
  Promise.resolve().then(function(){ if('serviceWorker' in navigator) return navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){return r.unregister();})); }); })
   .then(function(){ if(window.caches&&caches.keys) return caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){return caches.delete(k);})); }); })
   .catch(function(){}).then(function(){ location.reload(true); });
 };
 checkRelease();

// красная точка на «Пульт флота», когда есть сборка новее, чем в проде (та же логика, что в pult.html)
function checkRelease(){
 var d=document.getElementById('reldot'); if(!d||!window.__SB) return;
 window.__SB.rpc('deploy_candidates_list').then(function(r){
  if(!r||r.error||!r.data||!r.data.length){ return; }
  var rows=r.data; var live=rows.filter(function(x){return x.is_live;})[0];
  var liveT=live?Date.parse(live.ingested_at):Infinity;
  var pend=rows.filter(function(x){return !x.is_live && Date.parse(x.ingested_at)>=liveT;}).length;
  if(pend>0){ d.style.display='inline-block'; d.title=pend+' '+(pend===1?'сборка ждёт':'сборок ждут')+' публикации'; }
 }).catch(function(){});
}

 // Пер-клиентские карточки (6ac1f4c6): Claude — подтверждённо рабочая; Perplexity/DeepSeek — честная заглушка (не публикуем непроверенные шаги).

  '</div>';
 el.innerHTML='<div class="tokbox"><div class="l">Ваш MCP-токен</div><code id="mTok">'+esc(tok)+'</code><button class="mcpbtn" id="mCopyTok">Скопировать токен</button></div>'+
